        // Position-aware IPA hints to reduce false positives
        function getPronunciationHint(target, spoken) {
            if (!target || !spoken) return "";

            const t = String(target).toLowerCase();
            const s = String(spoken).toLowerCase();

            // Rule 1: TH sound
            if (t.includes("th") && !s.includes("th")) {
                return "Âm /θ/ hoặc /ð/ (đặt lưỡi giữa răng)";
            }

            // Loop-based for position-aware phonetic errors
            const minLen = Math.min(t.length, s.length);
            for (let i = 0; i < minLen; i++) {
                // Rule 2: R vs L
                if (t[i] === 'r' && s[i] === 'l') {
                    return "Phân biệt /r/ (lưỡi cong) và /l/ (chạm lợi)";
                }
                // Rule 3: F vs P (ESL error)
                if (t[i] === 'f' && s[i] === 'p') {
                    return "Phân biệt /f/ (răng môi) và /p/ (bật hơi)";
                }
                // Rule 4: V vs B (ESL error)
                if (t[i] === 'v' && s[i] === 'b') {
                    return "Phân biệt /v/ và /b/";
                }
            }

            // Rule 5: Final -ed (check for sound)
            if (t.endsWith("ed")) {
                if (!s.endsWith("ed") && !s.endsWith("t") && !s.endsWith("d")) {
                    return "Đuôi -ed: /t/, /d/, hoặc /ɪd/";
                }
            }

            // Rule 6: Final -s/-es
            if (t.endsWith("s") && !s.endsWith("s")) {
                return "Đuôi -s: /s/ hoặc /z/";
            }
        }

        // [DUKE] Double Metaphone Algorithm for ESL Phonetic Matching
        function doubleMetaphone(word) {
            if (!word) return ["", ""];
            let w = String(word).toUpperCase().replace(/[^A-Z]/g, "");
            if (w.length === 0) return ["", ""];
            
            let current = 0;
            let length = w.length;
            let primary = "";
            let alternate = "";
            
            function isVowel(ch) {
                return ["A", "E", "I", "O", "U", "Y"].includes(ch);
            }
            
            while (current < length && primary.length < 4) {
                let ch = w[current];
                if (isVowel(ch)) {
                    if (current === 0) { primary += "A"; alternate += "A"; }
                    current++;
                } else if (ch === 'B') {
                    primary += 'P'; alternate += 'P';
                    current = (w[current + 1] === 'B') ? current + 2 : current + 1;
                } else if (ch === 'C') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'S'; alternate += 'S';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'D') {
                    if (w[current + 1] === 'G') {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'F' || ch === 'V') {
                    primary += 'F'; alternate += 'F';
                    current++;
                } else if (ch === 'G') {
                    if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'H') {
                    if (current === 0 || isVowel(w[current - 1])) {
                        primary += 'H'; alternate += 'H';
                    }
                    current++;
                } else if (ch === 'J') {
                    primary += 'J'; alternate += 'J';
                    current++;
                } else if (ch === 'K' || ch === 'Q') {
                    primary += 'K'; alternate += 'K';
                    current++;
                } else if (ch === 'L') {
                    primary += 'L'; alternate += 'L';
                    current++;
                } else if (ch === 'M') {
                    primary += 'M'; alternate += 'M';
                    current++;
                } else if (ch === 'N') {
                    primary += 'N'; alternate += 'N';
                    current++;
                } else if (ch === 'P') {
                    if (w[current + 1] === 'H') {
                        primary += 'F'; alternate += 'F';
                        current += 2;
                    } else {
                        primary += 'P'; alternate += 'P';
                        current++;
                    }
                } else if (ch === 'R') {
                    primary += 'R'; alternate += 'R';
                    current++;
                } else if (ch === 'S') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else {
                        primary += 'S'; alternate += 'S';
                        current++;
                    }
                } else if (ch === 'T') {
                    if (w[current + 1] === 'H') {
                        primary += '0'; alternate += '0';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'W') {
                    if (isVowel(w[current + 1])) {
                        primary += 'A'; alternate += 'A';
                    }
                    current++;
                } else if (ch === 'X') {
                    primary += 'KS'; alternate += 'KS';
                    current++;
                } else if (ch === 'Z') {
                    primary += 'S'; alternate += 'S';
                    current++;
                } else {
                    current++;
                }
            }
            return [primary, alternate];
        }

        // [DUKE] Detect Lesson Level dynamically
        function getLessonLevel() {
            if (typeof lessonLevel !== 'undefined' && lessonLevel) return lessonLevel.toUpperCase();
            const title = (document.title || "").toUpperCase();
            const path = window.location.pathname.toUpperCase();
            if (title.includes("LEVEL A") || path.includes("LEVEL A") || path.includes("LEVEL_A") || path.includes("A4. LUYEN NGHE")) return "A";
            if (title.includes("LEVEL C") || path.includes("LEVEL C") || path.includes("LEVEL_C") || path.includes("C4. LUYEN NGHE")) return "C";
            if (title.includes("LEVEL B") || path.includes("LEVEL B") || path.includes("LEVEL_B") || path.includes("B4. LUYEN NGHE")) return "B";
            return "B";
        }

        // [DUKE] Hybrid Phonetic match function with Level-specific adjustments
        function isPhoneticMatch(tVal, sVal, lvl) {
            if (tVal === sVal) return 1.0;
            const [tPri, tAlt] = doubleMetaphone(tVal);
            const [sPri, sAlt] = doubleMetaphone(sVal);
            if (!tPri || !sPri) return 0.0;
            
            if (tPri === sPri || (tAlt && sAlt && tAlt === sAlt)) {
                return 1.0;
            }
            
            if (lvl === "A") {
                // Nuốt âm cuối: so sánh mã Metaphone cắt bỏ ký tự cuối
                const tCut = tPri.slice(0, -1);
                const sCut = sPri.slice(0, -1);
                if (tCut && sCut && tCut === sCut) {
                    return 0.95;
                }
            }
            return getCharSimilarity(tPri, sPri);
        }

        const IPA_FULL_CREDIT_ALIASES = {
            "ant": ["and"],
            "son": ["sun"]
        };

        function getIpaWordClass(targetText) {
            const words = splitToCleanWords(normalizePhraseCanonical(targetText));
            if (words.length !== 1) return 'phrase';
            const word = words[0] || '';
            const syllableGroups = (word.match(/[aeiouy]+/g) || []).length;
            if (word.length <= 3) return 'short';
            if (word.length >= 8 || syllableGroups >= 3) return 'complex';
            return 'normal';
        }

        function selectBestIpaTranscript(targetText, candidates, level, modeCfg) {
            const unique = [];
            (Array.isArray(candidates) ? candidates : [candidates]).forEach((candidate) => {
                const value = String(candidate || '').trim();
                if (value && !unique.includes(value)) unique.push(value);
            });
            if (unique.length === 0) return '';

            const candidateConfig = Object.assign({ level: level }, modeCfg);
            return unique.map((candidate, index) => ({
                candidate,
                index,
                result: dukeScorePronunciation(targetText, candidate, candidateConfig)
            })).sort((a, b) => {
                if (b.result.accuracy !== a.result.accuracy) return b.result.accuracy - a.result.accuracy;
                if (a.result.tokenMatchResults.filter((item) => item.status === 'wrong').length !== b.result.tokenMatchResults.filter((item) => item.status === 'wrong').length) {
                    return a.result.tokenMatchResults.filter((item) => item.status === 'wrong').length - b.result.tokenMatchResults.filter((item) => item.status === 'wrong').length;
                }
                return a.index - b.index;
            })[0].candidate;
        }

        function isIpaFullCreditEquivalent(targetValue, spokenValue) {
            if (!targetValue || !spokenValue || /\d/.test(targetValue)) return false;
            if (IPA_FULL_CREDIT_ALIASES[targetValue] && IPA_FULL_CREDIT_ALIASES[targetValue].includes(spokenValue)) return true;
            const [targetPrimary] = doubleMetaphone(targetValue);
            const [spokenPrimary] = doubleMetaphone(spokenValue);
            return targetPrimary.length >= 2 && targetPrimary === spokenPrimary;
        }

        function comparePronunciation(spokenText) {
            try {
                if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                const data = GAME_SESSION[currentIndex];
                if (data && !pronunciationGameActive) data.attemptCount = (data.attemptCount || 0) + 1;

                const isIPAMode = (document.body.getAttribute('data-mode') === 'ipa');
                const lvl = getLessonLevel();
                let modeCfg;

                if (isIPAMode) {
                    modeCfg = DUKE_SCORING_CONFIG.ipa_strict || {
                        confusion: 0.95, phonetic: 0.90, fuzzyHigh: 0.85, fuzzyLow: 0.70,
                        contraction: 1.0, exactThreshold: 0.92, fuzzyThreshold: 0.88, passScore: 88
                    };
                } else if (lvl === "A") {
                    modeCfg = DUKE_SCORING_CONFIG.level_a;
                } else if (lvl === "C") {
                    modeCfg = DUKE_SCORING_CONFIG.level_c;
                } else {
                    modeCfg = DUKE_SCORING_CONFIG[scoringMode] || DUKE_SCORING_CONFIG.youth;
                }

                let eThresh = modeCfg.exactThreshold || DUKE_SCORING_CONFIG.exactThreshold;
                let fThresh = modeCfg.fuzzyThreshold || DUKE_SCORING_CONFIG.fuzzyThreshold;
                let pScore = modeCfg.passScore || DUKE_SCORING_CONFIG.passScore;
                let missingPenaltyCoeff = (modeCfg.missingPenalty !== undefined) ? modeCfg.missingPenalty : 0.25;

                const item = lessonData[currentIndex];
                // CRITICAL: IPA mode scores ONLY against title. Non-IPA scores against text.
                const originalText = isIPAMode ? (item.title || "") : item.text;
                if (isIPAMode) {
                    const wordClass = getIpaWordClass(originalText);
                    if (wordClass === 'short') modeCfg = Object.assign({}, modeCfg, { passScore: Math.min(modeCfg.passScore || 88, 80) });
                    else if (wordClass === 'complex') modeCfg = Object.assign({}, modeCfg, { passScore: Math.min(modeCfg.passScore || 88, 84) });
                    spokenText = selectBestIpaTranscript(originalText, spokenText, lvl, modeCfg);
                    eThresh = modeCfg.exactThreshold || DUKE_SCORING_CONFIG.exactThreshold;
                    fThresh = modeCfg.fuzzyThreshold || DUKE_SCORING_CONFIG.fuzzyThreshold;
                    pScore = modeCfg.passScore || DUKE_SCORING_CONFIG.passScore;
                    missingPenaltyCoeff = (modeCfg.missingPenalty !== undefined) ? modeCfg.missingPenalty : 0.25;
                }
                // Canonical phrase normalization layer (collapse spoken variants)
                const normalizedTarget = normalizePhraseCanonical(originalText);
                const tokens = buildTargetTokens(normalizedTarget);

                const spokenNormalized = normalizePhraseCanonical(spokenText);
                const spokenCleanRaw = splitToCleanWords(spokenNormalized);
                const { canonicalList: spokenCanon } = collapseNumericalTokens(spokenCleanRaw);
                const spokenPhrase = normalizeTranscriptForPhraseMatch(spokenText);

                // Danh sách từ mục tiêu "được chấm"
                const targetList = [];
                const wordToTokenIndex = []; // index trong targetList -> index trong tokens

                tokens.forEach((t, tokenIdx) => {
                    if (t.skip) return;
                    (t.cleanParts || []).forEach(part => {
                        targetList.push(part);
                        wordToTokenIndex.push(tokenIdx);
                    });
                });

                // Canonicalize targetList
                const { canonicalList: targetCanon, originalToCanonicalIndex: tMap } = collapseNumericalTokens(targetList);

                // --- Phrase chunking to improve multi-word alignment before LCS ---
                const matchedTIndices = new Set();
                const matchedSIndices = new Set();
                const phraseMatches = [];

                const targetChunks = buildPhraseChunks(targetCanon);
                const spokenChunks = buildPhraseChunks(spokenCanon);

                // Prioritize longer chunks
                [3, 2, 1].forEach(len => {
                    targetChunks.filter(tc => (tc.end - tc.start + 1) === len).forEach(tc => {
                        // Avoid forEach callback early-return bug when checking chunk overlap
                        let skipTargetChunk = false;
                        for (let i = tc.start; i <= tc.end; i++) {
                            if (matchedTIndices.has(i)) {
                                skipTargetChunk = true;
                                break;
                            }
                        }
                        if (skipTargetChunk) return;
                        for (const sc of spokenChunks) {
                            if ((sc.end - sc.start + 1) !== len) continue;
                            let sRangeUsed = false;
                            for (let j = sc.start; j <= sc.end; j++) if (matchedSIndices.has(j)) { sRangeUsed = true; break; }
                            if (sRangeUsed) continue;

                            // Semantic variant matching for spoken forms (e.g., gonna, wanna, o'clock variants)
                            if (tc.text === sc.text || isContractionEquivalent(tc.text, sc.text) || matchSemanticVariant(tc.text, sc.text)) {
                                for (let i = tc.start; i <= tc.end; i++) matchedTIndices.add(i);
                                for (let j = sc.start; j <= sc.end; j++) matchedSIndices.add(j);
                                for (let k = 0; k < len; k++) {
                                    phraseMatches.push({ tIdx: tc.start + k, sIdx: sc.start + k, similarity: 1.0 });
                                }
                                break;
                            }
                        }
                    });
                });

                // LCS trên các token còn lại
                const targetForLCS = targetCanon.map((v, i) => matchedTIndices.has(i) ? `__T${i}__` : v);
                const spokenForLCS = spokenCanon.map((v, i) => matchedSIndices.has(i) ? `__S${i}__` : v);
                const fuzzyMatches = lcsMatchIndices(targetForLCS, spokenForLCS);

                const matchedMap = new Map(); // tIdx in targetCanon -> { sIdx, similarity }
                phraseMatches.forEach(m => matchedMap.set(m.tIdx, { sIdx: m.sIdx, similarity: m.similarity }));
                fuzzyMatches.forEach(m => {
                    if (!matchedMap.has(m.tIdx)) matchedMap.set(m.tIdx, { sIdx: m.sIdx, similarity: m.similarity });
                });

                let totalWeight = 0;
                let earnedScore = 0;
                let missingImportantPenalty = 0;
                let htmlResult = "";

                const tokenMatchResults = tokens.map((t, tIdx) => {
                    if (t.skip) return { status: 'skip', score: 0 };

                    // Penalize missing words: tokens without any match contribute 0 score but full weight
                    totalWeight += t.weight;

                    const wordIndices = [];
                    wordToTokenIndex.forEach((val, idx) => { if (val === tIdx) wordIndices.push(idx); });

                    let maxScoreFactor = 0;
                    let bestStatus = 'wrong';
                    let bestSpokenValue = "";

                    wordIndices.forEach(wIdx => {
                        const cIdx = tMap[wIdx];
                        if (matchedMap.has(cIdx)) {
                            const match = matchedMap.get(cIdx);
                            const tValue = targetCanon[cIdx];
                            const sValue = spokenCanon[match.sIdx];

                            let currentScoreFactor = 0;
                            let currentStatus = 'wrong';

                            const pMatchScore = isPhoneticMatch(tValue, sValue, lvl);

                            if (tValue === sValue) {
                                currentScoreFactor = 1.0;
                                currentStatus = 'correct';
                            }
                            else if (isIPAMode && targetCanon.length === 1 && isIpaFullCreditEquivalent(tValue, sValue)) {
                                currentScoreFactor = 1.0;
                                currentStatus = 'accepted';
                            }
                            else if (!/\d/.test(tValue) && isConfusionEquivalent(tValue, sValue)) {
                                currentScoreFactor = modeCfg.confusion;
                                currentStatus = 'close';
                            }
                            else if (!/\d/.test(tValue) && (pMatchScore >= 0.9 || (targetCanon.length === 1 && pMatchScore >= 0.75))) {
                                currentScoreFactor = (targetCanon.length === 1) ? Math.max(modeCfg.phonetic, modeCfg.phonetic * pMatchScore) : (modeCfg.phonetic * pMatchScore);
                                currentStatus = 'close';
                            }
                            else {
                                const sim = match.similarity;
                                if (sim >= eThresh) {
                                    currentScoreFactor = 1.0;
                                    currentStatus = 'close';
                                }
                                else if (sim >= 0.65) {
                                    currentScoreFactor = modeCfg.fuzzyHigh;
                                    currentStatus = 'close';
                                }
                                else if (sim >= fThresh) {
                                    currentScoreFactor = modeCfg.fuzzyLow;
                                    currentStatus = 'close';
                                }
                            }

                            if (currentScoreFactor > maxScoreFactor) {
                                maxScoreFactor = currentScoreFactor;
                                bestStatus = currentStatus;
                                bestSpokenValue = sValue;
                            }
                        }
                    });

                    // Override contraction (global search như cũ nếu LCS không khớp)
                    if (maxScoreFactor < 1.0 && t.contractionKey) {
                        // Two-way contraction matching (e.g., "I'm" ↔ "I am")
                        if (isContractionInTranscript(spokenPhrase, t.contractionKey)) {
                            maxScoreFactor = modeCfg.contraction;
                            bestStatus = 'close';
                        }
                    }

                    if (maxScoreFactor === 0) {
                        // Extra penalty for missing words, stronger on important tokens
                        if (t.weight >= 1.0) missingImportantPenalty += missingPenaltyCoeff * t.weight;
                        else missingImportantPenalty += (missingPenaltyCoeff * 0.4) * t.weight;
                    }

                    earnedScore += (maxScoreFactor * t.weight);
                    return {
                        status: bestStatus,
                        score: maxScoreFactor * t.weight,
                        spokenValue: bestSpokenValue
                    };
                });

                earnedScore = Math.max(0, earnedScore - missingImportantPenalty);

                tokens.forEach((t, tIdx) => {
                    const res = tokenMatchResults[tIdx];
                    if (res.status === 'skip') {
                        htmlResult += `<span class="w-skip">${t.display} </span>`;
                    } else if (res.status === 'correct') {
                        htmlResult += `<span class="w-correct">${t.display} </span>`;
                    } else if (res.status === 'accepted') {
                        htmlResult += `<span class="w-correct" title="Nhận diện tương đương">${t.display} </span>`;
                    } else if (res.status === 'close') {
                        htmlResult += `<span class="w-close">${t.display} </span>`;
                    } else {
                        // Use best matched spoken token for more accurate pronunciation hints
                        const hintTarget = (t.cleanParts && t.cleanParts[0]) || t.display;
                        const hint = getPronunciationHint(hintTarget, res.spokenValue || "");
                        htmlResult += `<span class="w-wrong" title="${hint || 'Phát âm chưa chính xác'}">${t.display}</span> `;
                    }
                });

                const accuracy = (totalWeight === 0) ? 100 : Math.round((earnedScore / totalWeight) * 100);
                const effectivePassScore = pronunciationGameActive ? 80 : pScore;
                const isPass = accuracy >= effectivePassScore;

                // Record attempt history
                if (data) {
                    data.attemptsHistory = data.attemptsHistory || [];
                    data.attemptsHistory.push(accuracy);
                }

                let isEncouraged = false;
                if (!isPass && data && data.attemptCount >= 3) {
                    const last3 = data.attemptsHistory.slice(-3);
                    if (last3.length >= 3 && last3.every(s => s < pScore)) {
                        const minScore = Math.min(...last3);
                        const maxScore = Math.max(...last3);
                        if ((maxScore - minScore) <= 15) {
                            isEncouraged = true;
                        }
                    }
                }

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');

                const badgeClass = isPass ? "score-perfect" : "score-bad";
                const badgeText = isPass ? `PASS: ${accuracy}%` : (isEncouraged ? `Hãy về luyện tập thêm nhé! (${accuracy}%)` : `FAIL: ${accuracy}%`);

                feedbackBox.innerHTML = `
                    <div class="speech-score-badge ${badgeClass}">${badgeText}</div>
                    <div class="speech-detail">${htmlResult}</div>
                `;

                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const flashcard = document.querySelector('.flashcard');
                if (flashcard) flashcard.appendChild(feedbackBox);

                if (isGameMode && isPass) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && !data.isFinished) {
                        data.isFinished = true;
                        renderProgressBar();
                        updateMicStatus();
                    }

                    // Thưởng tim cho câu PASS ngay lần đầu 
                    if (data && data.attemptCount === 1 && !data.hasEarnedHeart) {
                        globalHearts++;
                        data.hasEarnedHeart = true;
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
                    }
                }

                if (pronunciationGameActive) {
                    handlePronunciationGameResult(isPass, accuracy);
                }

            } catch (err) {
                reportRuntimeIssue('Pronunciation scoring error', err);
                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');
                feedbackBox.innerHTML = `
                    <div class="speech-score-badge score-bad">CÓ LỖI KHI CHẤM</div>
                    <div class="speech-detail compact">
                        Thầy/cô hãy bấm F5 để tải lại trang. Nếu vẫn lỗi, gửi file này cho tôi để sửa tiếp.
                    </div>
                `;

                const flashcard = document.querySelector('.flashcard');
                if (flashcard) flashcard.appendChild(feedbackBox);
            }
        }

        function showHealEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.classList.add('w-correct');
                badge.innerText = "+1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        document.addEventListener('keydown', function (event) {
            // Skip shortcuts if user is typing in an input field
            const target = event.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;

            const isIPA = document.body.getAttribute('data-mode') === 'ipa';
            const supportsFocus = isFocusModeSupported();
            const isFocus = document.body.classList.contains('focus-mode');

            if (supportsFocus) {
                // Focus Toggle (F)
                if (event.key.toLowerCase() === 'f') {
                    event.preventDefault();
                    toggleFocusMode();
                    return;
                }

                // Focus-specific Zoom/Esc
                if (isFocus) {
                    // Escape to exit focus
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        applyFocusMode(false);
                        return;
                    }
                    // Zoom controls
                    if (event.key === '=') {
                        event.preventDefault();
                        focusAutoFitEnabled = true;
                        ensureFocusZoomFitsCurrentSlide();
                        return;
                    }
                    if (event.key === '-') {
                        event.preventDefault();
                        focusAutoFitEnabled = false;
                        applyFocusZoomScale(1.0);
                        return;
                    }
                }
            }

            if (isIPA) {
                // IPA Visibility (1-5) - Both inside and outside focus
                if (event.key === '1') { setIPAVisibility(1); return; }
                if (event.key === '2') { setIPAVisibility(2); return; }
                if (event.key === '3') { setIPAVisibility(3); return; }
                if (event.key === '4') { setIPAVisibility(4); return; }
                if (event.key === '5') { setIPAVisibility(5); return; }
            }

            if (event.code === 'Space') { event.preventDefault(); handlePlayClick(); }
            else if (event.code === 'ArrowRight') goNext();
            else if (event.code === 'ArrowLeft') goPrev();
            else if (event.code === 'Enter') { event.preventDefault(); toggleMic(); }
            else if (event.key.toLowerCase() === 'a') { event.preventDefault(); playAuto(); }

            // [DUKE UPDATE] Logic phím tắt trong Game Mode
            if (isGameMode && !isGameFinished) {
                const key = event.key.toLowerCase();

                // Trừ Tim (Trọng tài)
                if (event.key === '`') {
                    if (globalHearts > 0) {
                        globalHearts--;
                        showDamageEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        if (globalHearts <= 0) finishGameGlobal(false);
                    }
                }
                // Cộng Tim (Trọng tài)
                else if (event.key === '1') {
                    if (globalHearts < maxGlobalHearts) { // Giới hạn max tim, hoặc bỏ check này nếu muốn cộng thoải mái
                        globalHearts++;
                        showHealEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                    }
                }

                else if (key === 'r') refereeReplay();
                else if (key === 'p') { isTimerPaused = !isTimerPaused; updateTimerDisplay(); }
                else if (event.key === '+' || event.key === '=') { timeLeft += 10; updateTimerDisplay(); }
                else if (event.key === '-' || event.key === '_') { timeLeft = Math.max(0, timeLeft - 10); updateTimerDisplay(); }
                else if (key === 'a') toggleGameMode();
            } else {
                if (event.key.toLowerCase() === 'a' && document.body.getAttribute('data-mode') !== 'ipa') toggleGameMode();
            }
        });

        renderCard(0);
    </script>
</body>
