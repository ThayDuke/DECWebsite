            80% {
                transform: translateX(10px) rotate(5deg);

        .btn-control {

        .btn-nav:disabled {

        .btn-play {

        .btn-auto {

            transform: none;
            box-shadow: none;
        }

        .btn-mic {

            height: 50px;

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 var(--ulti-rgba-239-83-80-07);
            }

            100% {
                box-shadow: 0 0 0 15px var(--ulti-rgba-239-83-80-0);
            }
        }

        .cost-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger-red);
            color: var(--color-on-accent);
            font-size: 12px;
            font-weight: var(--font-weight-strong);
            padding: 3px 8px;
            border-radius: 10px;
            border: 2px solid var(--surface-solid);
            box-shadow: 0 2px 5px var(--ulti-rgba-0-0-0-02);

            z-index: 20;
        }

        .damage-badge {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--danger-red);
            font-weight: var(--font-weight-strong);
            font-size: 18px;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }

        @keyframes popUpFade {
            0% {
                transform: scale(0) translateY(0);
                opacity: 0;
            }

            20% {
                transform: scale(1.2) translateY(-10px);
                opacity: 1;
            }

            80% {
                transform: scale(1) translateY(-20px);
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(-30px);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-30px);
                opacity: 0;
            }

        .speech-feedback-box {
            margin-top: 15px;
            padding: 15px;
            background: var(--ulti-hex-fff);
            border-radius: 15px;
            border: 2px solid var(--ulti-hex-ccc);
            width: 100%;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
        }

        .speech-feedback-box.is-visible {
            display: block;
        }

        .speech-score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .score-perfect {
            background: var(--success-green);
            box-shadow: 0 4px 10px var(--ulti-rgba-46-125-50-03);
        }

        .score-good {
            background: var(--orange-btn);
        }

        .score-bad {
            background: var(--danger-red);
        }

        .speech-detail {
            font-size: 1.5em;
            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        }

        .speech-detail.compact {
            margin-top: 8px;
            color: var(--ulti-hex-555);
            font-size: 1em;
        }

        .w-correct {
            color: var(--success-green);
            font-weight: var(--font-weight-strong);
        }

        .w-close {
            color: var(--orange-btn);
            font-weight: var(--font-weight-strong);
        }

        .w-wrong {
            color: var(--danger-red);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .w-skip {
            color: var(--ulti-rgba-46-125-50-078);
            font-weight: var(--font-weight-strong);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ulti-rgba-0-0-0-06);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .score-title {
            font-size: 2em;
            color: var(--game-purple);
            margin-bottom: 20px;
            font-weight: var(--font-weight-strong);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid var(--ulti-hex-eee);
            padding-bottom: 5px;
        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

        .btn-restart {
            background: var(--btn-primary-bg);
            color: var(--color-on-accent);
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin: var(--lesson-theme-row-margin);
        }

        body[data-mode="ipa"] .theme-row {
            justify-content: flex-end;
            margin: 0;
        }

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            min-height: 44px;
        }

        .ipa-study-controls {
            position: absolute;
            left: 0;
            display: inline-flex;
            align-items: center;
            gap: var(--accent-height);
            min-width: 0;
        }

        .ipa-order-toggle {
            height: 38px;
            min-width: 104px;
            padding: 0 12px;
            border: 1px solid var(--border-main);
            border-radius: var(--toggle-height);
            background: var(--surface-solid);
            color: var(--text-color);
            box-shadow: var(--toggle-slider-shadow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1), color 0.24s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .ipa-order-toggle-switch {
            display: inline-block;
            position: relative;
            width: 72px;
            height: 36px;
            vertical-align: middle;
            margin: 0 10px 0 0;
            user-select: none;
        }

        .ipa-order-toggle-switch input {
            display: none;
        }

        .ipa-order-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--btn-primary-bg); /* Nền đỏ hồng cho Thứ tự */
            transition: .4s;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
            box-sizing: border-box;
            background-clip: padding-box;
        }

        .ipa-order-toggle-switch .slider-knob {
            position: absolute;
            height: 28px;
            width: 28px;
            left: 3px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            border: 2px solid transparent;
            background-color: var(--surface-solid);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, background-color 0.4s ease;
        }

        .ipa-order-toggle-switch input:checked + .slider {
            background: var(--btn-secondary-bg); /* Nền xanh teal cho Ngẫu nhiên */
            box-shadow: var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .ipa-order-toggle-switch input:checked + .slider .slider-knob {
            transform: translateX(38px);
        }
        
        .ipa-order-toggle-switch .slider-knob i {
            font-size: 0.9rem;
            color: var(--focus-action-text, #19a7a0);
            transition: color 0.4s ease;
        }

        .ipa-order-toggle:hover {
            color: var(--primary-pink);
        }

        .ipa-order-toggle:active {
            transform: scale(0.97);
        }

        .ipa-order-toggle:disabled,
        .ipa-timer-segments .segmented-btn:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        .ipa-timer-segments.segmented-control {
            --segment-size: 27px;
            --segment-padding: 2px;
            --segment-gap: 3px;
            --control-width: calc(var(--segment-size) * 3 + var(--segment-gap) * 2 + var(--segment-padding) * 2 + 3px);

            display: flex;
            align-items: center;
            position: relative;
            width: var(--control-width);
            height: var(--dmu-control-small-height);
            padding: var(--segment-padding);
            gap: var(--segment-gap);
            margin: 0 auto;
            border: 1.5px solid #d5e2ef;
            border-radius: var(--dmu-control-small-height);
            background: rgba(245, 247, 250, 0.9);
            box-shadow: none;
            justify-self: center;
            align-self: center;
            box-sizing: border-box;
        }

        .ipa-timer-segments.segmented-control::before {
            content: "";
            position: absolute;
            top: var(--segment-padding);
            left: var(--segment-padding);
            width: var(--segment-size);
            height: var(--segment-size);
            border-radius: 50%;
            background: var(--btn-secondary-bg);
            transform: translateX(var(--ipa-timer-segment-shift, 0));
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
        }

        .ipa-timer-segments .segmented-btn {
            flex: 0 0 var(--segment-size);
            width: var(--segment-size);
            height: var(--segment-size);
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #4a5c70;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: color 0.24s cubic-bezier(0.32, 0.72, 0, 1), transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
            font-size: 0.82rem;
            line-height: 1;
            box-sizing: border-box;
        }

        .ipa-timer-segments .segmented-btn[data-seconds="0"] {
            font-size: 1.25rem;
        }

        .ipa-timer-segments .segmented-btn.active {
            color: #ffffff;
        }

        .ipa-timer-segments .segmented-btn:active {
            transform: scale(0.96);
        }

        .ipa-timer-segments .fa-clock {
            font-size: 0.82em;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
            justify-self: start;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);

                    data-dec-icon-scope="ultitemp" data-dec-icon="mic"><i class="fa-solid fa-microphone" aria-hidden="true"></i></button>
            </div>

                <div id="slide-nav-text" class="slide-nav-text">Slide 1/1</div>

                <div class="pronunciation-hearts" id="pronunciation-hearts" aria-live="polite">
                    <span id="pronunciation-heart-count">0</span><span class="heart-icon" aria-hidden="true">❤️</span>
                </div>
            </div>

    </div>

    <div class="modal-overlay" id="score-modal">
        <div class="modal-content">
            <div class="score-title">TỔNG KẾT THÀNH TÍCH</div>
            <div class="score-row">
                <span><span class="heart-icon">❤️</span> Số tim đạt được:</span>
                <span class="score-val" id="final-hearts">0</span>
            </div>
            <div class="score-row" id="final-replays-row">
                <span><i class="fa-solid fa-headphones score-icon-listen"></i> Số lần nghe lại:</span>
                <span class="score-val" id="final-replays">0</span>
            </div>
            <div id="score-message" class="score-message"></div>
            <button class="btn-restart" id="restart-session-btn" type="button" data-dec-icon-scope="ultitemp" data-dec-icon="restart"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i>Thử lại</button>
        </div>
    </div>

    <script>/**
 * DUKE ENGLISH CENTER - Pronunciation Engine 2.0
 *
 * Source-of-truth for IPA recognition-proxy scoring and Listening/Speaking
 * lexical scoring. Standalone lesson builds inline this file verbatim.
 */

const DukePronunciationEngine = (function createDukePronunciationEngine() {
    'use strict';

    const API_VERSION = '2.0.0';
    const IPA_POLICY_VERSION = '2.0.0';
    const LISTENING_POLICY_VERSION = '3.0.0';
    const LISTENING_PROFILE_VERSION = '3.0.0';

    const IPA_PASS_SCORE = Object.freeze({ A: 84, B: 88, C: 90 });
    const MAX_LISTENING_ALTERNATIVES = Object.freeze({ A: 3, B: 3, C: 5 });
    const FILLERS = new Set(['uh', 'um', 'ah', 'er', 'hmm']);

    // True acoustic homophones only. They are explicit, reviewable ASR aliases.
    const IPA_ACOUSTIC_EQUIVALENTS = Object.freeze({
        allowed: ['aloud'],
        aloud: ['allowed'],
        bare: ['bear'],
        bear: ['bare'],
        blew: ['blue'],
        blue: ['blew'],
        brake: ['break'],
        break: ['brake'],
        buy: ['by', 'bye'],
        by: ['buy', 'bye'],
        bye: ['buy', 'by'],
        cell: ['sell'],
        cent: ['scent', 'sent'],
        deer: ['dear'],
        dear: ['deer'],
        fair: ['fare'],
        fare: ['fair'],
        flour: ['flower'],
        flower: ['flour'],
        hear: ['here'],
        here: ['hear'],
        heel: ['heal'],
        heal: ['heel'],
        hour: ['our'],
        our: ['hour'],
        knew: ['new'],
        know: ['no'],
        mail: ['male'],
        male: ['mail'],
        meat: ['meet'],
        meet: ['meat'],
        new: ['knew'],
        no: ['know'],
        one: ['won'],
        pair: ['pear'],
        pear: ['pair'],
        peace: ['piece'],
        piece: ['peace'],
        read: ['red'],
        red: ['read'],
        right: ['write'],
        sea: ['see'],
        see: ['sea'],
        sell: ['cell'],
        son: ['sun'],
        sun: ['son'],
        tail: ['tale'],
        tale: ['tail'],
        their: ['there', "they're"],
        there: ['their', "they're"],
        to: ['too', 'two'],
        too: ['to', 'two'],
        two: ['to', 'too'],
        weak: ['week'],
        week: ['weak'],
        wear: ['ware', 'where'],
        where: ['ware', 'wear'],
        whole: ['hole'],
        won: ['one'],
        wood: ['would'],
        would: ['wood'],
        write: ['right']
    });

    const NUMBER_WORDS = Object.freeze({
        zero: '0', one: '1', two: '2', three: '3', four: '4',
        five: '5', six: '6', seven: '7', eight: '8', nine: '9',
        ten: '10', eleven: '11', twelve: '12', thirteen: '13', fourteen: '14',
        fifteen: '15', sixteen: '16', seventeen: '17', eighteen: '18', nineteen: '19',
        twenty: '20', thirty: '30', forty: '40', fifty: '50',
        sixty: '60', seventy: '70', eighty: '80', ninety: '90',
        hundred: '100', thousand: '1000', million: '1000000',
        first: '1', second: '2', third: '3', fourth: '4', fifth: '5',
        sixth: '6', seventh: '7', eighth: '8', ninth: '9', tenth: '10',
        eleventh: '11', twelfth: '12', thirteenth: '13', fourteenth: '14',
        fifteenth: '15', sixteenth: '16', seventeenth: '17', eighteenth: '18',
        nineteenth: '19', twentieth: '20', thirtieth: '30'
    });

    // Only unambiguous contractions are expanded without an apostrophe.
    const CONTRACTION_PARTS = Object.freeze({
        "can't": ['can', 'not'],
        cannot: ['can', 'not'],
        dont: ['do', 'not'],
        "don't": ['do', 'not'],
        doesnt: ['does', 'not'],
        "doesn't": ['does', 'not'],
        didnt: ['did', 'not'],
        "didn't": ['did', 'not'],
        wont: ['will', 'not'],
        "won't": ['will', 'not'],
        isnt: ['is', 'not'],
        "isn't": ['is', 'not'],
        arent: ['are', 'not'],
        "aren't": ['are', 'not'],
        wasnt: ['was', 'not'],
        "wasn't": ['was', 'not'],
        werent: ['were', 'not'],
        "weren't": ['were', 'not'],
        couldnt: ['could', 'not'],
        "couldn't": ['could', 'not'],
        wouldnt: ['would', 'not'],
        "wouldn't": ['would', 'not'],
        shouldnt: ['should', 'not'],
        "shouldn't": ['should', 'not'],
        "i'm": ['i', 'am'],
        "you're": ['you', 'are'],
        "he's": ['he', 'is'],
        "she's": ['she', 'is'],
        "it's": ['it', 'is'],
        "we're": ['we', 'are'],
        "they're": ['they', 'are'],
        "i've": ['i', 'have'],
        "you've": ['you', 'have'],
        "we've": ['we', 'have'],
        "they've": ['they', 'have'],
        "i'll": ['i', 'will'],
        "you'll": ['you', 'will'],
        "he'll": ['he', 'will'],
        "she'll": ['she', 'will'],
        "we'll": ['we', 'will'],
        "they'll": ['they', 'will'],
        "there's": ['there', 'is'],
        "what's": ['what', 'is'],
        "that's": ['that', 'is'],
        "o'clock": ['oclock']
    });

    function clamp(value, minimum, maximum) {
        return Math.min(maximum, Math.max(minimum, value));
    }

    function round(value, decimals) {
        const factor = Math.pow(10, decimals);
        return Math.round(value * factor) / factor;
    }

    function normalizeLevel(level) {
        const normalized = String(level || 'B').toUpperCase();
        return normalized === 'A' || normalized === 'C' ? normalized : 'B';
    }

    function normalizeApostrophes(text) {
        return String(text || '').replace(/[’`]/g, "'").replace(/''/g, '"');
    }

    function escapeRegExp(text) {
        return String(text || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    function applyPhraseEquivalences(text, equivalences) {
        let value = normalizeApostrophes(text).normalize('NFC').toLowerCase();
        const entries = Array.isArray(equivalences) ? equivalences.slice() : [];
        entries.sort((a, b) => String(b.canonical || '').length - String(a.canonical || '').length);
        entries.forEach((entry) => {
            const canonical = String(entry && entry.canonical || '').trim().toLowerCase();
            if (!canonical) return;
            const variants = Array.isArray(entry.variants) ? entry.variants.slice() : [];
            variants.sort((a, b) => String(b || '').length - String(a || '').length);
            variants.forEach((rawVariant) => {
                const variant = String(rawVariant || '').trim().toLowerCase();
                if (!variant || variant === canonical) return;
                const pattern = new RegExp(
                    '(^|\\s)' + escapeRegExp(variant).replace(/\\ /g, '\\s+') + '(?=\\s|$)',
                    'g'
                );
                value = value.replace(pattern, '$1' + canonical);
            });
        });
        return value;
    }

    function normalizeSurface(text, equivalences) {
        let value = applyPhraseEquivalences(text, equivalences);
        value = value.replace(/[-–—/]+/g, ' ');
        value = value.replace(/[^a-z0-9'\s]/g, ' ');
        return value.replace(/\s+/g, ' ').trim();
    }

    function normalizeTokens(text, equivalences) {
        const surface = normalizeSurface(text, equivalences);
        if (!surface) return [];
        const output = [];
        surface.split(' ').forEach((token) => {
            const expansion = CONTRACTION_PARTS[token];
            if (expansion) {
                output.push(...expansion);
                return;
            }
            output.push(NUMBER_WORDS[token] || token);
        });
        return output;
    }

    function normalizedLexicalText(text) {
        return normalizeTokens(text, []).join(' ');
    }

    function levenshtein(a, b) {
        if (a === b) return 0;
        if (!a.length) return b.length;
        if (!b.length) return a.length;
        const previous = Array.from({ length: b.length + 1 }, (_, index) => index);
        const current = new Array(b.length + 1);
        for (let i = 1; i <= a.length; i++) {
            current[0] = i;
            for (let j = 1; j <= b.length; j++) {
                current[j] = a[i - 1] === b[j - 1]
                    ? previous[j - 1]
                    : Math.min(previous[j - 1] + 1, previous[j] + 1, current[j - 1] + 1);
            }
            for (let j = 0; j <= b.length; j++) previous[j] = current[j];
        }
        return previous[b.length];
    }

    function lexicalSimilarity(a, b) {
        if (!a || !b) return a === b ? 1 : 0;
        return 1 - levenshtein(a, b) / Math.max(a.length, b.length);
    }

    function normalizeCandidates(candidateInput) {
        const input = Array.isArray(candidateInput) ? candidateInput : [candidateInput];
        const seen = new Set();
        const output = [];
        input.forEach((candidate, inputIndex) => {
            const transcript = typeof candidate === 'string'
                ? candidate
                : String(candidate && candidate.transcript || '');
            const trimmed = transcript.trim();
            if (!trimmed) return;
            const key = normalizedLexicalText(trimmed);
            if (!key || seen.has(key)) return;
            seen.add(key);
            const confidenceValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.confidence)
                : NaN;
            const rankValue = typeof candidate === 'object' && candidate !== null
                ? Number(candidate.rank)
                : NaN;
            output.push({
                transcript: trimmed,
                confidence: Number.isFinite(confidenceValue) ? clamp(confidenceValue, 0, 1) : null,
                rank: Number.isFinite(rankValue) ? Math.max(0, Math.floor(rankValue)) : inputIndex,
                inputIndex
            });
        });
        return output;
    }

    function confidenceBand(confidence) {
        if (confidence === null || !Number.isFinite(confidence)) return 'unavailable';
        if (confidence >= 0.8) return 'high';
        if (confidence >= 0.55) return 'medium';
        return 'low';
    }

    function confidenceForSort(candidate) {
        return candidate.confidence === null ? -1 : candidate.confidence;
    }

    function ipaEquivalent(target, spoken, explicitAliases) {
        const aliases = [];
        const builtIn = IPA_ACOUSTIC_EQUIVALENTS[target];
        if (Array.isArray(builtIn)) aliases.push(...builtIn);
        if (Array.isArray(explicitAliases)) aliases.push(...explicitAliases);
        return aliases.some((alias) => normalizedLexicalText(alias) === spoken);
    }

    function scoreIpaCandidate(profile, candidate) {
        const target = normalizedLexicalText(profile.targetText);
        const spoken = normalizedLexicalText(candidate.transcript);
        const level = normalizeLevel(profile.level);
        const passScore = IPA_PASS_SCORE[level];
        const exact = target && spoken === target;
        const accepted = !exact && target && ipaEquivalent(target, spoken, profile.aliases);
        const similarity = target && spoken ? lexicalSimilarity(target, spoken) : 0;
        let finalScore = 0;
        let status = 'incorrect';

        if (exact) {
            finalScore = 100;
            status = 'correct';
        } else if (accepted) {
            finalScore = 92;
            status = 'accepted';
        } else if (similarity >= 0.8) {
            finalScore = Math.min(passScore - 1, Math.round(55 + similarity * 25));
            status = 'near';
        } else {
            finalScore = Math.round(similarity * 55);
        }

        const targetWords = target ? target.split(' ') : [String(profile.targetText || '')];
        const tokenScores = targetWords.map((word, index) => ({
            id: index,
            display: word,
            status,
            matchRatio: status === 'correct' ? 1 : (status === 'accepted' ? 0.92 : round(similarity, 2)),
            hint: status === 'incorrect'
                ? 'Hệ thống chưa nhận đúng từ. Hãy nghe mẫu và nói lại.'
                : ''
        }));

        return {
            apiVersion: API_VERSION,
            policyVersion: IPA_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore,
            rawScore: finalScore,
            isPass: (exact || accepted) && finalScore >= passScore,
            passScore,
            confidenceBand: confidenceBand(candidate.confidence),
            selectedCandidate: candidate.transcript,
            candidateText: candidate.transcript,
            candidateConfidence: candidate.confidence,
            candidateRank: candidate.rank,
            tokenScores,
            missingCritical: [],
            insertions: [],
            deletions: status === 'incorrect' ? targetWords.slice() : [],
            substitutions: status === 'near'
                ? [{ target: target, candidate: spoken }]
                : [],
            extraPenalty: 0,
            earnedWeight: round(finalScore / 100, 2),
            totalWeight: 1,
            diagnostics: {
                targetIpa: String(profile.targetIpa || ''),
                evidence: exact ? 'exact_transcript' : (accepted ? 'approved_acoustic_equivalent' : 'lexical_proxy'),
                lexicalSimilarity: round(similarity, 3)
            }
        };
    }

    function emptyIpaResult(profile) {
        const level = normalizeLevel(profile && profile.level);
        const target = normalizedLexicalText(profile && profile.targetText);
        return {
            apiVersion: API_VERSION,
            policyVersion: IPA_POLICY_VERSION,
            assessmentMode: 'asr_proxy',
            finalScore: 0,
            rawScore: 0,
            isPass: false,
            passScore: IPA_PASS_SCORE[level],
            confidenceBand: 'unavailable',
            selectedCandidate: '',
            candidateText: '',
            candidateConfidence: null,
            candidateRank: -1,
            evaluatedCandidatesCount: 0,
            tokenScores: (target ? target.split(' ') : []).map((word, index) => ({
                id: index,
                display: word,
                status: 'incorrect',
                matchRatio: 0,
                hint: 'Không nhận được giọng nói. Hãy thử lại.'
            })),
            missingCritical: [],
            insertions: [],
            deletions: target ? target.split(' ') : [],
            substitutions: [],
            extraPenalty: 0,
            earnedWeight: 0,
            totalWeight: 1,
            diagnostics: { targetIpa: String(profile && profile.targetIpa || ''), evidence: 'no_transcript' }
        };
    }

    function scoreIpaCandidates(profileInput, candidateInput, legacyLevel) {
        const profile = typeof profileInput === 'string'
            ? { targetText: profileInput, targetIpa: '', level: legacyLevel }
            : Object.assign({}, profileInput || {});
        const candidates = normalizeCandidates(candidateInput);
        if (!candidates.length) return emptyIpaResult(profile);
        const scored = candidates.map((candidate) => scoreIpaCandidate(profile, candidate));
        scored.sort((a, b) =>
            b.finalScore - a.finalScore
            || confidenceForSort(b) - confidenceForSort(a)
            || a.candidateRank - b.candidateRank
        );
        scored[0].evaluatedCandidatesCount = scored.length;
        return scored[0];
    }

    function validateListeningProfile(profile) {
        if (!profile || profile.schemaVersion !== LISTENING_PROFILE_VERSION) {
            throw new Error('Invalid Listening profile schema; expected 3.0.0');
        }
        if (!Array.isArray(profile.tokens) || !profile.tokens.length) {
            throw new Error('Invalid Listening profile: missing tokens');
        }
    }

    function buildListeningTargetParts(profile) {
        const parts = [];
        profile.tokens.forEach((token) => {
            const tokenParts = Array.isArray(token.parts) && token.parts.length
                ? token.parts
                : [String(token.canonical || token.display || '').toLowerCase()];
            const totalWeight = typeof token.weight === 'number' ? token.weight : 1;
            const partWeight = tokenParts.length ? totalWeight / tokenParts.length : 0;
            const requiredIndexes = Array.isArray(token.requiredPartIndexes)
                ? token.requiredPartIndexes
                : [];
            tokenParts.forEach((part, partIndex) => {
                parts.push({
                    tokenId: token.id,
                    tokenDisplay: String(token.display || part),
                    part: String(part || '').toLowerCase(),
                    tokenClass: Array.isArray(token.partClasses)
                        ? token.partClasses[partIndex] || token.tokenClass || 'content'
                        : token.tokenClass || 'content',
                    criticalReason: Array.isArray(token.criticalReasons)
                        ? token.criticalReasons[partIndex] || null
                        : token.criticalReason || null,
                    isCritical: requiredIndexes.includes(partIndex),
                    isIgnored: token.scorePolicy === 'ignored' || totalWeight === 0,
                    isNumber: /^\d+$/.test(String(part || '')),
                    weight: partWeight,
                    homophones: token.homophonesByPart && token.homophonesByPart[partIndex] || [],
                    aliases: token.aliasesByPart && token.aliasesByPart[partIndex] || []
                });
            });
        });
        return parts;
    }

    function listeningMatchFactor(targetPart, candidatePart) {
        if (targetPart.part === candidatePart) return 1;
        if (targetPart.homophones.includes(candidatePart)) return 0.98;
        if (!targetPart.isCritical && targetPart.aliases.includes(candidatePart)) return 0.82;
        if (!targetPart.isCritical
            && targetPart.tokenClass === 'content'
            && targetPart.part.length >= 5
            && candidatePart.length >= 5
            && lexicalSimilarity(targetPart.part, candidatePart) >= 0.88) {
            return 0.68;
        }
        return 0;
    }

    function insertionUnits(token) {
        return FILLERS.has(token) ? 0.03 : 0.18;
    }

    function alignListening(targetParts, candidateParts) {
        const n = targetParts.length;
        const m = candidateParts.length;
        const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));
        const back = Array.from({ length: n + 1 }, () => Array(m + 1).fill(null));

        for (let i = 1; i <= n; i++) {
            dp[i][0] = dp[i - 1][0];
            back[i][0] = { op: 'delete', previousI: i - 1, previousJ: 0 };
        }
        for (let j = 1; j <= m; j++) {
            dp[0][j] = dp[0][j - 1] - insertionUnits(candidateParts[j - 1]);
            back[0][j] = { op: 'insert', previousI: 0, previousJ: j - 1 };
        }

        for (let i = 1; i <= n; i++) {
            for (let j = 1; j <= m; j++) {
                const target = targetParts[i - 1];
                const candidate = candidateParts[j - 1];
                const factor = listeningMatchFactor(target, candidate);
                const choices = [
                    {
                        value: dp[i - 1][j - 1] + target.weight * factor,
                        op: factor > 0 ? 'match' : 'substitute',
                        factor,
                        previousI: i - 1,
                        previousJ: j - 1
                    },
                    {
                        value: dp[i - 1][j],
                        op: 'delete',
                        factor: 0,
                        previousI: i - 1,
                        previousJ: j
                    },
                    {
                        value: dp[i][j - 1] - insertionUnits(candidate),
                        op: 'insert',
                        factor: 0,
                        previousI: i,
                        previousJ: j - 1
                    }
                ];

                if (i >= 2 && j >= 2
                    && targetParts[i - 2].part === candidateParts[j - 1]
                    && targetParts[i - 1].part === candidateParts[j - 2]) {
                    choices.push({
                        value: dp[i - 2][j - 2]
                            + 0.8 * (targetParts[i - 2].weight + targetParts[i - 1].weight),
                        op: 'transpose',
                        factor: 0.8,
                        previousI: i - 2,
                        previousJ: j - 2
                    });
                }

                choices.sort((a, b) => b.value - a.value);
                dp[i][j] = choices[0].value;
                back[i][j] = choices[0];
            }
        }

        const details = Array(n).fill(null);
        const matchedCandidateIndexes = new Set();
        const insertions = [];
        const deletions = [];
        const substitutions = [];
        let transpositions = 0;
        let i = n;
        let j = m;
        while (i > 0 || j > 0) {
            const step = back[i][j];
            if (!step) break;
            if (step.op === 'match' || step.op === 'substitute') {
                const targetIndex = i - 1;
                const candidateIndex = j - 1;
                if (step.op === 'match') {
                    details[targetIndex] = {
                        factor: step.factor,
                        candidateIndex,
                        candidate: candidateParts[candidateIndex]
                    };
                    matchedCandidateIndexes.add(candidateIndex);
                } else {
                    substitutions.push({
                        target: targetParts[targetIndex].tokenDisplay,
                        candidate: candidateParts[candidateIndex]
                    });
                    matchedCandidateIndexes.add(candidateIndex);
                }
            } else if (step.op === 'delete') {
                deletions.push(targetParts[i - 1].tokenDisplay);
            } else if (step.op === 'insert') {
                insertions.push(candidateParts[j - 1]);
            } else if (step.op === 'transpose') {
                details[i - 2] = { factor: 0.8, candidateIndex: j - 1, candidate: candidateParts[j - 1] };
                details[i - 1] = { factor: 0.8, candidateIndex: j - 2, candidate: candidateParts[j - 2] };
                matchedCandidateIndexes.add(j - 1);
                matchedCandidateIndexes.add(j - 2);
                transpositions++;
            }
            i = step.previousI;
            j = step.previousJ;
        }

        return {
            details,
            matchedCandidateIndexes,
            insertions: insertions.reverse(),
            deletions: deletions.reverse(),
            substitutions: substitutions.reverse(),
            transpositions
        };
    }

    function scoreListeningCandidate(profile, candidate, level) {
        validateListeningProfile(profile);
        const normalizedLevel = normalizeLevel(level || profile.level);
        const passScore = Number(profile.passScore) || (normalizedLevel === 'A' ? 70 : (normalizedLevel === 'C' ? 88 : 80));
        const equivalences = []
            .concat(Array.isArray(profile.phraseVariants) ? profile.phraseVariants : [])
            .concat(Array.isArray(profile.entityEquivalences) ? profile.entityEquivalences : []);
        const candidateParts = normalizeTokens(candidate.transcript, equivalences);
        const targetParts = buildListeningTargetParts(profile);
        const alignment = alignListening(targetParts, candidateParts);

        let earnedWeight = 0;
        let totalWeight = 0;
        const missingCriticalSet = new Set();
        targetParts.forEach((part, index) => {
            if (!part.isIgnored) totalWeight += part.weight;
            const detail = alignment.details[index];
            if (detail && !part.isIgnored) earnedWeight += part.weight * detail.factor;
            if (part.isCritical && (!detail || detail.factor < 0.95)) {
                missingCriticalSet.add(part.tokenDisplay.replace(/[.,!?;:"()]/g, ''));
            }
        });
        const missingCritical = Array.from(missingCriticalSet);

        const insertionCost = alignment.insertions.reduce(
            (sum, token) => sum + insertionUnits(token),
            0
        );
        const extraPenalty = totalWeight > 0
            ? round(Math.min(12, 100 * insertionCost / totalWeight), 2)
            : 0;
        const rawScore = totalWeight > 0
            ? Math.round(clamp(100 * earnedWeight / totalWeight - extraPenalty, 0, 100))
            : 0;
        const finalScore = missingCritical.length ? Math.min(rawScore, passScore - 1) : rawScore;

        const tokenScores = profile.tokens.map((token) => {
            const ignored = token.scorePolicy === 'ignored' || token.weight === 0;
            if (ignored) {
                return { id: token.id, display: token.display, status: 'ignored', matchRatio: 1 };
            }
            let tokenEarned = 0;
            let tokenTotal = 0;
            targetParts.forEach((part, index) => {
                if (part.tokenId !== token.id) return;
                tokenTotal += part.weight;
                if (alignment.details[index]) tokenEarned += part.weight * alignment.details[index].factor;
            });

        function applyDashboardTheme(theme) {
            const normalizedTheme = theme === 'elegant' ? 'elegant' : 'youth';
            document.body.setAttribute('data-theme', normalizedTheme);

            const toggleCb = document.getElementById('themeToggleCheckbox');
            const toggleTxt = document.getElementById('themeToggleText');
            if (toggleCb) toggleCb.checked = (normalizedTheme === 'elegant');
            if (toggleTxt) toggleTxt.textContent = (normalizedTheme === 'elegant') ? 'ELEGANT' : 'YOUTH';
        }

        function switchTheme(theme) {
            setDashboardTheme(theme);
        }

        function setDashboardTheme(theme) {
            applyDashboardTheme(theme);
            try {
                localStorage.setItem(DASHBOARD_THEME_KEY, theme);
            } catch (err) {
                // localStorage can be blocked in strict browser settings.
            }
        }

        function initDashboardTheme() {
            let savedTheme = null;
            try {

        function setRuntimeStyle(element, property, value) {
            if (!element) return;

            declaration[property] = value;
        }

        function setRuntimeStyles(element, declarations) {
            if (!element) return;
            const declaration = element.style;
            Object.entries(declarations).forEach(([property, value]) => {
                declaration[property] = value;
            });
        }

        function setRuntimeCssVariable(element, property, value) {
            if (!element) return;
            const declaration = element.style;

            const values = lessonData.map((_, index) => index).filter(index => index !== excludedIndex);
            for (let i = values.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [values[i], values[j]] = [values[j], values[i]];
            }
            return values;

        function advanceStudyIndex() {
            if (ipaOrderMode === 'sequence') {
                if (currentIndex >= lessonData.length - 1) return false;
                currentIndex++;

            if (randomCursor < randomHistory.length - 1) {
                randomCursor++;
                currentIndex = randomHistory[randomCursor];
                return true;
            }
            if (randomRemaining.length === 0) return false;
            currentIndex = randomRemaining.pop();
            randomHistory.push(currentIndex);
            randomCursor++;
            return true;
        }

        function retreatStudyIndex() {
            if (ipaOrderMode === 'sequence') {
                if (currentIndex <= 0) return false;

            if (randomCursor <= 0) return false;

            if (countdownFrame) cancelAnimationFrame(countdownFrame);

            if (slot) slot.classList.remove('is-active');

        function startPronunciationCountdown() {
            cancelPronunciationCountdown();
            if (ipaTimeLimit <= 0) return;
            const slot = document.querySelector('.countdown-slot');
            const fill = document.querySelector('.countdown-fill');
            if (!slot || !fill) return;
            const startedAt = performance.now();
            const duration = ipaTimeLimit * 1000;
            const attempt = { completed: false, index: currentIndex };
            activePronunciationAttempt = attempt;
            slot.classList.add('is-active');
            setRuntimeCssVariable(fill, '--ipa-countdown-progress', '1');

            const tick = now => {
                if (activePronunciationAttempt !== attempt || attempt.completed) return;
                const remaining = Math.max(0, 1 - ((now - startedAt) / duration));
                setRuntimeCssVariable(fill, '--ipa-countdown-progress', String(remaining));
                if (remaining > 0) {
                    countdownFrame = requestAnimationFrame(tick);
                    return;
                }
                attempt.completed = true;
                countdownFrame = 0;
                slot.classList.remove('is-active');
                try {
                    if (recognition && btnMic.classList.contains('listening')) recognition.stop();
                } catch (error) {
                    reportRuntimeIssue('Mic timeout stop error', error);
                }
                if (pronunciationGameActive) handlePronunciationGameResult(false, 0);
            };
            countdownFrame = requestAnimationFrame(tick);
        }

        function stripSkipMarkersFromText(text) {
            // Ẩn các ký hiệu đánh dấu (nếu bài có dùng { } hoặc [ ]) để học sinh không "nhìn lén" ngoại lệ.
            return (text || "").replace(/[{}\[\]]/g, "");
        }

        function normalizeWord(word) {
            // Canonical normalization for o'clock and common contractions
            word = (word || "").toLowerCase();

            // Normalize apostrophes (' → ')
            word = word.replace(/[']/g, "'");

            // (A) Normalize o'clock variants
            // o'clock, o clock, oclock → oclock
            word = word.replace(/\bo\s*'?clock\b/g, "oclock");

            // (B) Normalize common contractions → full form (canonical)
            const contractionMap = {
                "i'm": "i am",
                "you're": "you are",
                "he's": "he is",
                "she's": "she is",
                "it's": "it is",
                "we're": "we are",
                "they're": "they are",
                "i've": "i have",
                "you've": "you have",
                "we've": "we have",
                "they've": "they have",
                "i'll": "i will",
                "you'll": "you will",
                "he'll": "he will",
                "she'll": "she will",
                "we'll": "we will",
                "they'll": "they will",
                "don't": "do not",
                "doesn't": "does not",
                "didn't": "did not",
                "can't": "cannot",
                "won't": "will not",
                "isn't": "is not",
                "aren't": "are not",
                "wasn't": "was not",
                "weren't": "were not",
                "shouldn't": "should not",
                "wouldn't": "would not",
                "couldn't": "could not"
            };

            if (contractionMap[word]) {
                word = contractionMap[word];
            } else {
                word = word.replace(/'s\b/g, "").replace(/s'\b/g, "s");
            }

            // Làm sạch 1 "mảnh" từ:
            // - Bỏ { } [ ] (đánh dấu skip)
            // - Giữ chữ, số và dấu chấm thập phân
            let w = stripSkipMarkersFromText(word);

            // Chuẩn hóa dấu gạch nối/hyphen: "twenty-one" -> "twenty one"
            w = w.replace(/[-–—]/g, " ");

            // Nếu có số, ưu tiên chuẩn hóa về chuỗi số (bỏ dấu , giữ dấu .)
            if (/\d/.test(w)) {
                w = w.replace(/,/g, "");
                w = w.replace(/[^\d.]/g, "");
                // Nếu chỉ còn dấu chấm hoặc rỗng thì fallback về chữ thường
                if (!w || w === ".") return stripSkipMarkersFromText(word).toLowerCase();
                return w.trim();
            }

            // Với chữ: thay dấu câu bằng khoảng trắng để tránh dính chữ
            w = w.replace(/[.,!?;:"''()]/g, " ");
            return w.trim().toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const DUKE_NUM_MAP = {
            "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7, "eight": 8, "nine": 9,
            "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19,
            "twenty": 20, "thirty": 30, "forty": 40, "fifty": 50, "sixty": 60, "seventy": 70, "eighty": 80, "ninety": 90,
            "hundred": 100, "thousand": 1000, "million": 1000000, "billion": 1000000000,
            "first": 1, "second": 2, "third": 3, "fourth": 4, "fifth": 5, "sixth": 6, "seventh": 7, "eighth": 8, "ninth": 9, "tenth": 10,
            "eleventh": 11, "twelfth": 12, "thirteenth": 13, "fourteenth": 14, "fifteenth": 15, "sixteenth": 16, "seventeen": 17, "eighteen": 18, "nineteenth": 19,
            "twentieth": 20, "thirtieth": 30, "fortieth": 40, "fiftieth": 50, "sixtieth": 60, "seventieth": 70, "eightieth": 80, "ninetieth": 90
        };

        /**
         * Chuyển đổi một danh sách token chữ/số thành dạng "Canonical Digit"
         * Hỗ trợ: "a hundred" -> 100, "point five" -> 0.5, "first" -> 1, year-style...
         */
        function collapseNumericalTokens(tokens) {
            const canonicalList = [];
            const originalToCanonicalIndex = new Array(tokens.length).fill(-1);

            let i = 0;
            const n = tokens.length;

            while (i < n) {
                let currentVal = 0;
                let totalVal = 0;
                let hasNumber = false;
                let j = i;
                let consumed = [];

                while (j < n) {
                    let w = tokens[j].toLowerCase();

                    // Bỏ qua "and" trong cụm số
                    if (w === "and" && hasNumber && (j + 1 < n) && (DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] !== undefined)) {
                        consumed.push(j);
                        j++;
                        w = tokens[j].toLowerCase();
                    }

                    // Xử lý "a hundred", "a thousand"
                    let val = DUKE_NUM_MAP[w];
                    if (w === "a" && (j + 1 < n)) {
                        const nextW = tokens[j + 1].toLowerCase();
                        if (["hundred", "thousand", "million", "billion"].includes(nextW)) val = 1;
                    }

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;
                            if (val === 100) currentVal *= 100;
                            else { totalVal += currentVal * val; currentVal = 0; }
                        } else {
                            if (currentVal >= 20 && currentVal < 100 && currentVal % 10 === 0 && val < 10) {
                                currentVal += val;
                            } else if (currentVal > 0 && (val >= 10 || (currentVal >= 11 && currentVal <= 99))) {
                                totalVal += currentVal * 100;
                                currentVal = val;
                            } else {
                                totalVal += currentVal;
                                currentVal = val;
                            }
                        }
                        j++;

                        // Xử lý "point" cho số thập phân
                        if (j < n && tokens[j].toLowerCase() === "point" && (j + 1 < n) && DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] < 10) {
                            let base = totalVal + currentVal;
                            consumed.push(j); j++;
                            let dec = "";
                            while (j < n && DUKE_NUM_MAP[tokens[j].toLowerCase()] !== undefined && DUKE_NUM_MAP[tokens[j].toLowerCase()] < 10) {
                                dec += DUKE_NUM_MAP[tokens[j].toLowerCase()];
                                consumed.push(j); j++;
                            }
                            const cIdx = canonicalList.length;
                            canonicalList.push(base + "." + dec);
                            consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                            i = j; hasNumber = false; break;
                        }
                    } else { break; }
                }

                if (hasNumber) {
                    const finalNum = String(totalVal + currentVal);
                    const cIdx = canonicalList.length;
                    canonicalList.push(finalNum);
                    consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                    i = j;
                } else if (i < j) {
                    // Break từ point
                } else {
                    const cIdx = canonicalList.length;
                    canonicalList.push(tokens[i]);
                    originalToCanonicalIndex[i] = cIdx;
                    i++;
                }
            }
            return { canonicalList, originalToCanonicalIndex };
        }

        function convertNumbers(word) {
            const w = normalizeWord(word);
            if (DUKE_NUM_MAP[w] !== undefined) return String(DUKE_NUM_MAP[w]);
            return w;
        }

        function isMatch(a, b) {
            const na = normalizeWord(a);
            const nb = normalizeWord(b);
            if (na === nb) return true;
            if (convertNumbers(na) === convertNumbers(nb)) return true;
            return false;
        }

        function renderProgressBar() {

            if (progressBarContainer) {
                if (total > 30) {

                } else {

            for (let i = 0; i < total; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';
                segment.innerText = i + 1;
                if (ipaOrderMode === 'sequence' && !pronunciationGameActive) {
                    segment.onclick = () => jumpToSentence(i);
                } else {
                    segment.classList.add('disabled');

                if (i === currentIndex) {
                    segment.classList.add('active');
                }

                if (isGameMode) {
                    if (GAME_SESSION[i]) {
                        const data = GAME_SESSION[i];
                        if (data.isFinished || data.isLocked) {
                            segment.classList.add('done');
                        } else if (i < currentIndex) {
                            segment.classList.add('warn');
                        }
                    } else if (i < currentIndex) {
                        segment.classList.add('warn');

                } else {

        function renderCard(index) {
