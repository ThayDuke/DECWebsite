            }

            btnPrev.disabled = pronunciationGameActive || (ipaOrderMode === 'shuffle' ? randomCursor === 0 : index === 0);
            btnNext.disabled = pronunciationGameActive || (ipaOrderMode === 'shuffle'
                ? randomCursor >= randomHistory.length - 1 && randomRemaining.length === 0
                : index === lessonData.length - 1);

            if (isEnded) iconPlay.className = `fa-solid ${getDmuIconClass('replay')}`;
            else iconPlay.className = `fa-solid ${isPlaying ? getDmuIconClass('pause') : getDmuIconClass('play')}`;

            updateMicStatus();
            updateTimerDisplay(); // Cập nhật UI timer mỗi lần render

            const navStat = document.getElementById('nav-status');
            if (navStat) {
                navStat.textContent = ipaOrderMode === 'shuffle'
                    ? `${randomCursor + 1} / ${lessonData.length}`
                    : `${index + 1} / ${lessonData.length}`;
            }

            const slideNavText = document.getElementById('slide-nav-text');
            if (slideNavText) {
                slideNavText.textContent = ipaOrderMode === 'shuffle'
                    ? `Đã học ${randomCursor + 1}/${lessonData.length}`
                    : `Slide ${index + 1}/${lessonData.length}`;
            }

            if (isFocusModeSupported() && document.body.classList.contains('focus-mode')) {
                // [DUKE] Double-rAF ensures browser has fully painted the new card
                // before measuring dimensions for zoom calculation
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        ensureFocusZoomFitsCurrentSlide();
                    });
                });
            }
        }

        function initTimer() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            if (timerInterval) clearInterval(timerInterval);
            setVisible(timerDisplay, true);
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                // CHỈ đếm ngược khi: đang chạy AND không tạm dừng AND còn thời gian
                if (isTimerRunning && !isTimerPaused && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft <= 0 && isTimerRunning) {
                    clearInterval(timerInterval);
                    finishGameGlobal(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.innerText = `⏰ ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

            if (isTimerPaused || !isTimerRunning) timerDisplay.classList.add('paused');
            else timerDisplay.classList.remove('paused');

            if (timeLeft < 30) timerDisplay.classList.add('low-time');
            else timerDisplay.classList.remove('low-time');
        }

        function toggleGameMode(forceState) {
            hardStopAudio();
            autoPlayMode = false;
            isPlaying = false;
            isGameMode = typeof forceState === 'boolean' ? forceState : !isGameMode;
            updateGameModeToggleUI();

            if (isGameMode) {
                if (btnGame) btnGame.classList.add('active');
                if (btnSub) btnSub.disabled = true;
                btnAuto.disabled = true;
                btnAuto.classList.add('disabled');

                if (!hasGameStarted) {
                    maxGlobalHearts = lessonData.length * 5;
                    globalHearts = maxGlobalHearts;
                    totalReplays = 0;
                    timeLeft = lessonData.length * CONST_TIME_PER_SENTENCE;
                    isGameFinished = false;
                    hasGameStarted = true;

                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    isTimerRunning = false; // Bắt đầu game chưa chạy ngay, đợi bấm nghe
                    initTimer();
                } else {
                    isTimerPaused = false;
                    // Quay lại game mode, timer vẫn pause cho đến khi user tương tác lại
                    isTimerRunning = false;
                    initTimer();
                }

            } else {
                if (btnGame) btnGame.classList.remove('active');
                if (btnSub) btnSub.disabled = false;
                btnAuto.disabled = false;
                btnAuto.classList.remove('disabled');

                if (timerInterval) clearInterval(timerInterval);
                isTimerPaused = true;
                isTimerRunning = false;
                setVisible(timerDisplay, false);
            }
            renderCard(currentIndex);
        }

        function initGameDataForIndex(idx) {
            if (GAME_SESSION[idx]) return;

            const item = lessonData[idx];
            const sentence = item.title || item.text;
            const targetWordsOriginal = sentence.trim().split(/\s+/);

            let bankItems = targetWordsOriginal.map(w => ({
                original: w,
                display: normalizeWord(w),
                id: `w-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                used: false
            }));

            const distractorCount = targetWordsOriginal.length;
            for (let i = 0; i < distractorCount; i++) {
                const randomWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                bankItems.push({
                    original: randomWord,
                    display: normalizeWord(randomWord),
                    id: `d-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                    used: false
                });
            }
            bankItems.sort(() => Math.random() - 0.5);

            GAME_SESSION[idx] = {
                targetWords: targetWordsOriginal,
                slotsState: new Array(targetWordsOriginal.length).fill(null),
                bank: bankItems,
                listenCount: 0,
                mistakes: 0,
                maxMistakes: 5,
                isLocked: false,
                isFinished: false,
                hasStarted: false,
                hasEarnedHeart: false,
                attemptCount: 0,
                attemptsHistory: []
            };
        }

        function renderGameInterface(idx) {
            const data = GAME_SESSION[idx];
            if (!data) return;

            const item = lessonData[idx];

            let slotsHTML = '';
            data.targetWords.forEach((word, i) => {
                const filledWord = data.slotsState[i];
                if (filledWord) {
                    slotsHTML += `<div class="slot filled" id="slot-${idx}-${i}">${filledWord}</div>`;
                } else {
                    slotsHTML += `<div class="slot" id="slot-${idx}-${i}">___</div>`;
                }
            });
            let livesHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;

            const shouldLockBank = data.isLocked || data.isFinished || !data.hasStarted;
            const lockedClass = shouldLockBank ? 'locked' : '';
            const blindClass = (!data.hasStarted && !data.isLocked && !data.isFinished) ? 'blind' : '';
            const activeClass = isPlaying ? 'active' : '';

            let bankHTML = '';
            data.bank.forEach((item) => {
                const usedClass = item.used ? 'used' : '';
                bankHTML += `<div class="word-chip ${usedClass}" id="${item.id}" data-chip-id="${item.id}" data-word="${escapeHtml(item.display)}">${escapeHtml(item.display)}</div>`;
            });

            let statusMsg = '';
            if (data.isLocked) statusMsg = `<div class="game-status-msg msg-locked"><i class="fa-solid fa-lock"></i> Câu này đã bị khóa</div>`;
            else if (data.isFinished) statusMsg = `<div class="game-status-msg msg-win"><i class="fa-solid fa-check-circle"></i> Hoàn thành!</div>`;


            displayArea.innerHTML = `
                <div class="flashcard ${activeClass}">
                    <div class="lives-area">${livesHTML}</div>
                    


                    <div class="sentence-slots">${slotsHTML}</div>
                    <div class="word-bank ${lockedClass} ${blindClass}">${bankHTML}</div>
                    ${statusMsg}
                </div>
            `;
        }

        function handleGameClick(chipId, clickedDisplayWord) {
            if (isProcessing) return;

            const data = GAME_SESSION[currentIndex];
            if (!data || data.isLocked || data.isFinished || !data.hasStarted) return;

            isProcessing = true;

            let foundSlotIndex = -1;
            for (let i = 0; i < data.targetWords.length; i++) {
                if (isMatch(data.targetWords[i], clickedDisplayWord) && data.slotsState[i] === null) {
                    foundSlotIndex = i;
                    break;
                }
            }

            const chipEl = document.getElementById(chipId);

            if (foundSlotIndex !== -1) {
                const targetSlotId = `slot-${currentIndex}-${foundSlotIndex}`;
                const targetSlotEl = document.getElementById(targetSlotId);

                flyEffect(chipEl, targetSlotEl, () => {
                    data.slotsState[foundSlotIndex] = data.targetWords[foundSlotIndex];
                    const bankItem = data.bank.find(b => b.id === chipId);
                    if (bankItem) bankItem.used = true;

                    // [DUKE UPDATE] Logic khi hoàn thành câu
                    if (!data.slotsState.includes(null)) {
                        data.isFinished = true;
                        isTimerRunning = false; // Ngừng timer ngay lập tức khi xong câu
                        updateTimerDisplay();   // Cập nhật UI ngay
                        checkGameGlobalFinish();
                        updateMicStatus();
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                });

            } else {
                chipEl.classList.add('wrong');
                setTimeout(() => {
                    chipEl.classList.remove('wrong');
                    showDamageEffect();
                    if (globalHearts > 0) globalHearts--;
                    data.mistakes++;
                    if (globalHearts <= 0) {
                        finishGameGlobal(false);
                    } else if (data.mistakes >= 5) {
                        data.isLocked = true;
                        isTimerRunning = false; // Khóa câu cũng dừng timer
                        updateTimerDisplay();
                        // checkGameGlobalFinish(); 
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                }, 500);
            }
        }

        function showDamageEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.innerText = "-1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        function flyEffect(sourceEl, targetEl, onComplete) {
            const srcRect = sourceEl.getBoundingClientRect();
            const tgtRect = targetEl.getBoundingClientRect();
            const clone = sourceEl.cloneNode(true);
            clone.className = 'flying-chip';
            setRuntimeStyles(clone, {
                width: srcRect.width + 'px',
                height: srcRect.height + 'px',
                top: srcRect.top + 'px',
                left: srcRect.left + 'px',
                margin: 0
            });
            document.body.appendChild(clone);
            setRuntimeStyle(sourceEl, 'opacity', '0');
            requestAnimationFrame(() => {
                setRuntimeStyles(clone, {
                    top: tgtRect.top + 'px',
                    left: tgtRect.left + 'px'
                });
            });
            setTimeout(() => {
                clone.remove();
                if (onComplete) onComplete();
            }, 500);
        }

        function checkGameGlobalFinish() {
            let allDone = true;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i] || (!GAME_SESSION[i].isFinished && !GAME_SESSION[i].isLocked)) {
                    allDone = false;
                    break;
                }
            }
            if (allDone) finishGameGlobal(true);
        }

        function finishGameGlobal(isWin) {
            if (isGameFinished) return;
            isGameFinished = true;
            if (timerInterval) clearInterval(timerInterval);

            let penaltyHearts = 0;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i]) initGameDataForIndex(i);
                const d = GAME_SESSION[i];
                if (!d.isFinished && !d.isLocked) {
                    const remaining = d.maxMistakes - d.mistakes;
                    if (remaining > 0) penaltyHearts += remaining;
                    d.isLocked = true;
                }
            }

            globalHearts = Math.max(0, globalHearts - penaltyHearts);
            document.getElementById('final-hearts').innerText = `${globalHearts}/${maxGlobalHearts}`;
            document.getElementById('final-replays').innerText = totalReplays;

            let msg = "";
            if (isWin && globalHearts > 0) {
                if (globalHearts === maxGlobalHearts) msg = "Xuất sắc! Bạn là thiên tài!";
                else if (globalHearts > maxGlobalHearts * 0.8) msg = "Giỏi quá! Cố gắng giữ phong độ nhé!";
                else msg = "Cố gắng hơn ở lần sau nhé!";
            } else {
                if (globalHearts <= 0) msg = "Tiếc quá! Bạn đã hết tim rồi.";
                else msg = "Hết giờ rồi! Cố lên nhé!";
            }

            renderCard(currentIndex);
            document.getElementById('score-message').innerText = msg;
            setTimeout(() => {
                setVisible(scoreModal, true);
                if (isWin && globalHearts > 0) confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            }, 1000);
        }

        function handlePlayClick() {
            if (isPlaying) {
                hardStopAudio();
                autoPlayMode = false;

                // Nếu đang nghe mà bấm dừng thủ công trong Game Mode
                // Timer phải CHẠY LẠI nếu câu chưa xong
                if (isGameMode) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && data.hasStarted && !data.isFinished && !data.isLocked) {
                        isTimerRunning = true;
                    }
                }

                renderCard(currentIndex);
                return;
            }

            if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
            const data = GAME_SESSION[currentIndex];

            if (!isGameMode || data.isFinished || data.isLocked) {
                playCurrentSentence();
                return;
            }

            if (!data.hasStarted) {
                data.hasStarted = true;
            }

            if (data.listenCount === 0) {
                data.listenCount++;
                playCurrentSentence();
            } else {
                const isMaxListensReached = data.listenCount >= 5;
                if (!isMaxListensReached && globalHearts > 1) {
                    globalHearts--;
                    totalReplays++;
                    data.listenCount++;
                    playCurrentSentence(true);
                }
            }
        }

        function refereeReplay() {
            if (!GAME_SESSION[currentIndex]) return;
            const data = GAME_SESSION[currentIndex];
            if (!data.hasStarted) {
                data.hasStarted = true;
                if (data.listenCount === 0) data.listenCount = 1;
            }
            playCurrentSentence(false);
            renderCard(currentIndex);
        }

        function playSpeechFallback(text, isPaid) {
            if (!('speechSynthesis' in window) || !text) {
                setTimeout(onFinishSentence, 1200);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            currentUtterance = utterance;
            utterance.lang = 'en-US';
            utterance.rate = 0.92;
            utterance.pitch = 1;
            utterance.volume = 1;

            const englishVoice = window.speechSynthesis.getVoices().find(voice => /^en(-|_)/i.test(voice.lang));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            currentAudio.isPaidListen = isPaid;
            utterance.onend = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                onFinishSentence();
            };
            utterance.onerror = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                isPlaying = false;
                iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                setTimeout(onFinishSentence, 400);
            };

            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } catch (error) {
                currentUtterance = null;
                setTimeout(onFinishSentence, 1200);
            }
        }

        // =========================================================
        // AUDIO & HARDWARE WARM-UP LOGIC
        // =========================================================
        function playCurrentSentence(isPaid = false) {
            hardStopAudio();

            // [DUKE UPDATE] Luôn tạm dừng timer khi bắt đầu nghe
            if (isGameMode) {
                isTimerRunning = false;
                updateTimerDisplay();
            }

            const audioSrc = lessonData[currentIndex].audio;
            if (!audioSrc || audioSrc.length < 50) {
                playSpeechFallback(lessonData[currentIndex].title || lessonData[currentIndex].text || '', isPaid);
                return;
            }

            currentAudio.src = audioSrc;
            currentAudio.isPaidListen = isPaid;
            currentAudio.onended = onFinishSentence;

            isPlaying = true;
            isEnded = false;
            iconPlay.className = `fa-solid ${getDmuIconClass('pause')}`;

            currentAudio.play().catch(() => {
                isPlaying = false;
                iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                if (isGameMode && GAME_SESSION[currentIndex] && !GAME_SESSION[currentIndex].isFinished) isTimerRunning = true;
            });
        }

        function onFinishSentence() {
            // [DUKE UPDATE] Logic: Nghe xong MỚI chạy timer
            if (isGameMode && GAME_SESSION[currentIndex]) {
                const d = GAME_SESSION[currentIndex];
                // Chỉ chạy lại timer nếu: Đã bắt đầu + Chưa xong + Chưa khóa
                if (d.hasStarted && !d.isFinished && !d.isLocked) {
                    isTimerRunning = true;
                }
            }

            if (isGameMode && GAME_SESSION[currentIndex] && GAME_SESSION[currentIndex].listenCount === 1) {
                renderCard(currentIndex);
            }
            if (isGameMode && currentAudio.isPaidListen) {
                const badge = document.createElement('div');
                badge.className = 'cost-badge';
                badge.innerHTML = '-1 ❤️';
                btnPlay.appendChild(badge);
                setTimeout(() => { renderCard(currentIndex); }, 1000);
            }
            if (autoPlayMode) {
                if (advanceStudyIndex()) {
                    if (isGameMode && !GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    if (isGameMode) {
                        const d = GAME_SESSION[currentIndex];
                        if (d.listenCount === 0) d.listenCount++;
                        d.hasStarted = true;
                        // Auto play thì timer cứ chạy theo logic play/pause
                    }
                    renderCard(currentIndex);
                    const delay = (document.body.getAttribute('data-mode') === 'ipa') ? 950 : 600;
                    setTimeout(() => playCurrentSentence(), delay);
                } else {
                    hardStopAudio();
                    isEnded = true;
                    isPlaying = false;
                    renderCard(currentIndex);
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: getConfettiColors() });
                }
            } else {
                isPlaying = false;
                if (!isGameMode || !currentAudio.isPaidListen) renderCard(currentIndex);
            }
        }

        function playAuto() {
            if (ipaTimeLimit > 0) {
                startPronunciationGame();
                return;
            }
            if (isPlaying && autoPlayMode) {
                hardStopAudio();
                renderCard(currentIndex);
                return;
            }
            if (isEnded) {
                currentIndex = 0;
                resetRandomNavigation(currentIndex);
                isEnded = false;
            }
            autoPlayMode = true;
            playCurrentSentence();
        }

        function goNext() {
            if (!pronunciationGameActive && advanceStudyIndex()) {
                hardStopAudio(); autoPlayMode = false; isEnded = false;
                cancelPronunciationCountdown();
                if (isGameMode) {
                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

                    // [DUKE UPDATE] Qua câu mới -> Dừng Timer ngay lập tức
                    // Timer sẽ chỉ chạy lại khi hàm onFinishSentence được gọi (sau khi nghe xong)
                    isTimerRunning = false;
                    updateTimerDisplay();
                }
                renderCard(currentIndex);
            }
        }

        function goPrev() {
            if (!pronunciationGameActive && retreatStudyIndex()) {
                hardStopAudio(); autoPlayMode = false; isEnded = false;
                cancelPronunciationCountdown();
                if (isGameMode) {
                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

                    // [DUKE UPDATE] Tương tự goNext, qua câu cũ cũng dừng timer chờ nghe lại
                    isTimerRunning = false;
                    updateTimerDisplay();
                }
                renderCard(currentIndex);
            }
        }

        function startPronunciationGame() {
            if (!recognition) {
                reportRuntimeIssue('Pronunciation game unavailable', 'SpeechRecognition is not supported.');
                return;
            }
            hardStopAudio();
            cancelPronunciationCountdown();
            autoPlayMode = false;
            pronunciationGameActive = true;
            pronunciationGameFinished = false;
            pronunciationHearts = 0;
            pronunciationCompleted = new Set();
            document.body.classList.remove('pronunciation-results');
            setVisible(scoreModal, false);
            updateStudyControls();

            lessonData.forEach((_, index) => {
                if (!GAME_SESSION[index]) initGameDataForIndex(index);
                GAME_SESSION[index].attemptCount = 0;
                GAME_SESSION[index].attemptsHistory = [];
                GAME_SESSION[index].hasEarnedHeart = false;
            });

            if (ipaOrderMode === 'shuffle') {
                randomRemaining = shuffledIndices();
                currentIndex = randomRemaining.pop();
                randomHistory = [currentIndex];
                randomCursor = 0;
            } else {
                currentIndex = 0;
                resetRandomNavigation(currentIndex);
            }

            updatePronunciationHearts();
            renderCard(currentIndex);
            setTimeout(startMicRecognition, 420);
        }

        function finishPronunciationGame(message) {
            if (pronunciationGameFinished) return;
            pronunciationGameActive = false;
            pronunciationGameFinished = true;
            completePronunciationCountdown();
            try {
                if (recognition && btnMic.classList.contains('listening')) recognition.stop();
            } catch (error) {
                reportRuntimeIssue('Mic finish stop error', error);
            }
            document.body.classList.add('pronunciation-results');
            updateStudyControls();
            document.getElementById('final-hearts').innerText = `${pronunciationHearts}/${lessonData.length}`;
            document.getElementById('score-message').innerText = message;
            updatePronunciationHearts(true);
            updateMicStatus();
            setTimeout(() => setVisible(scoreModal, true), 420);
        }

        function handlePronunciationGameResult(isPass, accuracy) {
            if (!pronunciationGameActive || pronunciationGameFinished) return;
            const data = GAME_SESSION[currentIndex];
            if (!data) return;

            if (isPass) {
                if (!data.hasEarnedHeart) {
                    data.hasEarnedHeart = true;
                    pronunciationHearts++;
                    pronunciationCompleted.add(currentIndex);
                    updatePronunciationHearts(true);
                }
                if (pronunciationCompleted.size >= lessonData.length) {
                    finishPronunciationGame('Hoàn thành toàn bộ bài phát âm!');
                    return;
                }
                if (!advanceStudyIndex()) {
                    finishPronunciationGame('Hoàn thành toàn bộ từ đã chọn!');
                    return;
                }
                renderCard(currentIndex);
                setTimeout(startMicRecognition, 520);
                return;
            }

            if (data.attemptCount >= 3) {
                finishPronunciationGame(`Dừng tại ${accuracy}% sau 3 lượt. Hãy thử lại từ đầu.`);
            } else {
                setTimeout(startMicRecognition, 1000);
            }
        }

        function startMicRecognition() {
            if (btnMic.classList.contains('listening')) return;
            if (pronunciationGameActive) {
                if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                const data = GAME_SESSION[currentIndex];
                if (data.attemptCount >= 3) {
                    finishPronunciationGame('Đã hết 3 lượt phát âm cho từ hiện tại.');
                    return;
                }
                data.attemptCount++;
            }
            startPronunciationCountdown();
            if (!recognition) return;
            try {
                recognition.start();
            } catch (error) {
                reportRuntimeIssue('Mic start error', error);
            }
        }

        // =========================================================
        // SPEECH RECOGNITION FEATURE
        // =========================================================
        let recognition;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 5;

            recognition.onstart = () => {
                btnMic.classList.add('listening');
                hardStopAudio();
                // Khi bật mic, có thể pause timer hoặc để chạy tùy ý thầy
                // Hiện tại giữ nguyên logic cũ
            };
            recognition.onend = () => {
                btnMic.classList.remove('listening');
                if (activePronunciationAttempt && !activePronunciationAttempt.completed) {
                    try {
                        recognition.start();
                    } catch (error) {
                        // ignore error if already starting
                    }
                }
            };
            recognition.onresult = (event) => {
                const transcripts = Array.from(event.results[0]).map((result) => result.transcript);
                completePronunciationCountdown();
                comparePronunciation(transcripts);
            };
            recognition.onerror = (event) => {
                btnMic.classList.remove('listening');
                reportRuntimeIssue('Mic error', event.error);
            };
        } else {
            setHidden(btnMic, true);
        }

        function updateMicStatus() {
            if (!recognition) return;
            let canUseMic = true;
            if (isGameMode && !pronunciationGameActive) {
                const data = GAME_SESSION[currentIndex];
                if (!data || !data.isFinished) canUseMic = false;
            }
            if (pronunciationGameFinished) canUseMic = false;
            btnMic.disabled = !canUseMic;
        }

        function applyFocusMode(enabled) {
            if (!isFocusModeSupported()) return;
            const isEnabled = !!enabled;
            document.body.classList.toggle('focus-mode', isEnabled);

            focusAutoFitEnabled = true;
            if (!isEnabled) {
                focusZoomScale = 1.0;
            }

            const btn = document.querySelector('.focus-toggle-btn');
            if (btn) {
                btn.innerHTML = isEnabled
                    ? `<i class="fa-solid fa-compress" aria-hidden="true"></i>Exit (F)`
                    : `<i class="fa-solid fa-expand" aria-hidden="true"></i>Focus Mode`;
                btn.title = isEnabled
                    ? 'Thoát chế độ Focus (F hoặc Esc). Nhấn = để Auto Fit, nhấn - để về 100%.'
                    : 'Bật chế độ Focus (F). Trong Focus: = Auto Fit, - về 100%.';
            }

            applyFocusZoomScale(focusZoomScale);
            // [DUKE] Re-render ensures the card is fresh and fits perfectly
            renderCard(currentIndex);
        }

        function initFocusMode() {
            if (!isFocusModeSupported()) return;
            try {
                localStorage.removeItem(FOCUS_MODE_KEY);
            } catch (err) { }
            document.body.classList.remove('focus-mode');
            focusZoomScale = 1.0;
            focusAutoFitEnabled = true;
        }

        function toggleFocusMode() {
            if (!isFocusModeSupported()) return;
            const isFocus = !document.body.classList.contains('focus-mode');
            applyFocusMode(isFocus);
        }

        function isFocusModeSupported() {
            const mode = document.body.getAttribute('data-mode');
            return mode === 'ipa' || mode === 'listening';
        }

        function applyFocusZoomScale(scale) {
            const isFocus = document.body.classList.contains('focus-mode');
            const card = document.querySelector('.flashcard');
            if (!card) return;

            focusZoomScale = Math.min(2.5, Math.max(1.0, Math.round(scale * 100) / 100));
            setRuntimeCssVariable(card, '--focus-zoom', focusZoomScale);

            if (!isFocus || focusZoomScale <= 1.001) {
                setRuntimeStyle(card, 'zoom', '');
                card.classList.remove('zoom-pending');
                return;
            }
            setRuntimeStyle(card, 'zoom', String(focusZoomScale));
            card.classList.remove('zoom-pending');
        }

        function doesFocusZoomFit(scale) {
            if (!document.body.classList.contains('focus-mode')) return false;
            const card = document.querySelector('.flashcard');
            if (!card || !displayArea) return false;

            const originalZoom = getRuntimeStyle(card, 'zoom');
            setRuntimeStyle(card, 'zoom', String(Math.round(scale * 100) / 100));

            const areaRect = displayArea.getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();

            // 1. Kiểm tra tràn vùng hiển thị
            if (cardRect.width > areaRect.width + 1 || cardRect.height > areaRect.height + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            // 2. Kiểm tra tràn nội dung (scrollbar)
            if (card.scrollHeight > card.offsetHeight + 1 || card.scrollWidth > card.offsetWidth + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            setRuntimeStyle(card, 'zoom', originalZoom);
            return true;
        }

        function ensureFocusZoomFitsCurrentSlide() {
            if (!document.body.classList.contains('focus-mode')) {
                applyFocusZoomScale(1.0);
                return;
            }
            if (!focusAutoFitEnabled) {
                applyFocusZoomScale(1.0);
                return;
            }

            let scale = 1.0;
            let lastFitScale = 1.0;
            while (scale <= 2.5) {
                if (doesFocusZoomFit(scale)) {
                    lastFitScale = scale;
                    scale = Math.round((scale + 0.05) * 100) / 100;
                } else {
                    break;
                }
            }
            applyFocusZoomScale(lastFitScale);
        }

        window.addEventListener('resize', function () {
            if (document.body.classList.contains('focus-mode')) {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        ensureFocusZoomFitsCurrentSlide();
                    });
                });
            }
        });

        function setIPAVisibility(mode) {
            if (document.body.getAttribute('data-mode') !== 'ipa') return;
            const normalizedMode = Number(mode);
            document.body.classList.remove('ipa-v-1', 'ipa-v-2', 'ipa-v-3', 'ipa-v-4', 'ipa-v-5');
            if ((normalizedMode >= 1 && normalizedMode <= 3) || normalizedMode === 5) {
                document.body.classList.add(`ipa-v-${normalizedMode}`);
            }
        }

        function toggleMic() {
            if (btnMic.disabled) {
                btnMic.classList.remove('is-shaking');
                void btnMic.offsetWidth;
                btnMic.classList.add('is-shaking');
                setTimeout(() => btnMic.classList.remove('is-shaking'), 500);
                return;
            }
            if (btnMic.classList.contains('listening')) {
                completePronunciationCountdown();
                recognition.stop();
            } else {
                startMicRecognition();
            }
        }

        // Position-aware IPA hints to reduce false positives
        function getPronunciationHint(target, spoken) {
            if (!target || !spoken) return "";

            const t = String(target).toLowerCase();
            const s = String(spoken).toLowerCase();

            // Rule 1: TH sound
            if (t.includes("th") && !s.includes("th")) {
                return "Âm /θ/ hoặc /ð/ (đặt lưỡi giữa răng)";
            }

            // Loop-based for position-aware phonetic errors
            const minLen = Math.min(t.length, s.length);
            for (let i = 0; i < minLen; i++) {
                // Rule 2: R vs L
                if (t[i] === 'r' && s[i] === 'l') {
                    return "Phân biệt /r/ (lưỡi cong) và /l/ (chạm lợi)";
                }
                // Rule 3: F vs P (ESL error)
                if (t[i] === 'f' && s[i] === 'p') {
                    return "Phân biệt /f/ (răng môi) và /p/ (bật hơi)";
                }
                // Rule 4: V vs B (ESL error)
                if (t[i] === 'v' && s[i] === 'b') {
                    return "Phân biệt /v/ và /b/";
                }
            }

            // Rule 5: Final -ed (check for sound)
            if (t.endsWith("ed")) {
                if (!s.endsWith("ed") && !s.endsWith("t") && !s.endsWith("d")) {
                    return "Đuôi -ed: /t/, /d/, hoặc /ɪd/";
                }
            }

            // Rule 6: Final -s/-es
            if (t.endsWith("s") && !s.endsWith("s")) {
                return "Đuôi -s: /s/ hoặc /z/";
            }
        }

        // [DUKE] Double Metaphone Algorithm for ESL Phonetic Matching
        function doubleMetaphone(word) {
            if (!word) return ["", ""];
            let w = String(word).toUpperCase().replace(/[^A-Z]/g, "");
            if (w.length === 0) return ["", ""];
            
            let current = 0;
            let length = w.length;
            let primary = "";
            let alternate = "";
            
            function isVowel(ch) {
                return ["A", "E", "I", "O", "U", "Y"].includes(ch);
            }
            
            while (current < length && primary.length < 4) {
                let ch = w[current];
                if (isVowel(ch)) {
                    if (current === 0) { primary += "A"; alternate += "A"; }
                    current++;
                } else if (ch === 'B') {
                    primary += 'P'; alternate += 'P';
                    current = (w[current + 1] === 'B') ? current + 2 : current + 1;
                } else if (ch === 'C') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'S'; alternate += 'S';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'D') {
                    if (w[current + 1] === 'G') {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'F' || ch === 'V') {
                    primary += 'F'; alternate += 'F';
                    current++;
                } else if (ch === 'G') {
                    if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'H') {
                    if (current === 0 || isVowel(w[current - 1])) {
                        primary += 'H'; alternate += 'H';
                    }
                    current++;
                } else if (ch === 'J') {
                    primary += 'J'; alternate += 'J';
                    current++;
                } else if (ch === 'K' || ch === 'Q') {
                    primary += 'K'; alternate += 'K';
                    current++;
                } else if (ch === 'L') {
                    primary += 'L'; alternate += 'L';
                    current++;
                } else if (ch === 'M') {
                    primary += 'M'; alternate += 'M';
                    current++;
                } else if (ch === 'N') {
                    primary += 'N'; alternate += 'N';
                    current++;
                } else if (ch === 'P') {
                    if (w[current + 1] === 'H') {
                        primary += 'F'; alternate += 'F';
                        current += 2;
                    } else {
                        primary += 'P'; alternate += 'P';
                        current++;
                    }
                } else if (ch === 'R') {
                    primary += 'R'; alternate += 'R';
                    current++;
                } else if (ch === 'S') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else {
                        primary += 'S'; alternate += 'S';
                        current++;
                    }
                } else if (ch === 'T') {
                    if (w[current + 1] === 'H') {
                        primary += '0'; alternate += '0';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'W') {
                    if (isVowel(w[current + 1])) {
                        primary += 'A'; alternate += 'A';
                    }
                    current++;
                } else if (ch === 'X') {
                    primary += 'KS'; alternate += 'KS';
                    current++;
                } else if (ch === 'Z') {
                    primary += 'S'; alternate += 'S';
                    current++;
                } else {
                    current++;
                }
            }
            return [primary, alternate];
        }

        // [DUKE] Detect Lesson Level dynamically
        function getLessonLevel() {
            if (typeof lessonLevel !== 'undefined' && lessonLevel) return lessonLevel.toUpperCase();
            const title = (document.title || "").toUpperCase();
            const path = window.location.pathname.toUpperCase();
            if (title.includes("LEVEL A") || path.includes("LEVEL A") || path.includes("LEVEL_A") || path.includes("A4. LUYEN NGHE")) return "A";
            if (title.includes("LEVEL C") || path.includes("LEVEL C") || path.includes("LEVEL_C") || path.includes("C4. LUYEN NGHE")) return "C";
            if (title.includes("LEVEL B") || path.includes("LEVEL B") || path.includes("LEVEL_B") || path.includes("B4. LUYEN NGHE")) return "B";
            return "B";
        }

        // [DUKE] Hybrid Phonetic match function with Level-specific adjustments
        function isPhoneticMatch(tVal, sVal, lvl) {
            if (tVal === sVal) return 1.0;
            const [tPri, tAlt] = doubleMetaphone(tVal);
            const [sPri, sAlt] = doubleMetaphone(sVal);
            if (!tPri || !sPri) return 0.0;
            
            if (tPri === sPri || (tAlt && sAlt && tAlt === sAlt)) {
                return 1.0;
            }
            
            if (lvl === "A") {
                // Nuốt âm cuối: so sánh mã Metaphone cắt bỏ ký tự cuối
                const tCut = tPri.slice(0, -1);
                const sCut = sPri.slice(0, -1);
                if (tCut && sCut && tCut === sCut) {
                    return 0.95;
                }
            }
            return getCharSimilarity(tPri, sPri);
        }

        const IPA_FULL_CREDIT_ALIASES = {
            "ant": ["and"],
            "son": ["sun"]
        };

        function getIpaWordClass(targetText) {
            const words = splitToCleanWords(normalizePhraseCanonical(targetText));
            if (words.length !== 1) return 'phrase';
            const word = words[0] || '';
            const syllableGroups = (word.match(/[aeiouy]+/g) || []).length;
            if (word.length <= 3) return 'short';
            if (word.length >= 8 || syllableGroups >= 3) return 'complex';
            return 'normal';
        }

        function selectBestIpaTranscript(targetText, candidates, level, modeCfg) {
            const unique = [];
            (Array.isArray(candidates) ? candidates : [candidates]).forEach((candidate) => {
                const value = String(candidate || '').trim();
                if (value && !unique.includes(value)) unique.push(value);
            });
            if (unique.length === 0) return '';

            const candidateConfig = Object.assign({ level: level }, modeCfg);
            return unique.map((candidate, index) => ({
                candidate,
                index,
                result: dukeScorePronunciation(targetText, candidate, candidateConfig)
            })).sort((a, b) => {
                if (b.result.accuracy !== a.result.accuracy) return b.result.accuracy - a.result.accuracy;
                if (a.result.tokenMatchResults.filter((item) => item.status === 'wrong').length !== b.result.tokenMatchResults.filter((item) => item.status === 'wrong').length) {
                    return a.result.tokenMatchResults.filter((item) => item.status === 'wrong').length - b.result.tokenMatchResults.filter((item) => item.status === 'wrong').length;
                }
                return a.index - b.index;
            })[0].candidate;
        }

        function isIpaFullCreditEquivalent(targetValue, spokenValue) {
            if (!targetValue || !spokenValue || /\d/.test(targetValue)) return false;
            if (IPA_FULL_CREDIT_ALIASES[targetValue] && IPA_FULL_CREDIT_ALIASES[targetValue].includes(spokenValue)) return true;
            const [targetPrimary] = doubleMetaphone(targetValue);
            const [spokenPrimary] = doubleMetaphone(spokenValue);
            return targetPrimary.length >= 2 && targetPrimary === spokenPrimary;
        }

        function comparePronunciation(spokenText) {
            try {
                if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                const data = GAME_SESSION[currentIndex];
                if (data && !pronunciationGameActive) data.attemptCount = (data.attemptCount || 0) + 1;

                const isIPAMode = (document.body.getAttribute('data-mode') === 'ipa');
                const lvl = getLessonLevel();
                let modeCfg;

                if (isIPAMode) {
                    modeCfg = DUKE_SCORING_CONFIG.ipa_strict || {
                        confusion: 0.95, phonetic: 0.90, fuzzyHigh: 0.85, fuzzyLow: 0.70,
                        contraction: 1.0, exactThreshold: 0.92, fuzzyThreshold: 0.88, passScore: 88
                    };
                } else if (lvl === "A") {
                    modeCfg = DUKE_SCORING_CONFIG.level_a;
                } else if (lvl === "C") {
                    modeCfg = DUKE_SCORING_CONFIG.level_c;
                } else {
                    modeCfg = DUKE_SCORING_CONFIG[scoringMode] || DUKE_SCORING_CONFIG.youth;
                }

                let eThresh = modeCfg.exactThreshold || DUKE_SCORING_CONFIG.exactThreshold;
                let fThresh = modeCfg.fuzzyThreshold || DUKE_SCORING_CONFIG.fuzzyThreshold;
                let pScore = modeCfg.passScore || DUKE_SCORING_CONFIG.passScore;
                let missingPenaltyCoeff = (modeCfg.missingPenalty !== undefined) ? modeCfg.missingPenalty : 0.25;

                const item = lessonData[currentIndex];
                // CRITICAL: IPA mode scores ONLY against title. Non-IPA scores against text.
                const originalText = isIPAMode ? (item.title || "") : item.text;
                if (isIPAMode) {
                    const wordClass = getIpaWordClass(originalText);
                    if (wordClass === 'short') modeCfg = Object.assign({}, modeCfg, { passScore: Math.min(modeCfg.passScore || 88, 80) });
                    else if (wordClass === 'complex') modeCfg = Object.assign({}, modeCfg, { passScore: Math.min(modeCfg.passScore || 88, 84) });
                    spokenText = selectBestIpaTranscript(originalText, spokenText, lvl, modeCfg);
                    eThresh = modeCfg.exactThreshold || DUKE_SCORING_CONFIG.exactThreshold;
                    fThresh = modeCfg.fuzzyThreshold || DUKE_SCORING_CONFIG.fuzzyThreshold;
                    pScore = modeCfg.passScore || DUKE_SCORING_CONFIG.passScore;
                    missingPenaltyCoeff = (modeCfg.missingPenalty !== undefined) ? modeCfg.missingPenalty : 0.25;
                }
                // Canonical phrase normalization layer (collapse spoken variants)
                const normalizedTarget = normalizePhraseCanonical(originalText);
                const tokens = buildTargetTokens(normalizedTarget);

                const spokenNormalized = normalizePhraseCanonical(spokenText);
                const spokenCleanRaw = splitToCleanWords(spokenNormalized);
                const { canonicalList: spokenCanon } = collapseNumericalTokens(spokenCleanRaw);
                const spokenPhrase = normalizeTranscriptForPhraseMatch(spokenText);

                // Danh sách từ mục tiêu "được chấm"
                const targetList = [];
                const wordToTokenIndex = []; // index trong targetList -> index trong tokens

                tokens.forEach((t, tokenIdx) => {
                    if (t.skip) return;
                    (t.cleanParts || []).forEach(part => {
                        targetList.push(part);
                        wordToTokenIndex.push(tokenIdx);
                    });
                });

                // Canonicalize targetList
                const { canonicalList: targetCanon, originalToCanonicalIndex: tMap } = collapseNumericalTokens(targetList);

                // --- Phrase chunking to improve multi-word alignment before LCS ---
                const matchedTIndices = new Set();
                const matchedSIndices = new Set();
                const phraseMatches = [];

                const targetChunks = buildPhraseChunks(targetCanon);
                const spokenChunks = buildPhraseChunks(spokenCanon);

                // Prioritize longer chunks
                [3, 2, 1].forEach(len => {
                    targetChunks.filter(tc => (tc.end - tc.start + 1) === len).forEach(tc => {
                        // Avoid forEach callback early-return bug when checking chunk overlap
                        let skipTargetChunk = false;
                        for (let i = tc.start; i <= tc.end; i++) {
                            if (matchedTIndices.has(i)) {
                                skipTargetChunk = true;
                                break;
                            }
                        }
                        if (skipTargetChunk) return;
                        for (const sc of spokenChunks) {
                            if ((sc.end - sc.start + 1) !== len) continue;
                            let sRangeUsed = false;
                            for (let j = sc.start; j <= sc.end; j++) if (matchedSIndices.has(j)) { sRangeUsed = true; break; }
                            if (sRangeUsed) continue;

                            // Semantic variant matching for spoken forms (e.g., gonna, wanna, o'clock variants)
                            if (tc.text === sc.text || isContractionEquivalent(tc.text, sc.text) || matchSemanticVariant(tc.text, sc.text)) {
                                for (let i = tc.start; i <= tc.end; i++) matchedTIndices.add(i);
                                for (let j = sc.start; j <= sc.end; j++) matchedSIndices.add(j);
                                for (let k = 0; k < len; k++) {
                                    phraseMatches.push({ tIdx: tc.start + k, sIdx: sc.start + k, similarity: 1.0 });
                                }
                                break;
                            }
                        }
                    });
                });

                // LCS trên các token còn lại
                const targetForLCS = targetCanon.map((v, i) => matchedTIndices.has(i) ? `__T${i}__` : v);
                const spokenForLCS = spokenCanon.map((v, i) => matchedSIndices.has(i) ? `__S${i}__` : v);
                const fuzzyMatches = lcsMatchIndices(targetForLCS, spokenForLCS);

                const matchedMap = new Map(); // tIdx in targetCanon -> { sIdx, similarity }
                phraseMatches.forEach(m => matchedMap.set(m.tIdx, { sIdx: m.sIdx, similarity: m.similarity }));
                fuzzyMatches.forEach(m => {
                    if (!matchedMap.has(m.tIdx)) matchedMap.set(m.tIdx, { sIdx: m.sIdx, similarity: m.similarity });
                });

                let totalWeight = 0;
                let earnedScore = 0;
                let missingImportantPenalty = 0;
                let htmlResult = "";

                const tokenMatchResults = tokens.map((t, tIdx) => {
                    if (t.skip) return { status: 'skip', score: 0 };

                    // Penalize missing words: tokens without any match contribute 0 score but full weight
                    totalWeight += t.weight;

                    const wordIndices = [];
                    wordToTokenIndex.forEach((val, idx) => { if (val === tIdx) wordIndices.push(idx); });

                    let maxScoreFactor = 0;
                    let bestStatus = 'wrong';
                    let bestSpokenValue = "";

                    wordIndices.forEach(wIdx => {
                        const cIdx = tMap[wIdx];
                        if (matchedMap.has(cIdx)) {
                            const match = matchedMap.get(cIdx);
                            const tValue = targetCanon[cIdx];
                            const sValue = spokenCanon[match.sIdx];

                            let currentScoreFactor = 0;
                            let currentStatus = 'wrong';

                            const pMatchScore = isPhoneticMatch(tValue, sValue, lvl);

                            if (tValue === sValue) {
                                currentScoreFactor = 1.0;
                                currentStatus = 'correct';
                            }
                            else if (isIPAMode && targetCanon.length === 1 && isIpaFullCreditEquivalent(tValue, sValue)) {
                                currentScoreFactor = 1.0;
                                currentStatus = 'accepted';
                            }
                            else if (!/\d/.test(tValue) && isConfusionEquivalent(tValue, sValue)) {
                                currentScoreFactor = modeCfg.confusion;
                                currentStatus = 'close';
                            }
                            else if (!/\d/.test(tValue) && (pMatchScore >= 0.9 || (targetCanon.length === 1 && pMatchScore >= 0.75))) {
                                currentScoreFactor = (targetCanon.length === 1) ? Math.max(modeCfg.phonetic, modeCfg.phonetic * pMatchScore) : (modeCfg.phonetic * pMatchScore);
                                currentStatus = 'close';
                            }
                            else {
                                const sim = match.similarity;
                                if (sim >= eThresh) {
                                    currentScoreFactor = 1.0;
                                    currentStatus = 'close';
                                }
                                else if (sim >= 0.65) {
                                    currentScoreFactor = modeCfg.fuzzyHigh;
                                    currentStatus = 'close';
                                }
                                else if (sim >= fThresh) {
                                    currentScoreFactor = modeCfg.fuzzyLow;
                                    currentStatus = 'close';
                                }
                            }

                            if (currentScoreFactor > maxScoreFactor) {
                                maxScoreFactor = currentScoreFactor;
                                bestStatus = currentStatus;
                                bestSpokenValue = sValue;
                            }
                        }
                    });

                    // Override contraction (global search như cũ nếu LCS không khớp)
                    if (maxScoreFactor < 1.0 && t.contractionKey) {
                        // Two-way contraction matching (e.g., "I'm" ↔ "I am")
                        if (isContractionInTranscript(spokenPhrase, t.contractionKey)) {
                            maxScoreFactor = modeCfg.contraction;
                            bestStatus = 'close';
                        }
                    }

                    if (maxScoreFactor === 0) {
                        // Extra penalty for missing words, stronger on important tokens
                        if (t.weight >= 1.0) missingImportantPenalty += missingPenaltyCoeff * t.weight;
                        else missingImportantPenalty += (missingPenaltyCoeff * 0.4) * t.weight;
                    }

                    earnedScore += (maxScoreFactor * t.weight);
                    return {
                        status: bestStatus,
                        score: maxScoreFactor * t.weight,
                        spokenValue: bestSpokenValue
                    };
                });

                earnedScore = Math.max(0, earnedScore - missingImportantPenalty);

                tokens.forEach((t, tIdx) => {
                    const res = tokenMatchResults[tIdx];
                    if (res.status === 'skip') {
                        htmlResult += `<span class="w-skip">${t.display} </span>`;
                    } else if (res.status === 'correct') {
                        htmlResult += `<span class="w-correct">${t.display} </span>`;
                    } else if (res.status === 'accepted') {
                        htmlResult += `<span class="w-correct" title="Nhận diện tương đương">${t.display} </span>`;
                    } else if (res.status === 'close') {
                        htmlResult += `<span class="w-close">${t.display} </span>`;
                    } else {
                        // Use best matched spoken token for more accurate pronunciation hints
                        const hintTarget = (t.cleanParts && t.cleanParts[0]) || t.display;
                        const hint = getPronunciationHint(hintTarget, res.spokenValue || "");
                        htmlResult += `<span class="w-wrong" title="${hint || 'Phát âm chưa chính xác'}">${t.display}</span> `;
                    }
                });

                const accuracy = (totalWeight === 0) ? 100 : Math.round((earnedScore / totalWeight) * 100);
                const effectivePassScore = pronunciationGameActive ? 80 : pScore;
                const isPass = accuracy >= effectivePassScore;

                // Record attempt history
                if (data) {
                    data.attemptsHistory = data.attemptsHistory || [];
                    data.attemptsHistory.push(accuracy);
                }

                let isEncouraged = false;
                if (!isPass && data && data.attemptCount >= 3) {
                    const last3 = data.attemptsHistory.slice(-3);
                    if (last3.length >= 3 && last3.every(s => s < pScore)) {
                        const minScore = Math.min(...last3);
                        const maxScore = Math.max(...last3);
                        if ((maxScore - minScore) <= 15) {
                            isEncouraged = true;
                        }
                    }
                }

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');

                const badgeClass = isPass ? "score-perfect" : "score-bad";
                const badgeText = isPass ? `PASS: ${accuracy}%` : (isEncouraged ? `Hãy về luyện tập thêm nhé! (${accuracy}%)` : `FAIL: ${accuracy}%`);

                feedbackBox.innerHTML = `
                    <div class="speech-score-badge ${badgeClass}">${badgeText}</div>
                    <div class="speech-detail">${htmlResult}</div>
                `;

                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const flashcard = document.querySelector('.flashcard');
                if (flashcard) flashcard.appendChild(feedbackBox);

                if (isGameMode && isPass) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && !data.isFinished) {
                        data.isFinished = true;
                        renderProgressBar();
                        updateMicStatus();
                    }

                    // Thưởng tim cho câu PASS ngay lần đầu 
                    if (data && data.attemptCount === 1 && !data.hasEarnedHeart) {
                        globalHearts++;
                        data.hasEarnedHeart = true;
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
                    }
                }

                if (pronunciationGameActive) {
                    handlePronunciationGameResult(isPass, accuracy);
                }

            } catch (err) {
                reportRuntimeIssue('Pronunciation scoring error', err);
                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');
                feedbackBox.innerHTML = `
                    <div class="speech-score-badge score-bad">CÓ LỖI KHI CHẤM</div>
                    <div class="speech-detail compact">
                        Thầy/cô hãy bấm F5 để tải lại trang. Nếu vẫn lỗi, gửi file này cho tôi để sửa tiếp.
                    </div>
                `;

                const flashcard = document.querySelector('.flashcard');
                if (flashcard) flashcard.appendChild(feedbackBox);
            }
        }

        function showHealEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.classList.add('w-correct');
                badge.innerText = "+1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        document.addEventListener('keydown', function (event) {
            // Skip shortcuts if user is typing in an input field
            const target = event.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;

            const isIPA = document.body.getAttribute('data-mode') === 'ipa';
            const supportsFocus = isFocusModeSupported();
            const isFocus = document.body.classList.contains('focus-mode');

            if (supportsFocus) {
                // Focus Toggle (F)
                if (event.key.toLowerCase() === 'f') {
                    event.preventDefault();
                    toggleFocusMode();
                    return;
                }

                // Focus-specific Zoom/Esc
                if (isFocus) {
                    // Escape to exit focus
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        applyFocusMode(false);
                        return;
                    }
                    // Zoom controls
                    if (event.key === '=') {
                        event.preventDefault();
                        focusAutoFitEnabled = true;
                        ensureFocusZoomFitsCurrentSlide();
                        return;
                    }
                    if (event.key === '-') {
                        event.preventDefault();
                        focusAutoFitEnabled = false;
                        applyFocusZoomScale(1.0);
                        return;
                    }
                }
            }

            if (isIPA) {
                // IPA Visibility (1-5) - Both inside and outside focus
                if (event.key === '1') { setIPAVisibility(1); return; }
                if (event.key === '2') { setIPAVisibility(2); return; }
                if (event.key === '3') { setIPAVisibility(3); return; }
                if (event.key === '4') { setIPAVisibility(4); return; }
                if (event.key === '5') { setIPAVisibility(5); return; }
            }

            if (event.code === 'Space') { event.preventDefault(); handlePlayClick(); }
            else if (event.code === 'ArrowRight') goNext();
            else if (event.code === 'ArrowLeft') goPrev();
            else if (event.code === 'Enter') { event.preventDefault(); toggleMic(); }
            else if (event.key.toLowerCase() === 'a') { event.preventDefault(); playAuto(); }

            // [DUKE UPDATE] Logic phím tắt trong Game Mode
            if (isGameMode && !isGameFinished) {
                const key = event.key.toLowerCase();

                // Trừ Tim (Trọng tài)
                if (event.key === '`') {
                    if (globalHearts > 0) {
                        globalHearts--;
                        showDamageEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        if (globalHearts <= 0) finishGameGlobal(false);
                    }
                }
                // Cộng Tim (Trọng tài)
                else if (event.key === '1') {
                    if (globalHearts < maxGlobalHearts) { // Giới hạn max tim, hoặc bỏ check này nếu muốn cộng thoải mái
                        globalHearts++;
                        showHealEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                    }
                }

                else if (key === 'r') refereeReplay();
                else if (key === 'p') { isTimerPaused = !isTimerPaused; updateTimerDisplay(); }
                else if (event.key === '+' || event.key === '=') { timeLeft += 10; updateTimerDisplay(); }
                else if (event.key === '-' || event.key === '_') { timeLeft = Math.max(0, timeLeft - 10); updateTimerDisplay(); }
                else if (key === 'a') toggleGameMode();
            } else {
                if (event.key.toLowerCase() === 'a' && document.body.getAttribute('data-mode') !== 'ipa') toggleGameMode();
            }
        });

        renderCard(0);
    </script>
</body>

</html>
