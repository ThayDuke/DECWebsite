        .cost-badge {

            right: -5px;

                opacity: 1;
            }

                opacity: 0;

        .speech-feedback-box {

        }

        .score-perfect {
            background: var(--success-green);
            box-shadow: 0 4px 10px var(--ulti-rgba-46-125-50-03);
        }

        .score-good {
            background: var(--orange-btn);
        }

        .score-bad {
            background: var(--danger-red);
        }

        .speech-detail {
            font-size: 1.5em;
            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        }

        .speech-detail.compact {
            margin-top: 8px;
            color: var(--ulti-hex-555);
            font-size: 1em;
        }

        .w-correct {
            color: var(--success-green);
            font-weight: var(--font-weight-strong);
        }

        .w-close {
            color: var(--orange-btn);
            font-weight: var(--font-weight-strong);
        }

        .w-wrong {
            color: var(--danger-red);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .w-skip {
            color: var(--ulti-rgba-46-125-50-078);
            font-weight: var(--font-weight-strong);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ulti-rgba-0-0-0-06);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);

        @keyframes slideUp {
            from {

                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;

        .score-title {

            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;

            border-bottom: 2px solid var(--ulti-hex-eee);
            padding-bottom: 5px;
        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

        .btn-restart {
            background: var(--btn-primary-bg);
            color: var(--color-on-accent);
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin: var(--lesson-theme-row-margin);
        }

        body[data-mode="ipa"] .theme-row {
            justify-content: flex-end;
            margin: 0;
        }

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            min-height: 44px;
        }

        .ipa-study-controls {
            position: absolute;
            left: 0;
            display: inline-flex;
            align-items: center;
            gap: var(--accent-height);
            min-width: 0;
        }

        .ipa-order-toggle {
            height: 38px;
            min-width: 104px;
            padding: 0 12px;
            border: 1px solid var(--border-main);
            border-radius: var(--toggle-height);
            background: var(--surface-solid);
            color: var(--text-color);
            box-shadow: var(--toggle-slider-shadow);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1), color 0.24s cubic-bezier(0.32, 0.72, 0, 1);
        }

        .ipa-order-toggle-switch {
            display: inline-block;
            position: relative;
            width: 72px;
            height: 36px;
            vertical-align: middle;
            margin: 0 10px 0 0;
            user-select: none;
        }

        .ipa-order-toggle-switch input {
            display: none;
        }

        .ipa-order-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--btn-primary-bg); /* Nền đỏ hồng cho Thứ tự */
            transition: .4s;
            border-radius: 36px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
            box-sizing: border-box;
            background-clip: padding-box;
        }

        .ipa-order-toggle-switch .slider-knob {
            position: absolute;
            height: 28px;
            width: 28px;
            left: 3px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            border: 2px solid transparent;
            background-color: var(--surface-solid);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.4s ease, background-color 0.4s ease;
        }

        .ipa-order-toggle-switch input:checked + .slider {
            background: var(--btn-secondary-bg); /* Nền xanh teal cho Ngẫu nhiên */
            box-shadow: var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .ipa-order-toggle-switch input:checked + .slider .slider-knob {
            transform: translateX(38px);
        }
        
        .ipa-order-toggle-switch .slider-knob i {
            font-size: 0.9rem;
            color: var(--focus-action-text, #19a7a0);
            transition: color 0.4s ease;
        }

        .ipa-order-toggle:hover {
            color: var(--primary-pink);
        }

        .ipa-order-toggle:active {
            transform: scale(0.97);
        }

        .ipa-order-toggle:disabled,
        .ipa-timer-segments .segmented-btn:disabled {
            cursor: not-allowed;
            opacity: 0.58;
        }

        .ipa-timer-segments.segmented-control {
            --segment-size: 27px;
            --segment-padding: 2px;
            --segment-gap: 3px;
            --control-width: calc(var(--segment-size) * 3 + var(--segment-gap) * 2 + var(--segment-padding) * 2 + 3px);

            display: flex;
            align-items: center;
            position: relative;
            width: var(--control-width);
            height: var(--dmu-control-small-height);
            padding: var(--segment-padding);
            gap: var(--segment-gap);
            margin: 0 auto;
            border: 1.5px solid #d5e2ef;
            border-radius: var(--dmu-control-small-height);
            background: rgba(245, 247, 250, 0.9);
            box-shadow: none;
            justify-self: center;
            align-self: center;
            box-sizing: border-box;
        }

        .ipa-timer-segments.segmented-control::before {
            content: "";
            position: absolute;
            top: var(--segment-padding);
            left: var(--segment-padding);
            width: var(--segment-size);
            height: var(--segment-size);
            border-radius: 50%;
            background: var(--btn-secondary-bg);
            transform: translateX(var(--ipa-timer-segment-shift, 0));
            transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
            pointer-events: none;
        }

        .ipa-timer-segments .segmented-btn {
            flex: 0 0 var(--segment-size);
            width: var(--segment-size);
            height: var(--segment-size);
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #4a5c70;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            font-family: "Be Vietnam Pro", sans-serif;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: color 0.24s cubic-bezier(0.32, 0.72, 0, 1), transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
            font-size: 0.82rem;
            line-height: 1;
            box-sizing: border-box;
        }

        .ipa-timer-segments .segmented-btn[data-seconds="0"] {
            font-size: 1.25rem;
        }

        .ipa-timer-segments .segmented-btn.active {
            color: #ffffff;
        }

        .ipa-timer-segments .segmented-btn:active {
            transform: scale(0.96);
        }

        .ipa-timer-segments .fa-clock {
            font-size: 0.82em;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
            justify-self: start;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        function normalizePhraseForVariant(text) {
            if (!text) return "";
            return String(text).toLowerCase().replace(/\s+/g, " ").trim();
        }

        function matchSemanticVariant(target, spoken) {
            if (!target || !spoken) return false;
            const t = normalizePhraseForVariant(target);
            const s = normalizePhraseForVariant(spoken);
            if (t === s) return true;
            for (const group of DUKE_SEMANTIC_VARIANTS) {
                if (group.includes(t) && group.includes(s)) return true;
            }
            return false;
        }

        const DUKE_PHRASE_CANONICAL_MAP = [
            { canonical: "oclock", variants: ["o clock", "clock", "a clock", "the clock"] },
            { canonical: "going to", variants: ["gonna"] },

            { canonical: "got to", variants: ["gotta"] },
            { canonical: "kind of", variants: ["kinda"] },
            { canonical: "a lot of", variants: ["lotta"] }
        ];

        function normalizePhraseCanonical(text) {
            let t = normalizePhraseForVariant(text);
            DUKE_PHRASE_CANONICAL_MAP.forEach(rule => {
                rule.variants.forEach(v => {
                    const pattern = new RegExp(`\\b${v}\\b`, "g");
                    t = t.replace(pattern, rule.canonical);
                });
            });
            return t;
        }

        // Two-way contraction matching (e.g., "I'm" ↔ "I am")
        function isContractionEquivalent(s1, s2) {
            if (!s1 || !s2) return false;
            const t1 = String(s1).toLowerCase().trim();
            const t2 = String(s2).toLowerCase().trim();
            if (t1 === t2) return true;
            for (const group of DUKE_CONTRACTION_GROUPS) {
                if (group.includes(t1) && group.includes(t2)) return true;
            }
            return false;

            if (!spokenPhrase || !targetPhrase) return false;
            const targetCanon = targetPhrase.toLowerCase().trim();
            const group = DUKE_CONTRACTION_GROUPS.find(g => g.includes(targetCanon));
            if (group) {
                return group.some(variant => phraseHasVariant(spokenPhrase, variant));
            }
            return phraseHasVariant(spokenPhrase, targetPhrase);
        }

                // bigram
                if (i < words.length - 1) {
                    chunks.push({ text: words[i] + " " + words[i + 1], start: i, end: i + 1 });

                // trigram
                if (i < words.length - 2) {
                    chunks.push({ text: words[i] + " " + words[i + 1] + " " + words[i + 2], start: i, end: i + 2 });
                }
            }
            return chunks;

        function startPronunciationCountdown() {
            cancelPronunciationCountdown();
            if (ipaTimeLimit <= 0) return;
            const slot = document.querySelector('.countdown-slot');
            const fill = document.querySelector('.countdown-fill');
            if (!slot || !fill) return;
            const startedAt = performance.now();
            const duration = ipaTimeLimit * 1000;
            const attempt = { completed: false, index: currentIndex };
            activePronunciationAttempt = attempt;
            slot.classList.add('is-active');
            setRuntimeCssVariable(fill, '--ipa-countdown-progress', '1');

            const tick = now => {
                if (activePronunciationAttempt !== attempt || attempt.completed) return;
                const remaining = Math.max(0, 1 - ((now - startedAt) / duration));
                setRuntimeCssVariable(fill, '--ipa-countdown-progress', String(remaining));
                if (remaining > 0) {
                    countdownFrame = requestAnimationFrame(tick);
                    return;
                }
                attempt.completed = true;
                countdownFrame = 0;
                slot.classList.remove('is-active');
                try {
                    if (recognition && btnMic.classList.contains('listening')) recognition.stop();
                } catch (error) {

                if (pronunciationGameActive) handlePronunciationGameResult(false, 0);
            };
            countdownFrame = requestAnimationFrame(tick);

        function stripSkipMarkersFromText(text) {

                "i'm": "i am",
                "you're": "you are",
                "he's": "he is",
                "she's": "she is",
                "it's": "it is",
                "we're": "we are",
                "they're": "they are",
                "i've": "i have",
                "you've": "you have",
                "we've": "we have",
                "they've": "they have",
                "i'll": "i will",
                "you'll": "you will",
                "he'll": "he will",
                "she'll": "she will",
                "we'll": "we will",
                "they'll": "they will",
                "don't": "do not",
                "doesn't": "does not",
                "didn't": "did not",
                "can't": "cannot",
                "won't": "will not",
                "isn't": "is not",
                "aren't": "are not",
                "wasn't": "was not",
                "weren't": "were not",
                "shouldn't": "should not",
                "wouldn't": "would not",
                "couldn't": "could not"

        function collapseNumericalTokens(tokens) {
            const canonicalList = [];
            const originalToCanonicalIndex = new Array(tokens.length).fill(-1);

                let currentVal = 0;
                let totalVal = 0;
                let hasNumber = false;

                while (j < n) {
                    let w = tokens[j].toLowerCase();

                    }

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;
                            if (val === 100) currentVal *= 100;
                            else { totalVal += currentVal * val; currentVal = 0; }
                        } else {
                            if (currentVal >= 20 && currentVal < 100 && currentVal % 10 === 0 && val < 10) {

                            } else if (currentVal > 0 && (val >= 10 || (currentVal >= 11 && currentVal <= 99))) {

                                currentVal = val;
                            } else {

                                currentVal = val;
                            }

                    const cIdx = canonicalList.length;
                    canonicalList.push(finalNum);

        function convertNumbers(word) {

        }

        function normalizeApostrophes(text) {

            return (text || "").replace(/'/g, "'");
        }

        function normalizeTranscriptForPhraseMatch(text) {
            // Chuẩn hóa transcript để kiểm tra "cụm từ" (there is / do not / ...)
            // - lowercase
            // - giữ chữ/số và apostrophe '
            // - gom khoảng trắng
            let t = normalizeApostrophes(text).toLowerCase();
            t = t.replace(/[^a-z0-9'\s]/g, " ");
            t = t.replace(/\s+/g, " ").trim();
            return t;
        }

        function contractionKeyFromRaw(rawWord) {
            // Lấy key contraction từ token gốc (VD: "There's" -> "there's")
            // Chỉ giữ chữ/số và apostrophe, bỏ dấu câu.
            let t = normalizeApostrophes(stripSkipMarkersFromText(rawWord || "")).toLowerCase();
            t = t.replace(/[^a-z0-9']/g, " ");
            t = t.replace(/\s+/g, " ").trim();
            if (!t) return "";

            const parts = t.split(" ");
            const withApos = parts.find(x => x.includes("'"));
            return (withApos || parts[0] || "").trim();
        }

        function phraseHasVariant(spokenPhrase, variant) {
            // Kiểm tra transcript có chứa biến thể (phrase) hay không,
            // nhưng "tha thứ" thêm cho trường hợp SpeechRecognition bỏ dấu nháy:
            // "there's" -> "theres" hoặc "there s"
            const base = normalizeTranscriptForPhraseMatch(variant);
            if (!base) return false;

            const s0 = normalizeTranscriptForPhraseMatch(spokenPhrase || "");
            const s = " " + s0 + " ";

            const candidates = new Set();
            candidates.add(base);

            // Nếu có apostrophe, tạo thêm 2 biến thể:
            // 1) bỏ hẳn apostrophe: "there's" -> "theres"
            // 2) thay apostrophe thành khoảng trắng: "there's" -> "there s"
            if (base.includes("'")) {
                candidates.add(base.replace(/'/g, ""));
                candidates.add(base.replace(/'/g, " "));
            }

            // Nếu không có apostrophe, vẫn thử trường hợp speech engine chèn khoảng trắng bất thường
            // (ít gặp nhưng an toàn): "dont" -> "don t"
            if (!base.includes("'") && base.length >= 4) {

                candidates.add(base.slice(0, -1) + " " + base.slice(-1));

        function splitToCleanWords(text) {
            const parts = (text || "").trim().split(/\s+/);
            const out = [];
            parts.forEach(p => {
                const n = normalizeWord(p);
                if (!n) return;
                n.split(/\s+/).forEach(x => {
                    if (x && x.length > 0) out.push(x);

        function containsNonASCII(text) {

        function phoneticNormalize(word) {

            w = w.replace(/[ɛe]/g, "e");
            w = w.replace(/[ʌə]/g, "a");
            w = w.replace(/[ʃ]/g, "sh");
            w = w.replace(/[Ê']/g, "zh");
            w = w.replace(/[θ]/g, "th");
            w = w.replace(/[ð]/g, "th");

        // [DUKE] Smart Levenshtein Comparison for IPA/Pronunciation
        function getLevenshteinDistance(s1, s2) {
            const m = s1.length, n = s2.length;
            if (m === 0) return n; if (n === 0) return m;
            const d = Array.from({ length: m + 1 }, () => new Uint8Array(n + 1));
            for (let i = 0; i <= m; i++) d[i][0] = i;
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let j = 1; j <= n; j++) {
                for (let i = 1; i <= m; i++) {
                    const cost = (s1[i - 1] === s2[j - 1]) ? 0 : 1;
                    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                }
            }
            return d[m][n];
        }

        function getCharSimilarity(s1, s2) {
            if (!s1 || !s2) return (s1 === s2) ? 1.0 : 0.0;

            const n1 = normalizeForSimilarity(s1);
            const n2 = normalizeForSimilarity(s2);
            if (n1 === n2) return 1.0;

            const dist = getLevenshteinDistance(n1, n2);
            const maxLen = Math.max(n1.length, n2.length);
            return 1.0 - (dist / maxLen);
        }

        function lcsMatchIndices(a, b) {
            // Fuzzy LCS: returns array of { tIdx, sIdx, similarity }
            const n = a.length;
            const m = b.length;
            const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const sim = getCharSimilarity(a[i - 1], b[j - 1]);
                    if (sim >= 0.6) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            const matches = [];
            let i = n, j = m;
            while (i > 0 && j > 0) {
                const sim = getCharSimilarity(a[i - 1], b[j - 1]);
                if (sim >= 0.6 && dp[i][j] > Math.max(dp[i - 1][j], dp[i][j - 1])) {
                    matches.push({ tIdx: i - 1, sIdx: j - 1, similarity: sim });
                    i--; j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }
            return matches;
        }

        function renderProgressBar() {
            progressBarContainer.innerHTML = '';

                    progressBarContainer.classList.remove('wrap-mode');
                }
            }

            for (let i = 0; i < total; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';
                segment.innerText = i + 1;
                if (ipaOrderMode === 'sequence' && !pronunciationGameActive) {
                    segment.onclick = () => jumpToSentence(i);
                } else {
                    segment.classList.add('disabled');
                }

                if (i === currentIndex) {
                    segment.classList.add('active');
                }

                if (isGameMode) {
                    if (GAME_SESSION[i]) {
                        const data = GAME_SESSION[i];
                        if (data.isFinished || data.isLocked) {
                            segment.classList.add('done');
                        } else if (i < currentIndex) {
                            segment.classList.add('warn');
                        }
                    } else if (i < currentIndex) {
                        segment.classList.add('warn');
                    }
                } else {
                    if (i < currentIndex) {
                        segment.classList.add('done');
                    }
                }

                progressBarContainer.appendChild(segment);
            }
        }

        function renderCard(index) {
            if (!lessonData || lessonData.length === 0) return;

            if (!GAME_SESSION[index]) initGameDataForIndex(index);
            const data = GAME_SESSION[index];
            const item = lessonData[index];

            renderProgressBar();

            if (isGameMode) {
                const isMaxListensReached = data.listenCount >= 5;
                const isOutOfHearts = data.listenCount >= 1 && globalHearts <= 1;
                const shouldDisable = !data.isFinished && !data.isLocked && (isMaxListensReached || isOutOfHearts);

                if (shouldDisable) {
                    btnPlay.classList.add('disabled');
                    btnPlay.disabled = true;
                } else {
                    btnPlay.classList.remove('disabled');
                    btnPlay.disabled = false;
                }
            } else {
                btnPlay.classList.remove('disabled');
                btnPlay.disabled = false;
            }

            if (isGameMode) {
                renderGameInterface(index);
            } else {
                let hiddenClass = isSubVisible ? '' : 'text-hidden';
                const isIPAMode = document.body.getAttribute('data-mode') === 'ipa';
                const isFocusMode = document.body.classList.contains('focus-mode');
                const focusClass = isFocusMode ? 'zoom-pending' : '';
                const colorClass = (index % 2 === 0) ? 'dec-text-primary' : 'dec-text-secondary';

                if (isIPAMode) {
                    displayArea.innerHTML = `
                        <div class="flashcard ${isPlaying ? 'active' : ''} ${focusClass}">
                            <div class="ipa-zoom-content">
                                <div class="slide-title">${item.title || ''}</div>
                                <div class="slide-subtitle">${item.subtitle || '---'}</div>
                                <div class="slide-body text-content ${colorClass}">${stripSkipMarkersFromText(item.text || '---')}</div>
                                <div class="countdown-slot" aria-hidden="true">
                                    <div class="countdown-track"><div class="countdown-fill"></div></div>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    displayArea.innerHTML = `
                        <div class="flashcard ${isPlaying ? 'active' : ''} ${focusClass}">
                            <!-- Top Spacer for Balance -->
                            <div class="card-top-area">
                                ${item.title ? `<div class="ipa-title">${item.title}</div>` : ''}
                                ${item.subtitle ? `<div class="ipa-subtitle">${item.subtitle}</div>` : ''}
                            </div>
                            
                            <!-- Middle Anchor -->
                            <div class="card-middle-area">
                                <span class="text-content ${colorClass} ${hiddenClass}">${stripSkipMarkersFromText(item.text || '')}</span>
                            </div>
                            
                            <!-- Bottom Spacer for Balance -->
                            <div class="card-bottom-area"></div>
                        </div>
                    `;
                }
            }

            btnPrev.disabled = pronunciationGameActive || (ipaOrderMode === 'shuffle' ? randomCursor === 0 : index === 0);
            btnNext.disabled = pronunciationGameActive || (ipaOrderMode === 'shuffle'
                ? randomCursor >= randomHistory.length - 1 && randomRemaining.length === 0
                : index === lessonData.length - 1);

            if (isEnded) iconPlay.className = `fa-solid ${getDmuIconClass('replay')}`;
            else iconPlay.className = `fa-solid ${isPlaying ? getDmuIconClass('pause') : getDmuIconClass('play')}`;

            updateMicStatus();
            updateTimerDisplay(); // Cập nhật UI timer mỗi lần render

            const navStat = document.getElementById('nav-status');
            if (navStat) {
                navStat.textContent = ipaOrderMode === 'shuffle'
                    ? `${randomCursor + 1} / ${lessonData.length}`
                    : `${index + 1} / ${lessonData.length}`;
            }

            const slideNavText = document.getElementById('slide-nav-text');
            if (slideNavText) {
                slideNavText.textContent = ipaOrderMode === 'shuffle'
                    ? `Đã học ${randomCursor + 1}/${lessonData.length}`
                    : `Slide ${index + 1}/${lessonData.length}`;
            }

            if (isFocusModeSupported() && document.body.classList.contains('focus-mode')) {
                // [DUKE] Double-rAF ensures browser has fully painted the new card
                // before measuring dimensions for zoom calculation
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        ensureFocusZoomFitsCurrentSlide();
                    });
                });
            }
        }

        function initTimer() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            if (timerInterval) clearInterval(timerInterval);
            setVisible(timerDisplay, true);
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                // CHỈ đếm ngược khi: đang chạy AND không tạm dừng AND còn thời gian
                if (isTimerRunning && !isTimerPaused && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft <= 0 && isTimerRunning) {
                    clearInterval(timerInterval);
                    finishGameGlobal(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.innerText = `⏰ ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

            if (isTimerPaused || !isTimerRunning) timerDisplay.classList.add('paused');
            else timerDisplay.classList.remove('paused');

            if (timeLeft < 30) timerDisplay.classList.add('low-time');
            else timerDisplay.classList.remove('low-time');
        }

        function toggleGameMode(forceState) {
            hardStopAudio();
            autoPlayMode = false;
            isPlaying = false;
            isGameMode = typeof forceState === 'boolean' ? forceState : !isGameMode;
            updateGameModeToggleUI();

            if (isGameMode) {
                if (btnGame) btnGame.classList.add('active');
                if (btnSub) btnSub.disabled = true;
                btnAuto.disabled = true;
                btnAuto.classList.add('disabled');

                if (!hasGameStarted) {
                    maxGlobalHearts = lessonData.length * 5;
                    globalHearts = maxGlobalHearts;
                    totalReplays = 0;
                    timeLeft = lessonData.length * CONST_TIME_PER_SENTENCE;
                    isGameFinished = false;
                    hasGameStarted = true;

                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    isTimerRunning = false; // Bắt đầu game chưa chạy ngay, đợi bấm nghe
                    initTimer();
                } else {
                    isTimerPaused = false;
                    // Quay lại game mode, timer vẫn pause cho đến khi user tương tác lại
                    isTimerRunning = false;
                    initTimer();
                }

            } else {
                if (btnGame) btnGame.classList.remove('active');
                if (btnSub) btnSub.disabled = false;
                btnAuto.disabled = false;
                btnAuto.classList.remove('disabled');

                if (timerInterval) clearInterval(timerInterval);
                isTimerPaused = true;
                isTimerRunning = false;
                setVisible(timerDisplay, false);
            }
            renderCard(currentIndex);
        }

        function initGameDataForIndex(idx) {
            if (GAME_SESSION[idx]) return;

            const item = lessonData[idx];
            const sentence = item.title || item.text;
            const targetWordsOriginal = sentence.trim().split(/\s+/);

            let bankItems = targetWordsOriginal.map(w => ({
                original: w,
                display: normalizeWord(w),
                id: `w-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                used: false
            }));

            const distractorCount = targetWordsOriginal.length;
            for (let i = 0; i < distractorCount; i++) {
                const randomWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                bankItems.push({
                    original: randomWord,
                    display: normalizeWord(randomWord),
                    id: `d-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                    used: false
                });
            }
            bankItems.sort(() => Math.random() - 0.5);

            GAME_SESSION[idx] = {
                targetWords: targetWordsOriginal,
                slotsState: new Array(targetWordsOriginal.length).fill(null),
                bank: bankItems,
                listenCount: 0,
                mistakes: 0,
                maxMistakes: 5,
                isLocked: false,
                isFinished: false,
                hasStarted: false,
                hasEarnedHeart: false,
                attemptCount: 0,
                attemptsHistory: []
            };
        }

        function renderGameInterface(idx) {
            const data = GAME_SESSION[idx];
            if (!data) return;

            const item = lessonData[idx];

            let slotsHTML = '';
            data.targetWords.forEach((word, i) => {
                const filledWord = data.slotsState[i];
                if (filledWord) {
                    slotsHTML += `<div class="slot filled" id="slot-${idx}-${i}">${filledWord}</div>`;
                } else {
                    slotsHTML += `<div class="slot" id="slot-${idx}-${i}">___</div>`;
                }
            });
            let livesHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;

            const shouldLockBank = data.isLocked || data.isFinished || !data.hasStarted;
            const lockedClass = shouldLockBank ? 'locked' : '';
            const blindClass = (!data.hasStarted && !data.isLocked && !data.isFinished) ? 'blind' : '';
            const activeClass = isPlaying ? 'active' : '';

            let bankHTML = '';
            data.bank.forEach((item) => {
                const usedClass = item.used ? 'used' : '';
                bankHTML += `<div class="word-chip ${usedClass}" id="${item.id}" data-chip-id="${item.id}" data-word="${escapeHtml(item.display)}">${escapeHtml(item.display)}</div>`;
            });

            let statusMsg = '';
            if (data.isLocked) statusMsg = `<div class="game-status-msg msg-locked"><i class="fa-solid fa-lock"></i> Câu này đã bị khóa</div>`;
            else if (data.isFinished) statusMsg = `<div class="game-status-msg msg-win"><i class="fa-solid fa-check-circle"></i> Hoàn thành!</div>`;


            displayArea.innerHTML = `
                <div class="flashcard ${activeClass}">
                    <div class="lives-area">${livesHTML}</div>
                    


                    <div class="sentence-slots">${slotsHTML}</div>
                    <div class="word-bank ${lockedClass} ${blindClass}">${bankHTML}</div>
                    ${statusMsg}
                </div>
            `;
        }

        function handleGameClick(chipId, clickedDisplayWord) {
            if (isProcessing) return;

            const data = GAME_SESSION[currentIndex];
            if (!data || data.isLocked || data.isFinished || !data.hasStarted) return;

            isProcessing = true;

            let foundSlotIndex = -1;
            for (let i = 0; i < data.targetWords.length; i++) {
                if (isMatch(data.targetWords[i], clickedDisplayWord) && data.slotsState[i] === null) {
                    foundSlotIndex = i;
                    break;
                }
            }

            const chipEl = document.getElementById(chipId);

            if (foundSlotIndex !== -1) {
                const targetSlotId = `slot-${currentIndex}-${foundSlotIndex}`;
                const targetSlotEl = document.getElementById(targetSlotId);

                flyEffect(chipEl, targetSlotEl, () => {
                    data.slotsState[foundSlotIndex] = data.targetWords[foundSlotIndex];
                    const bankItem = data.bank.find(b => b.id === chipId);
                    if (bankItem) bankItem.used = true;

                    // [DUKE UPDATE] Logic khi hoàn thành câu
                    if (!data.slotsState.includes(null)) {
                        data.isFinished = true;
                        isTimerRunning = false; // Ngừng timer ngay lập tức khi xong câu
                        updateTimerDisplay();   // Cập nhật UI ngay
                        checkGameGlobalFinish();
                        updateMicStatus();
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                });

            } else {
                chipEl.classList.add('wrong');
                setTimeout(() => {
                    chipEl.classList.remove('wrong');
                    showDamageEffect();
                    if (globalHearts > 0) globalHearts--;
                    data.mistakes++;
                    if (globalHearts <= 0) {
                        finishGameGlobal(false);
                    } else if (data.mistakes >= 5) {
                        data.isLocked = true;
                        isTimerRunning = false; // Khóa câu cũng dừng timer
                        updateTimerDisplay();
                        // checkGameGlobalFinish(); 
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                }, 500);
            }
        }

        function showDamageEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.innerText = "-1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        function flyEffect(sourceEl, targetEl, onComplete) {
            const srcRect = sourceEl.getBoundingClientRect();
            const tgtRect = targetEl.getBoundingClientRect();
            const clone = sourceEl.cloneNode(true);
            clone.className = 'flying-chip';
            setRuntimeStyles(clone, {
                width: srcRect.width + 'px',
                height: srcRect.height + 'px',
                top: srcRect.top + 'px',
                left: srcRect.left + 'px',
                margin: 0
            });
            document.body.appendChild(clone);
            setRuntimeStyle(sourceEl, 'opacity', '0');
            requestAnimationFrame(() => {
                setRuntimeStyles(clone, {
                    top: tgtRect.top + 'px',
                    left: tgtRect.left + 'px'
                });
            });
            setTimeout(() => {
                clone.remove();
                if (onComplete) onComplete();
            }, 500);
        }

        function checkGameGlobalFinish() {
            let allDone = true;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i] || (!GAME_SESSION[i].isFinished && !GAME_SESSION[i].isLocked)) {
                    allDone = false;
                    break;
                }
            }
            if (allDone) finishGameGlobal(true);
        }

        function finishGameGlobal(isWin) {
            if (isGameFinished) return;
            isGameFinished = true;
            if (timerInterval) clearInterval(timerInterval);

            let penaltyHearts = 0;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i]) initGameDataForIndex(i);
                const d = GAME_SESSION[i];
                if (!d.isFinished && !d.isLocked) {
                    const remaining = d.maxMistakes - d.mistakes;
                    if (remaining > 0) penaltyHearts += remaining;
                    d.isLocked = true;
                }
            }

            globalHearts = Math.max(0, globalHearts - penaltyHearts);
            document.getElementById('final-hearts').innerText = `${globalHearts}/${maxGlobalHearts}`;
            document.getElementById('final-replays').innerText = totalReplays;

            let msg = "";
            if (isWin && globalHearts > 0) {
                if (globalHearts === maxGlobalHearts) msg = "Xuất sắc! Bạn là thiên tài!";
                else if (globalHearts > maxGlobalHearts * 0.8) msg = "Giỏi quá! Cố gắng giữ phong độ nhé!";
                else msg = "Cố gắng hơn ở lần sau nhé!";
            } else {
                if (globalHearts <= 0) msg = "Tiếc quá! Bạn đã hết tim rồi.";
                else msg = "Hết giờ rồi! Cố lên nhé!";
            }

            renderCard(currentIndex);
            document.getElementById('score-message').innerText = msg;
            setTimeout(() => {
                setVisible(scoreModal, true);
                if (isWin && globalHearts > 0) confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            }, 1000);
        }

        function handlePlayClick() {
            if (isPlaying) {
                hardStopAudio();
                autoPlayMode = false;

                // Nếu đang nghe mà bấm dừng thủ công trong Game Mode
                // Timer phải CHẠY LẠI nếu câu chưa xong
                if (isGameMode) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && data.hasStarted && !data.isFinished && !data.isLocked) {
                        isTimerRunning = true;
                    }
                }

                renderCard(currentIndex);
                return;
            }

            if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
            const data = GAME_SESSION[currentIndex];

            if (!isGameMode || data.isFinished || data.isLocked) {
                playCurrentSentence();
                return;
            }

            if (!data.hasStarted) {
                data.hasStarted = true;
            }

            if (data.listenCount === 0) {
                data.listenCount++;
                playCurrentSentence();
            } else {
                const isMaxListensReached = data.listenCount >= 5;
                if (!isMaxListensReached && globalHearts > 1) {
                    globalHearts--;
                    totalReplays++;
                    data.listenCount++;
                    playCurrentSentence(true);
                }
            }
        }

        function refereeReplay() {
            if (!GAME_SESSION[currentIndex]) return;
            const data = GAME_SESSION[currentIndex];
            if (!data.hasStarted) {
                data.hasStarted = true;
                if (data.listenCount === 0) data.listenCount = 1;
            }
            playCurrentSentence(false);
            renderCard(currentIndex);
        }

        function playSpeechFallback(text, isPaid) {
            if (!('speechSynthesis' in window) || !text) {
                setTimeout(onFinishSentence, 1200);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            currentUtterance = utterance;
            utterance.lang = 'en-US';
            utterance.rate = 0.92;
            utterance.pitch = 1;
            utterance.volume = 1;

            const englishVoice = window.speechSynthesis.getVoices().find(voice => /^en(-|_)/i.test(voice.lang));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            currentAudio.isPaidListen = isPaid;
            utterance.onend = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                onFinishSentence();
            };
            utterance.onerror = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                isPlaying = false;
                iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                setTimeout(onFinishSentence, 400);
            };

            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } catch (error) {
                currentUtterance = null;
                setTimeout(onFinishSentence, 1200);
            }
        }

        // =========================================================
        // AUDIO & HARDWARE WARM-UP LOGIC
        // =========================================================
        function playCurrentSentence(isPaid = false) {
            hardStopAudio();

            // [DUKE UPDATE] Luôn tạm dừng timer khi bắt đầu nghe
            if (isGameMode) {
                isTimerRunning = false;
                updateTimerDisplay();
            }

            const audioSrc = lessonData[currentIndex].audio;
            if (!audioSrc || audioSrc.length < 50) {
                playSpeechFallback(lessonData[currentIndex].title || lessonData[currentIndex].text || '', isPaid);
                return;
            }

            currentAudio.src = audioSrc;
            currentAudio.isPaidListen = isPaid;
            currentAudio.onended = onFinishSentence;

            isPlaying = true;
            isEnded = false;
            iconPlay.className = `fa-solid ${getDmuIconClass('pause')}`;

            currentAudio.play().catch(() => {
                isPlaying = false;
                iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                if (isGameMode && GAME_SESSION[currentIndex] && !GAME_SESSION[currentIndex].isFinished) isTimerRunning = true;
            });
        }

        function onFinishSentence() {
            // [DUKE UPDATE] Logic: Nghe xong MỚI chạy timer
            if (isGameMode && GAME_SESSION[currentIndex]) {
                const d = GAME_SESSION[currentIndex];
                // Chỉ chạy lại timer nếu: Đã bắt đầu + Chưa xong + Chưa khóa
                if (d.hasStarted && !d.isFinished && !d.isLocked) {
                    isTimerRunning = true;
                }
            }

            if (isGameMode && GAME_SESSION[currentIndex] && GAME_SESSION[currentIndex].listenCount === 1) {
                renderCard(currentIndex);
            }
            if (isGameMode && currentAudio.isPaidListen) {
                const badge = document.createElement('div');
                badge.className = 'cost-badge';
                badge.innerHTML = '-1 ❤️';
                btnPlay.appendChild(badge);
                setTimeout(() => { renderCard(currentIndex); }, 1000);
            }
            if (autoPlayMode) {
                if (advanceStudyIndex()) {
                    if (isGameMode && !GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    if (isGameMode) {
                        const d = GAME_SESSION[currentIndex];
                        if (d.listenCount === 0) d.listenCount++;
                        d.hasStarted = true;
                        // Auto play thì timer cứ chạy theo logic play/pause
                    }
                    renderCard(currentIndex);
                    const delay = (document.body.getAttribute('data-mode') === 'ipa') ? 950 : 600;
                    setTimeout(() => playCurrentSentence(), delay);
                } else {
                    hardStopAudio();
                    isEnded = true;
                    isPlaying = false;
                    renderCard(currentIndex);
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: getConfettiColors() });
                }
            } else {
                isPlaying = false;
                if (!isGameMode || !currentAudio.isPaidListen) renderCard(currentIndex);
            }
        }

        function playAuto() {
            if (ipaTimeLimit > 0) {
                startPronunciationGame();
                return;
            }
            if (isPlaying && autoPlayMode) {
                hardStopAudio();
                renderCard(currentIndex);
                return;
            }
            if (isEnded) {
                currentIndex = 0;
                resetRandomNavigation(currentIndex);
                isEnded = false;
            }
            autoPlayMode = true;
            playCurrentSentence();
        }

        function goNext() {
            if (!pronunciationGameActive && advanceStudyIndex()) {
                hardStopAudio(); autoPlayMode = false; isEnded = false;
                cancelPronunciationCountdown();
                if (isGameMode) {
                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

                    // [DUKE UPDATE] Qua câu mới -> Dừng Timer ngay lập tức
                    // Timer sẽ chỉ chạy lại khi hàm onFinishSentence được gọi (sau khi nghe xong)
                    isTimerRunning = false;
                    updateTimerDisplay();
                }
                renderCard(currentIndex);
            }
        }

        function goPrev() {
            if (!pronunciationGameActive && retreatStudyIndex()) {
                hardStopAudio(); autoPlayMode = false; isEnded = false;
                cancelPronunciationCountdown();
                if (isGameMode) {
                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

                    // [DUKE UPDATE] Tương tự goNext, qua câu cũ cũng dừng timer chờ nghe lại
                    isTimerRunning = false;
                    updateTimerDisplay();
                }
                renderCard(currentIndex);
            }
        }

        function startPronunciationGame() {
            if (!recognition) {
                reportRuntimeIssue('Pronunciation game unavailable', 'SpeechRecognition is not supported.');
                return;
            }
            hardStopAudio();
            cancelPronunciationCountdown();
            autoPlayMode = false;
            pronunciationGameActive = true;
            pronunciationGameFinished = false;
            pronunciationHearts = 0;
            pronunciationCompleted = new Set();
            document.body.classList.remove('pronunciation-results');
            setVisible(scoreModal, false);
            updateStudyControls();

            lessonData.forEach((_, index) => {
                if (!GAME_SESSION[index]) initGameDataForIndex(index);
                GAME_SESSION[index].attemptCount = 0;
                GAME_SESSION[index].attemptsHistory = [];
                GAME_SESSION[index].hasEarnedHeart = false;
            });

            if (ipaOrderMode === 'shuffle') {
                randomRemaining = shuffledIndices();
                currentIndex = randomRemaining.pop();
                randomHistory = [currentIndex];
                randomCursor = 0;
            } else {
                currentIndex = 0;
                resetRandomNavigation(currentIndex);
            }

            updatePronunciationHearts();
            renderCard(currentIndex);
            setTimeout(startMicRecognition, 420);
        }

        function finishPronunciationGame(message) {
            if (pronunciationGameFinished) return;
            pronunciationGameActive = false;
            pronunciationGameFinished = true;
            completePronunciationCountdown();
            try {
                if (recognition && btnMic.classList.contains('listening')) recognition.stop();
            } catch (error) {
                reportRuntimeIssue('Mic finish stop error', error);
            }
            document.body.classList.add('pronunciation-results');
            updateStudyControls();

        function handlePronunciationGameResult(isPass, accuracy) {
            if (!pronunciationGameActive || pronunciationGameFinished) return;
            const data = GAME_SESSION[currentIndex];

                renderCard(currentIndex);
                setTimeout(startMicRecognition, 520);

        function applyFocusZoomScale(scale) {
            const isFocus = document.body.classList.contains('focus-mode');
            const card = document.querySelector('.flashcard');
            if (!card) return;

            focusZoomScale = Math.min(2.5, Math.max(1.0, Math.round(scale * 100) / 100));
            setRuntimeCssVariable(card, '--focus-zoom', focusZoomScale);

            if (!isFocus || focusZoomScale <= 1.001) {
                setRuntimeStyle(card, 'zoom', '');

            setRuntimeStyle(card, 'zoom', String(focusZoomScale));

        function doesFocusZoomFit(scale) {
            if (!document.body.classList.contains('focus-mode')) return false;
            const card = document.querySelector('.flashcard');
            if (!card || !displayArea) return false;

            const originalZoom = getRuntimeStyle(card, 'zoom');
            setRuntimeStyle(card, 'zoom', String(Math.round(scale * 100) / 100));

            const areaRect = displayArea.getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();

            // 1. Kiểm tra tràn vùng hiển thị
            if (cardRect.width > areaRect.width + 1 || cardRect.height > areaRect.height + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            // 2. Kiểm tra tràn nội dung (scrollbar)
            if (card.scrollHeight > card.offsetHeight + 1 || card.scrollWidth > card.offsetWidth + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            setRuntimeStyle(card, 'zoom', originalZoom);
            return true;
        }

        function ensureFocusZoomFitsCurrentSlide() {
            if (!document.body.classList.contains('focus-mode')) {

            if (!focusAutoFitEnabled) {
                applyFocusZoomScale(1.0);
                return;
            }

            let scale = 1.0;
            let lastFitScale = 1.0;
            while (scale <= 2.5) {
                if (doesFocusZoomFit(scale)) {
                    lastFitScale = scale;
                    scale = Math.round((scale + 0.05) * 100) / 100;
                } else {
                    break;
                }
            }
            applyFocusZoomScale(lastFitScale);
