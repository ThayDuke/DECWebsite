        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background-color: var(--bg-color);
            background-image: var(--shell-background-image);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: var(--lesson-page-align-y);
            overflow-x: hidden;
        }

        /* BUBBLES */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: var(--ulti-rgba-255-255-255-05);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {

            padding-top: 15px;
            border-top: none;
            position: relative;
            width: 100%;
            min-height: 80px;
        }

        .control-left,
        .control-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .control-left {
            justify-content: flex-start;
        }

        .control-right {
            justify-content: flex-end;
        }

        .control-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 0 0 auto;
        }

        .btn-control {
            border: calc(var(--accent-height) / 6) solid var(--color-transparent);
            box-sizing: border-box;
            cursor: pointer;
            color: var(--color-on-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            box-shadow:var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-clip: border-box;
            background-origin: border-box;
            transition: background 0.2s, background-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s, filter 0.2s, opacity 0.2s;
        }

        .btn-control:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-sm {
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            font-size: 20px;
        }

        .btn-game {
            background-color: var(--game-purple);
        }

        .btn-game:hover {
            filter: brightness(1.1);
        }

        .btn-game.active {
            background-color: var(--ulti-hex-8e24aa);
            border: 2px solid var(--ulti-hex-fff);
            box-shadow: 0 0 10px var(--game-purple);
        }

        .btn-sub {
            background-color: var(--ulti-hex-ec407a);
        }

        .btn-sub:hover {
            filter: brightness(1.1);
        }

        .btn-sub.off {
            background-color: var(--ulti-hex-90a4ae);
        }

        .btn-sub:not(.off) {
            background-color: var(--primary-pink);
        }

        .btn-sub:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-nav {
            background-image: var(--btn-secondary-bg);
            color: var(--color-on-accent);
        }

        .btn-nav:hover {
            filter: brightness(1.04);
        }

        .btn-nav:disabled {
            opacity: 0.46;
            color: var(--ulti-hex-aaa);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-play {
            width: var(--control-play-width);
            height: var(--control-play-width);
            border-radius: 50%;
            background-image: var(--btn-primary-bg);
            font-size: 32px;
            box-shadow:var(--toggle-knob-shadow);
            margin: 0 10px;
            position: relative;
            left: auto;
            top: auto;
            transform: none;
            z-index: 5;
        }

        .btn-play:hover {
            transform: scale(1.05);
        }

        .btn-play:disabled,
        .btn-play.disabled {
            opacity: 0.46;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-auto {
            background-image: var(--btn-primary-bg);
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            font-size: 20px;
        }

        .btn-auto:hover {
            filter: brightness(1.1);
        }

        .btn-auto:disabled,
        .btn-auto.disabled {
            opacity: 0.46;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-mic {
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            background-image: var(--btn-secondary-bg);
            font-size: 20px;
        }

        .btn-mic:hover {
            transform: scale(1.1);
        }

        .btn-mic:disabled {
            opacity: 0.46;
            cursor: not-allowed;
            animation: none;
        }

        .btn-mic.listening {
            background: var(--ulti-hex-ef5350);
            animation: pulse-mic-glow 1.2s infinite ease-in-out;
        }

        .btn-mic.is-shaking {
            animation: shake var(--motion-shake-duration);
        }

        @keyframes pulse-mic-glow {
            0% {
                box-shadow: 0 0 12px #ef5350, 0 0 24px #ff1744, 0 0 36px rgba(239, 83, 80, 0.8), inset 0 0 8px #ffffff;
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 24px #ef5350, 0 0 48px #ff1744, 0 0 72px rgba(239, 83, 80, 0.95), inset 0 0 14px #ffffff;
                transform: scale(1.08);
            }

            100% {
                box-shadow: 0 0 12px #ef5350, 0 0 24px #ff1744, 0 0 36px rgba(239, 83, 80, 0.8), inset 0 0 8px #ffffff;
                transform: scale(1);
            }
        }

        .cost-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger-red);
            color: var(--color-on-accent);
            font-size: 12px;
            font-weight: var(--font-weight-strong);
            padding: 3px 8px;
            border-radius: 10px;
            border: 2px solid var(--surface-solid);
            box-shadow: 0 2px 5px var(--ulti-rgba-0-0-0-02);
            animation: popUpFade 2s forwards;
            z-index: 20;
        }

        .damage-badge {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--danger-red);
            font-weight: var(--font-weight-strong);
            font-size: 18px;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }

        @keyframes popUpFade {
            0% {
                transform: scale(0) translateY(0);
                opacity: 0;
            }

            20% {
                transform: scale(1.2) translateY(-10px);
                opacity: 1;
            }

            80% {
                transform: scale(1) translateY(-20px);
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(-30px);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-30px);
                opacity: 0;
            }
        }

        .speech-feedback-box {
            margin-top: auto;
            margin-bottom: 0;
            padding: 15px;
            background: var(--ulti-hex-fff);
            border-radius: 15px;
            border: 2px solid var(--ulti-hex-ccc);
            width: 100%;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
            box-sizing: border-box;
            max-height: 100%;
            overflow-y: auto;
            align-self: stretch;
            flex-shrink: 1;
        }

        .speech-feedback-box.is-visible {
            display: block;
        }

        .speech-score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .score-perfect {
            background: var(--success-green);
            box-shadow: 0 4px 10px var(--ulti-rgba-46-125-50-03);
        }

        .score-good {
            background: var(--orange-btn);
        }

        .score-bad {
            background: var(--danger-red);
        }

        .speech-detail {
            font-size: 1.5em;
            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        }

        .speech-detail.compact {
            margin-top: 8px;
            color: var(--ulti-hex-555);
            font-size: 1em;
        }

        .w-correct {
            color: var(--success-green);
            font-weight: var(--font-weight-strong);
        }

        .w-close {
            color: var(--orange-btn);
            font-weight: var(--font-weight-strong);
        }

        .w-wrong {
            color: var(--danger-red);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .w-skip {
            color: var(--ulti-rgba-46-125-50-078);
            font-weight: var(--font-weight-strong);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ulti-rgba-0-0-0-06);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .score-title {
            font-size: 2em;
            color: var(--game-purple);
            margin-bottom: 20px;
            font-weight: var(--font-weight-strong);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid var(--ulti-hex-eee);
            padding-bottom: 5px;
        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

        .btn-restart {
            background: var(--btn-primary-bg);
            color: var(--color-on-accent);
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin: var(--lesson-theme-row-margin);
        }

        body[data-mode="ipa"] .theme-row {
            justify-content: flex-end;
            margin: 0;
        }

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .theme-toggle-switch:not(.switch-mode) input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
            color: var(--toggle-text-checked-color);
        }

        .switch-mode.theme-toggle-switch input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
        }

        .theme-toggle-switch input:checked+.slider:before {
            transform: translateX(var(--toggle-shift));
        }

        body[data-theme="elegant"] .theme-toggle-switch .slider {
            background: var(--toggle-slider-bg);
            box-shadow: var(--toggle-slider-shadow);
        }

        body[data-theme="elegant"] .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
        }

        /* ==========================================
           STYLE ĐỀN BÙ CHO NÚT HIỆN/GAME (.switch-mode)
           ========================================== */
        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-24-169-162-008);
            border-color:var(--ulti-rgba-25-167-160-02);
            box-shadow:var(--toggle-slider-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-bg);
            border-color:var(--toggle-slider-border);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-120-144-156-03);
            border-color:var(--ulti-rgba-120-144-156-03);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-checked-bg);
            border-color:var(--toggle-slider-checked-border);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            background-image: var(--btn-secondary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            background-image: var(--btn-primary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider-text {
            color:var(--text-color);
            font-weight:var(--font-weight-extra);
            text-shadow:var(--color-transparent, transparent);
        }

        /* --- 2026 Unified Pro Theme Override (Elegant / E) --- */
        body[data-theme="elegant"] {
            --primary-pink: var(--ulti-hex-e65d6f);
            --bg-blue: var(--ulti-hex-0b0f1a);

                "she's": "she is",
                "it's": "it is",
                "we're": "we are",

                "weren't": "were not",
                "shouldn't": "should not",
                "wouldn't": "would not",
                "couldn't": "could not"

        function collapseNumericalTokens(tokens) {
            const canonicalList = [];

                let currentVal = 0;
                let totalVal = 0;

                let j = i;

                while (j < n) {
                    let w = tokens[j].toLowerCase();

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;
                            if (val === 100) currentVal *= 100;

            const base = normalizeTranscriptForPhraseMatch(variant);
            if (!base) return false;

            // 1) bỏ hẳn apostrophe: "there's" -> "theres"
            // 2) thay apostrophe thành khoảng trắng: "there's" -> "there s"
            if (base.includes("'")) {

                candidates.add(base.slice(0, -1) + " " + base.slice(-1));

                n.split(/\s+/).forEach(x => {

                    let match = true;
                    for (let j = 0; j < phrase.length; j++) {
                        if (flat[i + j].word !== phrase[j]) { match = false; break; }
                    }
                    if (match) {
                        for (let j = 0; j < phrase.length; j++) {
                            tokens[flat[i + j].tIdx].skip = true;
                        }
                    }
                }
            });
        }

        const DUKE_IMPORTANT_WORDS = new Set([
            // Optional manual override for important keywords
        ]);

        function isAutoImportantWord(part) {
            if (!part) return false;
            if (DUKE_ALWAYS_SKIP_WORDS.has(part)) return false;
            if (DUKE_SKIP_WORDS.has(part)) return false;
            if (!/^[a-z]+$/i.test(part)) return false;
            if (part.length <= 4) return false;
            return true;
        }

        function classifyToken(token) {
            // 1. Kiểm tra NON-ASCII (Tiếng Việt có dấu, ký tự lạ...) -> Skip
            if (containsNonASCII(token.raw)) {
                token.skip = true; return;
            }
            // 2. Tra từ điển Skip tuyệt đối (A & B)
            for (const part of token.cleanParts) {
                if (DUKE_ALWAYS_SKIP_WORDS.has(part) || DUKE_SKIP_WORDS.has(part)) {
                    token.skip = true; return;
                }
            }
            // 3. Tra từ điển Forgive (D - Soft bypass)
            for (const part of token.cleanParts) {
                if (DUKE_FORGIVE_WORDS.has(part)) {
                    token.forgive = true; return;
                }
            }
            // 4. Kiểm tra Contraction (đã cấu hình tha thứ)
            if (token.contractionKey && DUKE_FORGIVE_CONTRACTION_KEYS.has(token.contractionKey)) {
                token.skip = true; return;
            }
        }

        function calculateTokenWeight(token) {
            if (token.skip) return 0;
            const totalLen = token.cleanParts.join("").length;
            let weight = 1.0;
            if (totalLen <= 2) weight = 0.3;
            else if (totalLen <= 4) weight = 0.6;

            if (token.forgive) weight *= 0.35;

            // Auto-boost likely content words; manual set still overrides if provided
            let shouldBoost = false;
            if (!token.skip) {
                for (const part of token.cleanParts) {
                    if (DUKE_IMPORTANT_WORDS.has(part) || isAutoImportantWord(part)) {
                        shouldBoost = true;
                        break;
                    }
                }
                if (shouldBoost) {
                    weight *= 1.35;
                }
            }

            return weight;
        }

        function buildTargetTokens(originalText) {
            const rawWords = (originalText || "").trim().split(/\s+/).filter(w => w.length > 0);
            const tokens = [];
            let inBlock = false;

            rawWords.forEach(raw => {
                const hasStart = /[{[]/.test(raw);
                const hasEnd = /[}\]]/.test(raw);
                if (hasStart) inBlock = true;

                const display = stripSkipMarkersFromText(raw);
                const cleanParts = normalizeWord(raw).split(/\s+/).filter(Boolean);
                const cKey = contractionKeyFromRaw(raw);

                const token = {
                    raw,
                    display,
                    cleanParts,
                    contractionKey: cKey,
                    skip: inBlock || hasStart || hasEnd,
                    forgive: false,
                    weight: 0
                };

                classifyToken(token);
                token.weight = calculateTokenWeight(token);
                tokens.push(token);

                if (hasEnd) inBlock = false;
            });

            applySkipPhrases(tokens);
            tokens.forEach(t => {
                if (t.skip) t.weight = 0;
                else t.weight = calculateTokenWeight(t);
            });

            return tokens;
        }

        // Lightweight phoneme-aware normalization for similarity scoring
        function normalizeForSimilarity(word) {
            if (!word) return "";
            let w = String(word).toLowerCase().trim();

            // Handle IPA symbols and long vowels
            w = w.replace(/[ː:]/g, ""); // Remove length markers
            w = w.replace(/[æɑ]/g, "a");
            w = w.replace(/[ɔɒ]/g, "o");
            w = w.replace(/[ʊu]/g, "u");
            w = w.replace(/[ɪi]/g, "i");
            w = w.replace(/[ɛe]/g, "e");
            w = w.replace(/[ʌə]/g, "a");
            w = w.replace(/[ʃ]/g, "sh");
            w = w.replace(/[Ê']/g, "zh");
            w = w.replace(/[θ]/g, "th");
            w = w.replace(/[ð]/g, "th");
            w = w.replace(/[ŋ]/g, "ng");

            w = w.replace(/ph/g, "f");
            w = w.replace(/ck/g, "k");
            w = w.replace(/q/g, "k");
            w = w.replace(/x/g, "ks");
            w = w.replace(/wh/g, "w");
            w = w.replace(/ght/g, "t");
            w = w.replace(/kn/g, "n");
            w = w.replace(/wr/g, "r");
            w = w.replace(/mb$/g, "m");
            w = w.replace(/dg(e|i|y)/g, "j$1");
            w = w.replace(/tion/g, "shun");
            w = w.replace(/sion/g, "zhun");
            w = w.replace(/oo/g, "u");
            w = w.replace(/ee/g, "i");
            w = w.replace(/ea/g, "i");
            w = w.replace(/ou/g, "au");

            // Final consonant softening for stability
            w = w.replace(/z$/g, "s");
            w = w.replace(/d$/g, "t");

            return w;
        }

        // [DUKE] Smart Levenshtein Comparison for IPA/Pronunciation
        function getLevenshteinDistance(s1, s2) {
            const m = s1.length, n = s2.length;
            if (m === 0) return n; if (n === 0) return m;
            const d = Array.from({ length: m + 1 }, () => new Uint8Array(n + 1));
            for (let i = 0; i <= m; i++) d[i][0] = i;
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let j = 1; j <= n; j++) {
                for (let i = 1; i <= m; i++) {
                    const cost = (s1[i - 1] === s2[j - 1]) ? 0 : 1;
                    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                }
            }
            return d[m][n];
        }

        function getCharSimilarity(s1, s2) {
            if (!s1 || !s2) return (s1 === s2) ? 1.0 : 0.0;

            const n1 = normalizeForSimilarity(s1);
            const n2 = normalizeForSimilarity(s2);
            if (n1 === n2) return 1.0;

            const dist = getLevenshteinDistance(n1, n2);
            const maxLen = Math.max(n1.length, n2.length);
            return 1.0 - (dist / maxLen);
        }

        function lcsMatchIndices(a, b) {
            // Fuzzy LCS: returns array of { tIdx, sIdx, similarity }
            const n = a.length;
            const m = b.length;
            const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const sim = getCharSimilarity(a[i - 1], b[j - 1]);
                    if (sim >= 0.6) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            const matches = [];
            let i = n, j = m;
            while (i > 0 && j > 0) {
                const sim = getCharSimilarity(a[i - 1], b[j - 1]);
                if (sim >= 0.6 && dp[i][j] > Math.max(dp[i - 1][j], dp[i][j - 1])) {
                    matches.push({ tIdx: i - 1, sIdx: j - 1, similarity: sim });
                    i--; j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }
            return matches;
        }

        function initTimer() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            if (timerInterval) clearInterval(timerInterval);
            setVisible(timerDisplay, true);
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                // CHỈ đếm ngược khi: đang chạy AND không tạm dừng AND còn thời gian
                if (isTimerRunning && !isTimerPaused && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft <= 0 && isTimerRunning) {
                    clearInterval(timerInterval);
                    finishGameGlobal(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.innerText = `⏰ ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

            if (isTimerPaused || !isTimerRunning) timerDisplay.classList.add('paused');
            else timerDisplay.classList.remove('paused');

            if (timeLeft < 30) timerDisplay.classList.add('low-time');
            else timerDisplay.classList.remove('low-time');
        }

        function toggleGameMode(forceState) {
            hardStopAudio();
            autoPlayMode = false;
            isPlaying = false;
            isGameMode = typeof forceState === 'boolean' ? forceState : !isGameMode;
            updateGameModeToggleUI();

            if (isGameMode) {
                if (btnGame) btnGame.classList.add('active');
                if (btnSub) btnSub.disabled = true;
                btnAuto.disabled = true;
                btnAuto.classList.add('disabled');

                if (!hasGameStarted) {
                    maxGlobalHearts = lessonData.length * 5;
                    globalHearts = maxGlobalHearts;
                    totalReplays = 0;
                    timeLeft = lessonData.length * CONST_TIME_PER_SENTENCE;
                    isGameFinished = false;
                    hasGameStarted = true;

                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    isTimerRunning = false; // Bắt đầu game chưa chạy ngay, đợi bấm nghe
                    initTimer();
                } else {
                    isTimerPaused = false;
                    // Quay lại game mode, timer vẫn pause cho đến khi user tương tác lại
                    isTimerRunning = false;
                    initTimer();
                }

            } else {
                if (btnGame) btnGame.classList.remove('active');
                if (btnSub) btnSub.disabled = false;
                btnAuto.disabled = false;
                btnAuto.classList.remove('disabled');

                if (timerInterval) clearInterval(timerInterval);
                isTimerPaused = true;
                isTimerRunning = false;
                setVisible(timerDisplay, false);
            }
            renderCard(currentIndex);
        }

        function initGameDataForIndex(idx) {
            if (GAME_SESSION[idx]) return;

            const item = lessonData[idx];
            const sentence = item.title || item.text;
            const targetWordsOriginal = sentence.trim().split(/\s+/);

            let bankItems = targetWordsOriginal.map(w => ({
                original: w,
                display: normalizeWord(w),
                id: `w-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                used: false
            }));

            const distractorCount = targetWordsOriginal.length;
            for (let i = 0; i < distractorCount; i++) {
                const randomWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                bankItems.push({
                    original: randomWord,
                    display: normalizeWord(randomWord),
                    id: `d-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                    used: false
                });
            }
            bankItems.sort(() => Math.random() - 0.5);

            GAME_SESSION[idx] = {
                targetWords: targetWordsOriginal,
                slotsState: new Array(targetWordsOriginal.length).fill(null),
                bank: bankItems,
                listenCount: 0,
                mistakes: 0,
                maxMistakes: 5,
                isLocked: false,
                isFinished: false,
                hasStarted: false,
                hasEarnedHeart: false,
                attemptCount: 0,
                attemptsHistory: []
            };
        }

        function renderGameInterface(idx) {
            const data = GAME_SESSION[idx];
            if (!data) return;

            const item = lessonData[idx];

            let slotsHTML = '';
            data.targetWords.forEach((word, i) => {
                const filledWord = data.slotsState[i];
                if (filledWord) {
                    slotsHTML += `<div class="slot filled" id="slot-${idx}-${i}">${filledWord}</div>`;
                } else {
                    slotsHTML += `<div class="slot" id="slot-${idx}-${i}">___</div>`;
                }
            });
            let livesHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;

            const shouldLockBank = data.isLocked || data.isFinished || !data.hasStarted;
            const lockedClass = shouldLockBank ? 'locked' : '';
            const blindClass = (!data.hasStarted && !data.isLocked && !data.isFinished) ? 'blind' : '';
            const activeClass = isPlaying ? 'active' : '';

            let bankHTML = '';
            data.bank.forEach((item) => {
                const usedClass = item.used ? 'used' : '';
                bankHTML += `<div class="word-chip ${usedClass}" id="${item.id}" data-chip-id="${item.id}" data-word="${escapeHtml(item.display)}">${escapeHtml(item.display)}</div>`;
            });

            let statusMsg = '';
            if (data.isLocked) statusMsg = `<div class="game-status-msg msg-locked"><i class="fa-solid fa-lock"></i> Câu này đã bị khóa</div>`;
            else if (data.isFinished) statusMsg = `<div class="game-status-msg msg-win"><i class="fa-solid fa-check-circle"></i> Hoàn thành!</div>`;


            displayArea.innerHTML = `
                <div class="flashcard ${activeClass}">
                    <div class="lives-area">${livesHTML}</div>
                    


                    <div class="sentence-slots">${slotsHTML}</div>
                    <div class="word-bank ${lockedClass} ${blindClass}">${bankHTML}</div>
                    ${statusMsg}
                </div>
            `;
        }

        function handleGameClick(chipId, clickedDisplayWord) {
            if (isProcessing) return;

            const data = GAME_SESSION[currentIndex];
            if (!data || data.isLocked || data.isFinished || !data.hasStarted) return;

            isProcessing = true;

            let foundSlotIndex = -1;
            for (let i = 0; i < data.targetWords.length; i++) {
                if (isMatch(data.targetWords[i], clickedDisplayWord) && data.slotsState[i] === null) {
                    foundSlotIndex = i;
                    break;
                }
            }

            const chipEl = document.getElementById(chipId);

            if (foundSlotIndex !== -1) {
                const targetSlotId = `slot-${currentIndex}-${foundSlotIndex}`;
                const targetSlotEl = document.getElementById(targetSlotId);

                flyEffect(chipEl, targetSlotEl, () => {
                    data.slotsState[foundSlotIndex] = data.targetWords[foundSlotIndex];
                    const bankItem = data.bank.find(b => b.id === chipId);
                    if (bankItem) bankItem.used = true;

                    // [DUKE UPDATE] Logic khi hoàn thành câu
                    if (!data.slotsState.includes(null)) {
                        data.isFinished = true;
                        isTimerRunning = false; // Ngừng timer ngay lập tức khi xong câu
                        updateTimerDisplay();   // Cập nhật UI ngay
                        checkGameGlobalFinish();
                        updateMicStatus();
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                });

            } else {
                chipEl.classList.add('wrong');
                setTimeout(() => {
                    chipEl.classList.remove('wrong');
                    showDamageEffect();
                    if (globalHearts > 0) globalHearts--;
                    data.mistakes++;
                    if (globalHearts <= 0) {
                        finishGameGlobal(false);
                    } else if (data.mistakes >= 5) {
                        data.isLocked = true;
                        isTimerRunning = false; // Khóa câu cũng dừng timer
                        updateTimerDisplay();
                        // checkGameGlobalFinish(); 
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                }, 500);
            }
        }

        function showDamageEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.innerText = "-1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        function flyEffect(sourceEl, targetEl, onComplete) {
            const srcRect = sourceEl.getBoundingClientRect();
            const tgtRect = targetEl.getBoundingClientRect();
            const clone = sourceEl.cloneNode(true);
            clone.className = 'flying-chip';
            setRuntimeStyles(clone, {
                width: srcRect.width + 'px',
                height: srcRect.height + 'px',
                top: srcRect.top + 'px',
                left: srcRect.left + 'px',
                margin: 0
            });
            document.body.appendChild(clone);
            setRuntimeStyle(sourceEl, 'opacity', '0');
            requestAnimationFrame(() => {
                setRuntimeStyles(clone, {
                    top: tgtRect.top + 'px',
                    left: tgtRect.left + 'px'
                });
            });
            setTimeout(() => {
                clone.remove();
                if (onComplete) onComplete();
            }, 500);
        }

        function checkGameGlobalFinish() {
            let allDone = true;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i] || (!GAME_SESSION[i].isFinished && !GAME_SESSION[i].isLocked)) {
                    allDone = false;
                    break;
                }
            }
            if (allDone) finishGameGlobal(true);
        }

        function finishGameGlobal(isWin) {
            if (isGameFinished) return;
            isGameFinished = true;
            if (timerInterval) clearInterval(timerInterval);

            let penaltyHearts = 0;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i]) initGameDataForIndex(i);
                const d = GAME_SESSION[i];
                if (!d.isFinished && !d.isLocked) {
                    const remaining = d.maxMistakes - d.mistakes;
                    if (remaining > 0) penaltyHearts += remaining;
                    d.isLocked = true;
                }
            }

            globalHearts = Math.max(0, globalHearts - penaltyHearts);
            document.getElementById('final-hearts').innerText = `${globalHearts}/${maxGlobalHearts}`;
            document.getElementById('final-replays').innerText = totalReplays;

            let msg = "";
            if (isWin && globalHearts > 0) {
                if (globalHearts === maxGlobalHearts) msg = "Xuất sắc! Bạn là thiên tài!";
                else if (globalHearts > maxGlobalHearts * 0.8) msg = "Giỏi quá! Cố gắng giữ phong độ nhé!";
                else msg = "Cố gắng hơn ở lần sau nhé!";
            } else {
                if (globalHearts <= 0) msg = "Tiếc quá! Bạn đã hết tim rồi.";
                else msg = "Hết giờ rồi! Cố lên nhé!";
            }

            renderCard(currentIndex);
            document.getElementById('score-message').innerText = msg;
            setTimeout(() => {
                setVisible(scoreModal, true);
                if (isWin && globalHearts > 0) confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            }, 1000);
        }

                // Nếu đang nghe mà bấm dừng thủ công trong Game Mode
                // Timer phải CHẠY LẠI nếu câu chưa xong
                if (isGameMode) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && data.hasStarted && !data.isFinished && !data.isLocked) {

            if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

            if (!data.hasStarted) {
                data.hasStarted = true;

            if (data.listenCount === 0) {
                data.listenCount++;
                playCurrentSentence();

                const isMaxListensReached = data.listenCount >= 5;
                if (!isMaxListensReached && globalHearts > 1) {
                    globalHearts--;

        function playSpeechFallback(text, isPaid) {

            currentUtterance = utterance;

            utterance.pitch = 1;
            utterance.volume = 1;

            const englishVoice = window.speechSynthesis.getVoices().find(voice => /^en(-|_)/i.test(voice.lang));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            currentAudio.isPaidListen = isPaid;
            utterance.onend = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                onFinishSentence();

                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                isPlaying = false;
                iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                setTimeout(onFinishSentence, 400);
            };

            try {
                window.speechSynthesis.cancel();

        // =========================================================
        // SPEECH RECOGNITION FEATURE

        let recognition;

        let accumulatedTranscript = "";
        let accumulatedAlternatives = [];

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = true;
            const maxAlts = (typeof lessonLevel !== 'undefined' && lessonLevel === 'C') ? 5 : 3;
            recognition.maxAlternatives = maxAlts;

            const clearSilenceTimer = () => {
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
            };

            const resetSilenceTimer = () => {
                clearSilenceTimer();
                silenceTimer = setTimeout(() => {
                    if (btnMic.classList.contains('listening')) {

                    }

            recognition.onstart = () => {
                btnMic.classList.add('listening');
                hardStopAudio();
                accumulatedTranscript = "";
                accumulatedAlternatives = [];

                // Inject speech recognition hints if supported
                try {
                    if (LESSON_SCORING_PROFILES && LESSON_SCORING_PROFILES[currentIndex]) {
                        const prof = LESSON_SCORING_PROFILES[currentIndex];
                        if (prof && prof.recognitionHints && prof.recognitionHints.length > 0) {
                            const SpeechGrammarList = window.SpeechGrammarList || window.webkitSpeechGrammarList;
                            if (SpeechGrammarList) {
                                const speechGrammarList = new SpeechGrammarList();
                                const grammar = '#JSGF V1.0; grammar hints; public <hint> = ' + prof.recognitionHints.join(' | ') + ' ;';
                                speechGrammarList.addFromString(grammar, 1);
                                recognition.grammars = speechGrammarList;
                            }
                        }
                    }
                } catch (e) {
                    // Ignore grammar list errors silently
                }

                clearSilenceTimer();
            };
            recognition.onspeechstart = () => {
                resetSilenceTimer();
            };
            recognition.onsoundstart = () => {
                resetSilenceTimer();
            };
            recognition.onend = () => {
                btnMic.classList.remove('listening');
                clearSilenceTimer();
                if (accumulatedTranscript && accumulatedTranscript.trim()) {
                    const finalPhrase = accumulatedTranscript.trim();
                    const alts = [...accumulatedAlternatives];
                    accumulatedTranscript = "";
                    accumulatedAlternatives = [];
                    comparePronunciation(finalPhrase, alts);
                }
            };
            recognition.onresult = (event) => {
                resetSilenceTimer();
                let currentText = "";
                let currentAlts = [];
                for (let i = 0; i < event.results.length; i++) {
                    const res = event.results[i];
                    if (res && res[0] && res[0].transcript) {
                        currentText += " " + res[0].transcript;
                        for (let j = 0; j < Math.min(res.length, maxAlts); j++) {
                            if (res[j] && res[j].transcript) {
                                currentAlts.push(res[j].transcript.trim());
                            }
                        }
                    }
                }
                if (currentText.trim()) {
                    accumulatedTranscript = currentText.trim();
                    accumulatedAlternatives = currentAlts;
                }
            };
            recognition.onerror = (event) => {
                btnMic.classList.remove('listening');
                clearSilenceTimer();
                reportRuntimeIssue('Mic error', event.error);
            };
        } else {

        function applyFocusMode(enabled) {

        function initFocusMode() {

        function toggleFocusMode() {

        function isFocusModeSupported() {

        function applyFocusZoomScale(scale) {
            const isFocus = document.body.classList.contains('focus-mode');
            const card = document.querySelector('.flashcard');
            if (!card) return;

            focusZoomScale = Math.min(2.5, Math.max(1.0, Math.round(scale * 100) / 100));
            setRuntimeCssVariable(card, '--focus-zoom', focusZoomScale);

            if (!isFocus || focusZoomScale <= 1.001) {
                setRuntimeStyle(card, 'zoom', '');
                card.classList.remove('zoom-pending');
                return;
            }
            setRuntimeStyle(card, 'zoom', String(focusZoomScale));
            card.classList.remove('zoom-pending');
        }

        function doesFocusZoomFit(scale) {
            if (!document.body.classList.contains('focus-mode')) return false;
            const card = document.querySelector('.flashcard');
            if (!card || !displayArea) return false;

            const originalZoom = getRuntimeStyle(card, 'zoom');
            setRuntimeStyle(card, 'zoom', String(Math.round(scale * 100) / 100));

            const areaRect = displayArea.getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();

            // 1. Kiểm tra tràn vùng hiển thị
            if (cardRect.width > areaRect.width + 1 || cardRect.height > areaRect.height + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            // 2. Kiểm tra tràn nội dung (scrollbar)
            if (card.scrollHeight > card.offsetHeight + 1 || card.scrollWidth > card.offsetWidth + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            setRuntimeStyle(card, 'zoom', originalZoom);
            return true;
        }

        function ensureFocusZoomFitsCurrentSlide() {
            if (!document.body.classList.contains('focus-mode')) {
                applyFocusZoomScale(1.0);
                return;
            }
            if (!focusAutoFitEnabled) {
                applyFocusZoomScale(1.0);
                return;
            }

            let scale = 1.0;
            let lastFitScale = 1.0;
            while (scale <= 2.5) {
                if (doesFocusZoomFit(scale)) {
                    lastFitScale = scale;
                    scale = Math.round((scale + 0.05) * 100) / 100;
                } else {
                    break;
                }
            }
            applyFocusZoomScale(lastFitScale);
        }

        window.addEventListener('resize', function () {

        // Position-aware IPA hints to reduce false positives
        function getPronunciationHint(target, spoken) {
            if (!target || !spoken) return "";

            const t = String(target).toLowerCase();
            const s = String(spoken).toLowerCase();

            // Rule 1: TH sound
            if (t.includes("th") && !s.includes("th")) {
                return "Âm /θ/ hoặc /ð/ (đặt lưỡi giữa răng)";
            }

            // Loop-based for position-aware phonetic errors
            const minLen = Math.min(t.length, s.length);
            for (let i = 0; i < minLen; i++) {
                // Rule 2: R vs L
                if (t[i] === 'r' && s[i] === 'l') {
                    return "Phân biệt /r/ (lưỡi cong) và /l/ (chạm lợi)";
                }
                // Rule 3: F vs P (ESL error)
                if (t[i] === 'f' && s[i] === 'p') {
                    return "Phân biệt /f/ (răng môi) và /p/ (bật hơi)";
                }
                // Rule 4: V vs B (ESL error)
                if (t[i] === 'v' && s[i] === 'b') {
                    return "Phân biệt /v/ và /b/";
                }
            }

            // Rule 5: Final -ed (check for sound)
            if (t.endsWith("ed")) {
                if (!s.endsWith("ed") && !s.endsWith("t") && !s.endsWith("d")) {
                    return "Đuôi -ed: /t/, /d/, hoặc /ɪd/";
                }
            }

            // Rule 6: Final -s/-es
            if (t.endsWith("s") && !s.endsWith("s")) {
                return "Đuôi -s: /s/ hoặc /z/";
            }
        }

        // [DUKE] Double Metaphone Algorithm for ESL Phonetic Matching
        function doubleMetaphone(word) {
            if (!word) return ["", ""];
            let w = String(word).toUpperCase().replace(/[^A-Z]/g, "");
            if (w.length === 0) return ["", ""];
            
            let current = 0;
            let length = w.length;
            let primary = "";
            let alternate = "";
            
            function isVowel(ch) {
                return ["A", "E", "I", "O", "U", "Y"].includes(ch);
            }
            
            while (current < length && primary.length < 4) {
                let ch = w[current];
                if (isVowel(ch)) {
                    if (current === 0) { primary += "A"; alternate += "A"; }
                    current++;
                } else if (ch === 'B') {
                    primary += 'P'; alternate += 'P';
                    current = (w[current + 1] === 'B') ? current + 2 : current + 1;
                } else if (ch === 'C') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'S'; alternate += 'S';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'D') {
                    if (w[current + 1] === 'G') {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'F' || ch === 'V') {
                    primary += 'F'; alternate += 'F';
                    current++;
                } else if (ch === 'G') {
                    if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'H') {
                    if (current === 0 || isVowel(w[current - 1])) {
                        primary += 'H'; alternate += 'H';
                    }
                    current++;
                } else if (ch === 'J') {
                    primary += 'J'; alternate += 'J';
                    current++;
                } else if (ch === 'K' || ch === 'Q') {
                    primary += 'K'; alternate += 'K';
                    current++;
                } else if (ch === 'L') {
                    primary += 'L'; alternate += 'L';
                    current++;
                } else if (ch === 'M') {
                    primary += 'M'; alternate += 'M';
                    current++;
                } else if (ch === 'N') {
                    primary += 'N'; alternate += 'N';
                    current++;
                } else if (ch === 'P') {
                    if (w[current + 1] === 'H') {
                        primary += 'F'; alternate += 'F';
                        current += 2;
                    } else {
                        primary += 'P'; alternate += 'P';
                        current++;
                    }
                } else if (ch === 'R') {
                    primary += 'R'; alternate += 'R';
                    current++;
                } else if (ch === 'S') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else {
                        primary += 'S'; alternate += 'S';
                        current++;
                    }
                } else if (ch === 'T') {
                    if (w[current + 1] === 'H') {
                        primary += '0'; alternate += '0';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'W') {
                    if (isVowel(w[current + 1])) {
                        primary += 'A'; alternate += 'A';
                    }
                    current++;
                } else if (ch === 'X') {
                    primary += 'KS'; alternate += 'KS';
                    current++;
                } else if (ch === 'Z') {
                    primary += 'S'; alternate += 'S';
                    current++;
                } else {
                    current++;
                }
            }
            return [primary, alternate];
        }

        // [DUKE] Detect Lesson Level dynamically
        function getLessonLevel() {
            if (typeof lessonLevel !== 'undefined' && lessonLevel) return lessonLevel.toUpperCase();
            const title = (document.title || "").toUpperCase();
            const path = window.location.pathname.toUpperCase();
            if (title.includes("LEVEL A") || path.includes("LEVEL A") || path.includes("LEVEL_A") || path.includes("A4. LUYEN NGHE")) return "A";
            if (title.includes("LEVEL C") || path.includes("LEVEL C") || path.includes("LEVEL_C") || path.includes("C4. LUYEN NGHE")) return "C";
            if (title.includes("LEVEL B") || path.includes("LEVEL B") || path.includes("LEVEL_B") || path.includes("B4. LUYEN NGHE")) return "B";
            return "B";
        }

        function comparePronunciation(spokenText, alternatives) {
            try {
                if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                const data = GAME_SESSION[currentIndex];
                if (data) data.attemptCount = (data.attemptCount || 0) + 1;

                const profile = (LESSON_SCORING_PROFILES && LESSON_SCORING_PROFILES[currentIndex]) ? LESSON_SCORING_PROFILES[currentIndex] : null;
                if (!profile || (profile.schemaVersion !== "2.0.0" && profile.schemaVersion !== "2.0.1")) {
                    console.error("[Listening Scoring] Invalid scoring profile v2 at index", currentIndex);
                    alert("Dữ liệu chấm không hợp lệ. Vui lòng tải lại bài học.");
                    return;
                }

                if (typeof ListeningScoringCore === 'undefined' || typeof ListeningScoringCore.scoreCandidates !== 'function') {
                    console.error("[Listening Scoring] ListeningScoringCore is missing");
                    alert("Bộ chấm điểm lõi chưa được nạp. Vui lòng tải lại bài học.");
                    return;
                }

                const candidates = [];
                if (spokenText && typeof spokenText === 'string' && spokenText.trim()) {
                    candidates.push(spokenText.trim());
                }
                if (Array.isArray(alternatives)) {
                    alternatives.forEach(alt => {
                        if (alt && typeof alt === 'string' && alt.trim() && !candidates.includes(alt.trim())) {
                            candidates.push(alt.trim());
                        }
                    });
                }
                if (candidates.length === 0) {
                    candidates.push("");
                }

                const lvl = getLessonLevel();
                const scoreResult = ListeningScoringCore.scoreCandidates(profile, candidates, lvl);

                const accuracy = scoreResult.finalScore;
                const isPass = scoreResult.isPass;
                const pScore = scoreResult.passScore;

                let htmlResult = '';
                if (Array.isArray(scoreResult.tokenScores)) {
                    scoreResult.tokenScores.forEach(t => {
                        if (t.status === 'correct') {
                            htmlResult += `<span class="w-correct" title="Chính xác">${t.display}</span> `;
                        } else if (t.status === 'near') {
                            htmlResult += `<span class="w-close" title="Gần đúng">${t.display}</span> `;
                        } else if (t.status === 'ignored') {
                            htmlResult += `<span class="w-skip" title="Được tha thứ (không tính điểm)">${t.display}</span> `;
                        } else if (t.status === 'incorrect') {
                            htmlResult += `<span class="w-wrong" title="Phát âm chưa chính xác">${t.display}</span> `;
                        } else {
                            reportRuntimeIssue('Unknown token status', { status: t.status, index: currentIndex });
                            htmlResult += `<span class="w-wrong" title="Trạng thái không xác định">${t.display}</span> `;
                        }
                    });
                }

                // Record attempt history
                if (data) {
                    data.attemptsHistory = data.attemptsHistory || [];
                    data.attemptsHistory.push(accuracy);
                }

                let isEncouraged = false;
                if (!isPass && data && data.attemptCount >= 3) {
                    const last3 = data.attemptsHistory.slice(-3);
                    if (last3.length >= 3 && last3.every(s => s < pScore)) {
                        const minScore = Math.min(...last3);
                        const maxScore = Math.max(...last3);
                        if ((maxScore - minScore) <= 15) {
                            isEncouraged = true;
                        }
                    }
                }

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');

                const badgeClass = isPass ? "score-perfect" : "score-bad";
                const badgeText = isPass ? `PASS: ${accuracy}%` : (isEncouraged ? `Hãy về luyện tập thêm nhé! (${accuracy}%)` : `FAIL: ${accuracy}%`);

                feedbackBox.innerHTML = `
                    <div class="speech-score-badge ${badgeClass}">${badgeText}</div>
                    <div class="speech-detail">${htmlResult}</div>
                `;

                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const bottomArea = document.querySelector('.card-bottom-area');
                if (bottomArea) {
                    bottomArea.appendChild(feedbackBox);
                } else {
                    const flashcard = document.querySelector('.flashcard');
                    if (flashcard) flashcard.appendChild(feedbackBox);
                }

                if (isGameMode && isPass) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && !data.isFinished) {
                        data.isFinished = true;
                        renderProgressBar();
                        updateMicStatus();
                    }

                    // Thưởng tim cho câu PASS ngay lần đầu 
                    if (data && data.attemptCount === 1 && !data.hasEarnedHeart) {
                        globalHearts++;
                        data.hasEarnedHeart = true;
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
                    }
                }

            } catch (err) {
                reportRuntimeIssue('Pronunciation scoring error', err);
                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');
                feedbackBox.innerHTML = `
                    <div class="speech-score-badge score-bad">CÓ LỖI KHI CHẤM</div>
                    <div class="speech-detail compact">
                        Thầy/cô hãy bấm F5 để tải lại trang. Nếu vẫn lỗi, gửi file này cho tôi để sửa tiếp.
                    </div>
                `;

                const bottomArea = document.querySelector('.card-bottom-area');
                if (bottomArea) {
                    bottomArea.appendChild(feedbackBox);
                } else {
                    const flashcard = document.querySelector('.flashcard');
                    if (flashcard) flashcard.appendChild(feedbackBox);
                }
            }
        }

        function showHealEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.classList.add('w-correct');
                badge.innerText = "+1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        document.addEventListener('keydown', function (event) {
            // Skip shortcuts if user is typing in an input field
            const target = event.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;

            const isIPA = document.body.getAttribute('data-mode') === 'ipa';
            const supportsFocus = isFocusModeSupported();
            const isFocus = document.body.classList.contains('focus-mode');

            if (supportsFocus) {
                // Focus Toggle (F)
                if (event.key.toLowerCase() === 'f') {
                    event.preventDefault();
                    toggleFocusMode();
                    return;
                }

                // Focus-specific Zoom/Esc
                if (isFocus) {
                    // Escape to exit focus
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        applyFocusMode(false);
                        return;
                    }
                    // Zoom controls
                    if (event.key === '=') {
                        event.preventDefault();
                        focusAutoFitEnabled = true;
                        ensureFocusZoomFitsCurrentSlide();
                        return;
                    }
                    if (event.key === '-') {
                        event.preventDefault();
                        focusAutoFitEnabled = false;
                        applyFocusZoomScale(1.0);
                        return;
                    }
                }
            }

            if (isIPA) {
                // IPA Visibility (1-4) - Both inside and outside focus
                if (event.key === '1') { setIPAVisibility(1); return; }
                if (event.key === '2') { setIPAVisibility(2); return; }
                if (event.key === '3') { setIPAVisibility(3); return; }
                if (event.key === '4') { setIPAVisibility(4); return; }
            }

            if (event.code === 'Space') { event.preventDefault(); handlePlayClick(); }
            else if (event.code === 'ArrowRight') goNext();
            else if (event.code === 'ArrowLeft') goPrev();
            else if (event.code === 'Enter') { event.preventDefault(); toggleMic(); }

            // [DUKE UPDATE] Logic phím tắt trong Game Mode
            if (isGameMode && !isGameFinished) {
                const key = event.key.toLowerCase();

                // Trừ Tim (Trọng tài)
                if (event.key === '`') {
                    if (globalHearts > 0) {
                        globalHearts--;
                        showDamageEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        if (globalHearts <= 0) finishGameGlobal(false);
                    }
                }
                // Cộng Tim (Trọng tài)
                else if (event.key === '1') {
                    if (globalHearts < maxGlobalHearts) { // Giới hạn max tim, hoặc bỏ check này nếu muốn cộng thoải mái
                        globalHearts++;
                        showHealEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                    }
                }

                else if (key === 'r') refereeReplay();
                else if (key === 'p') { isTimerPaused = !isTimerPaused; updateTimerDisplay(); }
                else if (event.key === '+' || event.key === '=') { timeLeft += 10; updateTimerDisplay(); }
                else if (event.key === '-' || event.key === '_') { timeLeft = Math.max(0, timeLeft - 10); updateTimerDisplay(); }
                else if (key === 'g') toggleGameMode();
            } else {
                const key = event.key.toLowerCase();
                if (key === 'g') {
                    toggleGameMode();
                } else if (key === 'a') {
                    const btnAuto = document.getElementById('btn-auto');
                    if (btnAuto && !btnAuto.disabled) {
                        playAuto();
                    }
                }
            }
        });

        renderCard(0);
    </script>
</body>

</html>
