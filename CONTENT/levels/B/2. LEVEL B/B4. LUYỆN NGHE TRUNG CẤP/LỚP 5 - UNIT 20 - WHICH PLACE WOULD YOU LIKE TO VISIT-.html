        function initTimer() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            if (timerInterval) clearInterval(timerInterval);
            setVisible(timerDisplay, true);
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                // CHỈ đếm ngược khi: đang chạy AND không tạm dừng AND còn thời gian
                if (isTimerRunning && !isTimerPaused && timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else if (timeLeft <= 0 && isTimerRunning) {
                    clearInterval(timerInterval);
                    finishGameGlobal(false);
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            if (!timerDisplay) return; // [DUKE] Guard: IPA mode has no timer element
            const m = Math.floor(timeLeft / 60);
            const s = timeLeft % 60;
            timerDisplay.innerText = `⏰ ${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;

            if (isTimerPaused || !isTimerRunning) timerDisplay.classList.add('paused');
            else timerDisplay.classList.remove('paused');

            if (timeLeft < 30) timerDisplay.classList.add('low-time');
            else timerDisplay.classList.remove('low-time');
        }

        function toggleGameMode(forceState) {
            hardStopAudio();
            autoPlayMode = false;
            isPlaying = false;
            isGameMode = typeof forceState === 'boolean' ? forceState : !isGameMode;
            updateGameModeToggleUI();

            if (isGameMode) {
                if (btnGame) btnGame.classList.add('active');
                if (btnSub) btnSub.disabled = true;
                btnAuto.disabled = true;
                btnAuto.classList.add('disabled');

                if (!hasGameStarted) {
                    maxGlobalHearts = lessonData.length * 5;
                    globalHearts = maxGlobalHearts;
                    totalReplays = 0;
                    timeLeft = lessonData.length * CONST_TIME_PER_SENTENCE;
                    isGameFinished = false;
                    hasGameStarted = true;

                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    isTimerRunning = false; // Bắt đầu game chưa chạy ngay, đợi bấm nghe
                    initTimer();
                } else {
                    isTimerPaused = false;
                    // Quay lại game mode, timer vẫn pause cho đến khi user tương tác lại
                    isTimerRunning = false;
                    initTimer();
                }

            } else {
                if (btnGame) btnGame.classList.remove('active');
                if (btnSub) btnSub.disabled = false;
                btnAuto.disabled = false;
                btnAuto.classList.remove('disabled');

                if (timerInterval) clearInterval(timerInterval);
                isTimerPaused = true;
                isTimerRunning = false;
                setVisible(timerDisplay, false);
            }
            renderCard(currentIndex);
        }

        function initGameDataForIndex(idx) {
            if (GAME_SESSION[idx]) return;

            const item = lessonData[idx];
            const sentence = item.title || item.text;
            const targetWordsOriginal = sentence.trim().split(/\s+/);

            let bankItems = targetWordsOriginal.map(w => ({
                original: w,
                display: normalizeWord(w),
                id: `w-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                used: false
            }));

            const distractorCount = targetWordsOriginal.length;
            for (let i = 0; i < distractorCount; i++) {
                const randomWord = commonWords[Math.floor(Math.random() * commonWords.length)];
                bankItems.push({
                    original: randomWord,
                    display: normalizeWord(randomWord),
                    id: `d-${idx}-${Math.random().toString(36).substr(2, 9)}`,
                    used: false
                });
            }
            bankItems.sort(() => Math.random() - 0.5);

            GAME_SESSION[idx] = {
                targetWords: targetWordsOriginal,
                slotsState: new Array(targetWordsOriginal.length).fill(null),
                bank: bankItems,
                listenCount: 0,
                mistakes: 0,
                maxMistakes: 5,
                isLocked: false,
                isFinished: false,
                hasStarted: false,
                hasEarnedHeart: false,
                attemptCount: 0,
                attemptsHistory: []
            };
        }

        function renderGameInterface(idx) {
            const data = GAME_SESSION[idx];
            if (!data) return;

            const item = lessonData[idx];

            let slotsHTML = '';
            data.targetWords.forEach((word, i) => {
                const filledWord = data.slotsState[i];
                if (filledWord) {
                    slotsHTML += `<div class="slot filled" id="slot-${idx}-${i}">${filledWord}</div>`;
                } else {
                    slotsHTML += `<div class="slot" id="slot-${idx}-${i}">___</div>`;
                }
            });
            let livesHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;

            const shouldLockBank = data.isLocked || data.isFinished || !data.hasStarted;
            const lockedClass = shouldLockBank ? 'locked' : '';
            const blindClass = (!data.hasStarted && !data.isLocked && !data.isFinished) ? 'blind' : '';
            const activeClass = isPlaying ? 'active' : '';

            let bankHTML = '';
            data.bank.forEach((item) => {
                const usedClass = item.used ? 'used' : '';
                bankHTML += `<div class="word-chip ${usedClass}" id="${item.id}" data-chip-id="${item.id}" data-word="${escapeHtml(item.display)}">${escapeHtml(item.display)}</div>`;
            });

            let statusMsg = '';
            if (data.isLocked) statusMsg = `<div class="game-status-msg msg-locked"><i class="fa-solid fa-lock"></i> Câu này đã bị khóa</div>`;
            else if (data.isFinished) statusMsg = `<div class="game-status-msg msg-win"><i class="fa-solid fa-check-circle"></i> Hoàn thành!</div>`;


            displayArea.innerHTML = `
                <div class="flashcard ${activeClass}">
                    <div class="lives-area">${livesHTML}</div>
                    


                    <div class="sentence-slots">${slotsHTML}</div>
                    <div class="word-bank ${lockedClass} ${blindClass}">${bankHTML}</div>
                    ${statusMsg}
                </div>
            `;
        }

        function handleGameClick(chipId, clickedDisplayWord) {
            if (isProcessing) return;

            const data = GAME_SESSION[currentIndex];
            if (!data || data.isLocked || data.isFinished || !data.hasStarted) return;

            isProcessing = true;

            let foundSlotIndex = -1;
            for (let i = 0; i < data.targetWords.length; i++) {
                if (isMatch(data.targetWords[i], clickedDisplayWord) && data.slotsState[i] === null) {
                    foundSlotIndex = i;
                    break;
                }
            }

            const chipEl = document.getElementById(chipId);

            if (foundSlotIndex !== -1) {
                const targetSlotId = `slot-${currentIndex}-${foundSlotIndex}`;
                const targetSlotEl = document.getElementById(targetSlotId);

                flyEffect(chipEl, targetSlotEl, () => {
                    data.slotsState[foundSlotIndex] = data.targetWords[foundSlotIndex];
                    const bankItem = data.bank.find(b => b.id === chipId);
                    if (bankItem) bankItem.used = true;

                    // [DUKE UPDATE] Logic khi hoàn thành câu
                    if (!data.slotsState.includes(null)) {
                        data.isFinished = true;
                        isTimerRunning = false; // Ngừng timer ngay lập tức khi xong câu
                        updateTimerDisplay();   // Cập nhật UI ngay
                        checkGameGlobalFinish();
                        updateMicStatus();
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                });

            } else {
                chipEl.classList.add('wrong');
                setTimeout(() => {
                    chipEl.classList.remove('wrong');
                    showDamageEffect();
                    if (globalHearts > 0) globalHearts--;
                    data.mistakes++;
                    if (globalHearts <= 0) {
                        finishGameGlobal(false);
                    } else if (data.mistakes >= 5) {
                        data.isLocked = true;
                        isTimerRunning = false; // Khóa câu cũng dừng timer
                        updateTimerDisplay();
                        // checkGameGlobalFinish(); 
                    }
                    renderCard(currentIndex);
                    isProcessing = false;
                }, 500);
            }
        }

        function showDamageEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.innerText = "-1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        function flyEffect(sourceEl, targetEl, onComplete) {
            const srcRect = sourceEl.getBoundingClientRect();
            const tgtRect = targetEl.getBoundingClientRect();
            const clone = sourceEl.cloneNode(true);
            clone.className = 'flying-chip';
            setRuntimeStyles(clone, {
                width: srcRect.width + 'px',
                height: srcRect.height + 'px',
                top: srcRect.top + 'px',
                left: srcRect.left + 'px',
                margin: 0
            });
            document.body.appendChild(clone);
            setRuntimeStyle(sourceEl, 'opacity', '0');
            requestAnimationFrame(() => {
                setRuntimeStyles(clone, {
                    top: tgtRect.top + 'px',
                    left: tgtRect.left + 'px'
                });
            });
            setTimeout(() => {
                clone.remove();
                if (onComplete) onComplete();
            }, 500);
        }

        function checkGameGlobalFinish() {
            let allDone = true;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i] || (!GAME_SESSION[i].isFinished && !GAME_SESSION[i].isLocked)) {
                    allDone = false;
                    break;
                }
            }
            if (allDone) finishGameGlobal(true);
        }

        function finishGameGlobal(isWin) {
            if (isGameFinished) return;
            isGameFinished = true;
            if (timerInterval) clearInterval(timerInterval);

            let penaltyHearts = 0;
            for (let i = 0; i < lessonData.length; i++) {
                if (!GAME_SESSION[i]) initGameDataForIndex(i);
                const d = GAME_SESSION[i];
                if (!d.isFinished && !d.isLocked) {
                    const remaining = d.maxMistakes - d.mistakes;
                    if (remaining > 0) penaltyHearts += remaining;
                    d.isLocked = true;
                }
            }

            globalHearts = Math.max(0, globalHearts - penaltyHearts);
            document.getElementById('final-hearts').innerText = `${globalHearts}/${maxGlobalHearts}`;
            document.getElementById('final-replays').innerText = totalReplays;

            let msg = "";
            if (isWin && globalHearts > 0) {
                if (globalHearts === maxGlobalHearts) msg = "Xuất sắc! Bạn là thiên tài!";
                else if (globalHearts > maxGlobalHearts * 0.8) msg = "Giỏi quá! Cố gắng giữ phong độ nhé!";
                else msg = "Cố gắng hơn ở lần sau nhé!";
            } else {
                if (globalHearts <= 0) msg = "Tiếc quá! Bạn đã hết tim rồi.";
                else msg = "Hết giờ rồi! Cố lên nhé!";
            }

            renderCard(currentIndex);
            document.getElementById('score-message').innerText = msg;
            setTimeout(() => {
                setVisible(scoreModal, true);
                if (isWin && globalHearts > 0) confetti({ particleCount: 300, spread: 100, origin: { y: 0.6 } });
            }, 1000);
        }

        function handlePlayClick() {
            if (isPlaying) {
                hardStopAudio();
                autoPlayMode = false;

                // Nếu đang nghe mà bấm dừng thủ công trong Game Mode
                // Timer phải CHẠY LẠI nếu câu chưa xong
                if (isGameMode) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && data.hasStarted && !data.isFinished && !data.isLocked) {
                        isTimerRunning = true;
                    }
                }

                renderCard(currentIndex);
                return;
            }

            if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
            const data = GAME_SESSION[currentIndex];

            if (!isGameMode || data.isFinished || data.isLocked) {
                playCurrentSentence();
                return;
            }

            if (!data.hasStarted) {
                data.hasStarted = true;
            }

            if (data.listenCount === 0) {
                data.listenCount++;
                playCurrentSentence();
            } else {
                const isMaxListensReached = data.listenCount >= 5;
                if (!isMaxListensReached && globalHearts > 1) {
                    globalHearts--;
                    totalReplays++;
                    data.listenCount++;
                    playCurrentSentence(true);
                }
            }
        }

        function refereeReplay() {
            if (!GAME_SESSION[currentIndex]) return;
            const data = GAME_SESSION[currentIndex];
            if (!data.hasStarted) {
                data.hasStarted = true;
                if (data.listenCount === 0) data.listenCount = 1;
            }
            playCurrentSentence(false);
            renderCard(currentIndex);
        }

        function playSpeechFallback(text, isPaid) {
            if (!('speechSynthesis' in window) || !text) {
                setTimeout(onFinishSentence, 1200);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(text);
            currentUtterance = utterance;
            utterance.lang = 'en-US';
            utterance.rate = 0.92;
            utterance.pitch = 1;
            utterance.volume = 1;

            const englishVoice = window.speechSynthesis.getVoices().find(voice => /^en(-|_)/i.test(voice.lang));
            if (englishVoice) {
                utterance.voice = englishVoice;
            }

            currentAudio.isPaidListen = isPaid;
            utterance.onend = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                onFinishSentence();
            };
            utterance.onerror = () => {
                if (currentUtterance !== utterance) return;
                currentUtterance = null;
                isPlaying = false;
                iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                setTimeout(onFinishSentence, 400);
            };

            try {
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            } catch (error) {
                currentUtterance = null;
                setTimeout(onFinishSentence, 1200);
            }
        }

        // =========================================================
        // AUDIO & HARDWARE WARM-UP LOGIC
        // =========================================================
        function playCurrentSentence(isPaid = false) {
            hardStopAudio();

            // [DUKE UPDATE] Luôn tạm dừng timer khi bắt đầu nghe
            if (isGameMode) {
                isTimerRunning = false;
                updateTimerDisplay();
            }

            const audioSrc = lessonData[currentIndex].audio;
            if (!audioSrc || audioSrc.length < 50) {
                playSpeechFallback(lessonData[currentIndex].title || lessonData[currentIndex].text || '', isPaid);
                return;
            }

            currentAudio.src = audioSrc;
            currentAudio.isPaidListen = isPaid;
            currentAudio.onended = onFinishSentence;

            isPlaying = true;
            isEnded = false;
            iconPlay.className = `fa-solid ${getDmuIconClass('pause')}`;

            // --- KỸ THUẬT WARM-UP (MỒI ÂM THANH) ---
            const silentAudio = new Audio("data:audio/mp3;base64,//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//NExAAAAANIAAAAAExBTUUzLjEwMKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq");
            silentAudio.volume = 0.1;

            silentAudio.play().then(() => {
                setTimeout(() => {
                    if (isPlaying) {
                        currentAudio.play().catch(e => {
                            isPlaying = false;
                            iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                            // Nếu lỗi không play được -> Resume timer nếu cần
                            if (isGameMode && GAME_SESSION[currentIndex] && !GAME_SESSION[currentIndex].isFinished) isTimerRunning = true;
                        });
                    }
                }, 150);
            }).catch(e => {
                currentAudio.play().catch(e => {
                    isPlaying = false;
                    iconPlay.className = `fa-solid ${getDmuIconClass('play')}`;
                    if (isGameMode && GAME_SESSION[currentIndex] && !GAME_SESSION[currentIndex].isFinished) isTimerRunning = true;
                });
            });
        }

        function onFinishSentence() {
            // [DUKE UPDATE] Logic: Nghe xong MỚI chạy timer
            if (isGameMode && GAME_SESSION[currentIndex]) {
                const d = GAME_SESSION[currentIndex];
                // Chỉ chạy lại timer nếu: Đã bắt đầu + Chưa xong + Chưa khóa
                if (d.hasStarted && !d.isFinished && !d.isLocked) {
                    isTimerRunning = true;
                }
            }

            if (isGameMode && GAME_SESSION[currentIndex] && GAME_SESSION[currentIndex].listenCount === 1) {
                renderCard(currentIndex);
            }
            if (isGameMode && currentAudio.isPaidListen) {
                const badge = document.createElement('div');
                badge.className = 'cost-badge';
                badge.innerHTML = '-1 ❤️';
                btnPlay.appendChild(badge);
                setTimeout(() => { renderCard(currentIndex); }, 1000);
            }
            if (autoPlayMode) {
                if (currentIndex < lessonData.length - 1) {
                    currentIndex++;
                    if (isGameMode && !GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                    if (isGameMode) {
                        const d = GAME_SESSION[currentIndex];
                        if (d.listenCount === 0) d.listenCount++;
                        d.hasStarted = true;
                        // Auto play thì timer cứ chạy theo logic play/pause
                    }
                    renderCard(currentIndex);
                    setTimeout(() => playCurrentSentence(), 600);
                } else {
                    hardStopAudio();
                    isEnded = true;
                    isPlaying = false;
                    renderCard(currentIndex);
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: getConfettiColors() });
                }
            } else {
                isPlaying = false;
                if (!isGameMode || !currentAudio.isPaidListen) renderCard(currentIndex);
            }
        }

        function playAuto() {
            if (isPlaying && autoPlayMode) {
                hardStopAudio();
                renderCard(currentIndex);
                return;
            }
            if (isEnded) {
                currentIndex = 0;
                isEnded = false;
            }
            autoPlayMode = true;
            playCurrentSentence();
        }

        function goNext() {
            if (currentIndex < lessonData.length - 1) {
                hardStopAudio(); autoPlayMode = false; isEnded = false;
                currentIndex++;
                if (isGameMode) {
                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

                    // [DUKE UPDATE] Qua câu mới -> Dừng Timer ngay lập tức
                    // Timer sẽ chỉ chạy lại khi hàm onFinishSentence được gọi (sau khi nghe xong)
                    isTimerRunning = false;
                    updateTimerDisplay();
                }
                renderCard(currentIndex);
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                hardStopAudio(); autoPlayMode = false; isEnded = false;
                currentIndex--;
                if (isGameMode) {
                    if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);

                    // [DUKE UPDATE] Tương tự goNext, qua câu cũ cũng dừng timer chờ nghe lại
                    isTimerRunning = false;
                    updateTimerDisplay();
                }
                renderCard(currentIndex);
            }
        }

        // =========================================================
        // SPEECH RECOGNITION FEATURE
        // =========================================================
        let recognition;
        let silenceTimer = null;
        let accumulatedTranscript = "";
        let accumulatedAlternatives = [];

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = true;
            recognition.continuous = true;
            const maxAlts = (typeof lessonLevel !== 'undefined' && lessonLevel === 'C') ? 5 : 3;
            recognition.maxAlternatives = maxAlts;

            const clearSilenceTimer = () => {
                if (silenceTimer) {
                    clearTimeout(silenceTimer);
                    silenceTimer = null;
                }
            };

            const resetSilenceTimer = () => {
                clearSilenceTimer();
                silenceTimer = setTimeout(() => {
                    if (btnMic.classList.contains('listening')) {
                        try {
                            recognition.stop();
                        } catch (err) { }
                    }
                }, 1500);
            };

            recognition.onstart = () => {
                btnMic.classList.add('listening');
                hardStopAudio();
                accumulatedTranscript = "";
                accumulatedAlternatives = [];

                // Inject speech recognition hints if supported
                try {
                    if (LESSON_SCORING_PROFILES && LESSON_SCORING_PROFILES[currentIndex]) {
                        const prof = LESSON_SCORING_PROFILES[currentIndex];
                        if (prof && prof.recognitionHints && prof.recognitionHints.length > 0) {
                            const SpeechGrammarList = window.SpeechGrammarList || window.webkitSpeechGrammarList;
                            if (SpeechGrammarList) {
                                const speechGrammarList = new SpeechGrammarList();
                                const grammar = '#JSGF V1.0; grammar hints; public <hint> = ' + prof.recognitionHints.join(' | ') + ' ;';
                                speechGrammarList.addFromString(grammar, 1);
                                recognition.grammars = speechGrammarList;
                            }
                        }
                    }
                } catch (e) {
                    // Ignore grammar list errors silently
                }

                clearSilenceTimer();
            };
            recognition.onspeechstart = () => {
                resetSilenceTimer();
            };
            recognition.onsoundstart = () => {
                resetSilenceTimer();
            };
            recognition.onend = () => {
                btnMic.classList.remove('listening');
                clearSilenceTimer();
                if (accumulatedTranscript && accumulatedTranscript.trim()) {
                    const finalPhrase = accumulatedTranscript.trim();
                    const alts = [...accumulatedAlternatives];
                    accumulatedTranscript = "";
                    accumulatedAlternatives = [];
                    comparePronunciation(finalPhrase, alts);
                }
            };
            recognition.onresult = (event) => {
                resetSilenceTimer();
                let currentText = "";
                let currentAlts = [];
                for (let i = 0; i < event.results.length; i++) {
                    const res = event.results[i];
                    if (res && res[0] && res[0].transcript) {
                        currentText += " " + res[0].transcript;
                        for (let j = 0; j < Math.min(res.length, maxAlts); j++) {
                            if (res[j] && res[j].transcript) {
                                currentAlts.push(res[j].transcript.trim());
                            }
                        }
                    }
                }
                if (currentText.trim()) {
                    accumulatedTranscript = currentText.trim();
                    accumulatedAlternatives = currentAlts;
                }
            };
            recognition.onerror = (event) => {
                btnMic.classList.remove('listening');
                clearSilenceTimer();
                reportRuntimeIssue('Mic error', event.error);
            };
        } else {
            setHidden(btnMic, true);
        }

        function updateMicStatus() {
            if (!recognition) return;
            let canUseMic = true;
            if (isGameMode) {
                const data = GAME_SESSION[currentIndex];
                if (!data || !data.isFinished) canUseMic = false;
            }
            btnMic.disabled = !canUseMic;
        }

        function applyFocusMode(enabled) {
            if (!isFocusModeSupported()) return;
            const isEnabled = !!enabled;
            document.body.classList.toggle('focus-mode', isEnabled);

            focusAutoFitEnabled = true;
            if (!isEnabled) {
                focusZoomScale = 1.0;
            }

            const btn = document.querySelector('.focus-toggle-btn');
            if (btn) {
                btn.innerHTML = isEnabled
                    ? `<i class="fa-solid fa-compress" aria-hidden="true"></i>Exit (F)`
                    : `<i class="fa-solid fa-expand" aria-hidden="true"></i>Focus Mode`;
                btn.title = isEnabled
                    ? 'Thoát chế độ Focus (F hoặc Esc). Nhấn = để Auto Fit, nhấn - để về 100%.'
                    : 'Bật chế độ Focus (F). Trong Focus: = Auto Fit, - về 100%.';
            }

            applyFocusZoomScale(focusZoomScale);
            // [DUKE] Re-render ensures the card is fresh and fits perfectly
            renderCard(currentIndex);
        }

        function initFocusMode() {
            if (!isFocusModeSupported()) return;
            try {
                localStorage.removeItem(FOCUS_MODE_KEY);
            } catch (err) { }
            document.body.classList.remove('focus-mode');
            focusZoomScale = 1.0;
            focusAutoFitEnabled = true;
        }

        function toggleFocusMode() {
            if (!isFocusModeSupported()) return;
            const isFocus = !document.body.classList.contains('focus-mode');
            applyFocusMode(isFocus);
        }

        function isFocusModeSupported() {
            const mode = document.body.getAttribute('data-mode');
            return mode === 'ipa' || mode === 'listening';
        }

        function applyFocusZoomScale(scale) {
            const isFocus = document.body.classList.contains('focus-mode');
            const card = document.querySelector('.flashcard');
            if (!card) return;

            focusZoomScale = Math.min(2.5, Math.max(1.0, Math.round(scale * 100) / 100));
            setRuntimeCssVariable(card, '--focus-zoom', focusZoomScale);

            if (!isFocus || focusZoomScale <= 1.001) {
                setRuntimeStyle(card, 'zoom', '');
                card.classList.remove('zoom-pending');
                return;
            }
            setRuntimeStyle(card, 'zoom', String(focusZoomScale));
            card.classList.remove('zoom-pending');
        }

        function doesFocusZoomFit(scale) {
            if (!document.body.classList.contains('focus-mode')) return false;
            const card = document.querySelector('.flashcard');
            if (!card || !displayArea) return false;

            const originalZoom = getRuntimeStyle(card, 'zoom');
            setRuntimeStyle(card, 'zoom', String(Math.round(scale * 100) / 100));

            const areaRect = displayArea.getBoundingClientRect();
            const cardRect = card.getBoundingClientRect();

            // 1. Kiểm tra tràn vùng hiển thị
            if (cardRect.width > areaRect.width + 1 || cardRect.height > areaRect.height + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            // 2. Kiểm tra tràn nội dung (scrollbar)
            if (card.scrollHeight > card.offsetHeight + 1 || card.scrollWidth > card.offsetWidth + 1) {
                setRuntimeStyle(card, 'zoom', originalZoom);
                return false;
            }

            setRuntimeStyle(card, 'zoom', originalZoom);
            return true;
        }

        function ensureFocusZoomFitsCurrentSlide() {
            if (!document.body.classList.contains('focus-mode')) {
                applyFocusZoomScale(1.0);
                return;
            }
            if (!focusAutoFitEnabled) {
                applyFocusZoomScale(1.0);
                return;
            }

            let scale = 1.0;
            let lastFitScale = 1.0;
            while (scale <= 2.5) {
                if (doesFocusZoomFit(scale)) {
                    lastFitScale = scale;
                    scale = Math.round((scale + 0.05) * 100) / 100;
                } else {
                    break;
                }
            }
            applyFocusZoomScale(lastFitScale);
        }

        window.addEventListener('resize', function () {
            if (document.body.classList.contains('focus-mode')) {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        ensureFocusZoomFitsCurrentSlide();
                    });
                });
            }
        });

        function setIPAVisibility(mode) {
            if (document.body.getAttribute('data-mode') !== 'ipa') return;
            const normalizedMode = Number(mode);
            document.body.classList.remove('ipa-v-1', 'ipa-v-2', 'ipa-v-3', 'ipa-v-4');
            if (normalizedMode >= 1 && normalizedMode <= 3) {
                document.body.classList.add(`ipa-v-${normalizedMode}`);
            }
        }

        function toggleMic() {
            if (btnMic.disabled) {
                btnMic.classList.remove('is-shaking');
                void btnMic.offsetWidth;
                btnMic.classList.add('is-shaking');
                setTimeout(() => btnMic.classList.remove('is-shaking'), 500);
                return;
            }
            if (btnMic.classList.contains('listening')) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        // Position-aware IPA hints to reduce false positives
        function getPronunciationHint(target, spoken) {
            if (!target || !spoken) return "";

            const t = String(target).toLowerCase();
            const s = String(spoken).toLowerCase();

            // Rule 1: TH sound
            if (t.includes("th") && !s.includes("th")) {
                return "Âm /θ/ hoặc /ð/ (đặt lưỡi giữa răng)";
            }

            // Loop-based for position-aware phonetic errors
            const minLen = Math.min(t.length, s.length);
            for (let i = 0; i < minLen; i++) {
                // Rule 2: R vs L
                if (t[i] === 'r' && s[i] === 'l') {
                    return "Phân biệt /r/ (lưỡi cong) và /l/ (chạm lợi)";
                }
                // Rule 3: F vs P (ESL error)
                if (t[i] === 'f' && s[i] === 'p') {
                    return "Phân biệt /f/ (răng môi) và /p/ (bật hơi)";
                }
                // Rule 4: V vs B (ESL error)
                if (t[i] === 'v' && s[i] === 'b') {
                    return "Phân biệt /v/ và /b/";
                }
            }

            // Rule 5: Final -ed (check for sound)
            if (t.endsWith("ed")) {
                if (!s.endsWith("ed") && !s.endsWith("t") && !s.endsWith("d")) {
                    return "Đuôi -ed: /t/, /d/, hoặc /ɪd/";
                }
            }

            // Rule 6: Final -s/-es
            if (t.endsWith("s") && !s.endsWith("s")) {
                return "Đuôi -s: /s/ hoặc /z/";
            }
        }

        // [DUKE] Double Metaphone Algorithm for ESL Phonetic Matching
        function doubleMetaphone(word) {
            if (!word) return ["", ""];
            let w = String(word).toUpperCase().replace(/[^A-Z]/g, "");
            if (w.length === 0) return ["", ""];
            
            let current = 0;
            let length = w.length;
            let primary = "";
            let alternate = "";
            
            function isVowel(ch) {
                return ["A", "E", "I", "O", "U", "Y"].includes(ch);
            }
            
            while (current < length && primary.length < 4) {
                let ch = w[current];
                if (isVowel(ch)) {
                    if (current === 0) { primary += "A"; alternate += "A"; }
                    current++;
                } else if (ch === 'B') {
                    primary += 'P'; alternate += 'P';
                    current = (w[current + 1] === 'B') ? current + 2 : current + 1;
                } else if (ch === 'C') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'S'; alternate += 'S';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'D') {
                    if (w[current + 1] === 'G') {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'F' || ch === 'V') {
                    primary += 'F'; alternate += 'F';
                    current++;
                } else if (ch === 'G') {
                    if (["I", "E", "Y"].includes(w[current + 1])) {
                        primary += 'J'; alternate += 'J';
                        current += 2;
                    } else {
                        primary += 'K'; alternate += 'K';
                        current++;
                    }
                } else if (ch === 'H') {
                    if (current === 0 || isVowel(w[current - 1])) {
                        primary += 'H'; alternate += 'H';
                    }
                    current++;
                } else if (ch === 'J') {
                    primary += 'J'; alternate += 'J';
                    current++;
                } else if (ch === 'K' || ch === 'Q') {
                    primary += 'K'; alternate += 'K';
                    current++;
                } else if (ch === 'L') {
                    primary += 'L'; alternate += 'L';
                    current++;
                } else if (ch === 'M') {
                    primary += 'M'; alternate += 'M';
                    current++;
                } else if (ch === 'N') {
                    primary += 'N'; alternate += 'N';
                    current++;
                } else if (ch === 'P') {
                    if (w[current + 1] === 'H') {
                        primary += 'F'; alternate += 'F';
                        current += 2;
                    } else {
                        primary += 'P'; alternate += 'P';
                        current++;
                    }
                } else if (ch === 'R') {
                    primary += 'R'; alternate += 'R';
                    current++;
                } else if (ch === 'S') {
                    if (w[current + 1] === 'H') {
                        primary += 'X'; alternate += 'X';
                        current += 2;
                    } else {
                        primary += 'S'; alternate += 'S';
                        current++;
                    }
                } else if (ch === 'T') {
                    if (w[current + 1] === 'H') {
                        primary += '0'; alternate += '0';
                        current += 2;
                    } else {
                        primary += 'T'; alternate += 'T';
                        current++;
                    }
                } else if (ch === 'W') {
                    if (isVowel(w[current + 1])) {
                        primary += 'A'; alternate += 'A';
                    }
                    current++;
                } else if (ch === 'X') {
                    primary += 'KS'; alternate += 'KS';
                    current++;
                } else if (ch === 'Z') {
                    primary += 'S'; alternate += 'S';
                    current++;
                } else {
                    current++;
                }
            }
            return [primary, alternate];
        }

        // [DUKE] Detect Lesson Level dynamically
        function getLessonLevel() {
            if (typeof lessonLevel !== 'undefined' && lessonLevel) return lessonLevel.toUpperCase();
            const title = (document.title || "").toUpperCase();
            const path = window.location.pathname.toUpperCase();
            if (title.includes("LEVEL A") || path.includes("LEVEL A") || path.includes("LEVEL_A") || path.includes("A4. LUYEN NGHE")) return "A";
            if (title.includes("LEVEL C") || path.includes("LEVEL C") || path.includes("LEVEL_C") || path.includes("C4. LUYEN NGHE")) return "C";
            if (title.includes("LEVEL B") || path.includes("LEVEL B") || path.includes("LEVEL_B") || path.includes("B4. LUYEN NGHE")) return "B";
            return "B";
        }

        function comparePronunciation(spokenText, alternatives) {
            try {
                if (!GAME_SESSION[currentIndex]) initGameDataForIndex(currentIndex);
                const data = GAME_SESSION[currentIndex];
                if (data) data.attemptCount = (data.attemptCount || 0) + 1;

                const profile = (LESSON_SCORING_PROFILES && LESSON_SCORING_PROFILES[currentIndex]) ? LESSON_SCORING_PROFILES[currentIndex] : null;
                if (!profile || (profile.schemaVersion !== "2.0.0" && profile.schemaVersion !== "2.0.1")) {
                    console.error("[Listening Scoring] Invalid scoring profile v2 at index", currentIndex);
                    alert("Dữ liệu chấm không hợp lệ. Vui lòng tải lại bài học.");
                    return;
                }

                if (typeof ListeningScoringCore === 'undefined' || typeof ListeningScoringCore.scoreCandidates !== 'function') {
                    console.error("[Listening Scoring] ListeningScoringCore is missing");
                    alert("Bộ chấm điểm lõi chưa được nạp. Vui lòng tải lại bài học.");
                    return;
                }

                const candidates = [];
                if (spokenText && typeof spokenText === 'string' && spokenText.trim()) {
                    candidates.push(spokenText.trim());
                }
                if (Array.isArray(alternatives)) {
                    alternatives.forEach(alt => {
                        if (alt && typeof alt === 'string' && alt.trim() && !candidates.includes(alt.trim())) {
                            candidates.push(alt.trim());
                        }
                    });
                }
                if (candidates.length === 0) {
                    candidates.push("");
                }

                const lvl = getLessonLevel();
                const scoreResult = ListeningScoringCore.scoreCandidates(profile, candidates, lvl);

                const accuracy = scoreResult.finalScore;
                const isPass = scoreResult.isPass;
                const pScore = scoreResult.passScore;

                let htmlResult = '';
                if (Array.isArray(scoreResult.tokenScores)) {
                    scoreResult.tokenScores.forEach(t => {
                        if (t.status === 'correct') {
                            htmlResult += `<span class="w-correct" title="Chính xác">${t.display}</span> `;
                        } else if (t.status === 'near') {
                            htmlResult += `<span class="w-close" title="Gần đúng">${t.display}</span> `;
                        } else if (t.status === 'ignored') {
                            htmlResult += `<span class="w-skip" title="Được tha thứ (không tính điểm)">${t.display}</span> `;
                        } else if (t.status === 'incorrect') {
                            htmlResult += `<span class="w-wrong" title="Phát âm chưa chính xác">${t.display}</span> `;
                        } else {
                            reportRuntimeIssue('Unknown token status', { status: t.status, index: currentIndex });
                            htmlResult += `<span class="w-wrong" title="Trạng thái không xác định">${t.display}</span> `;
                        }
                    });
                }

                // Record attempt history
                if (data) {
                    data.attemptsHistory = data.attemptsHistory || [];
                    data.attemptsHistory.push(accuracy);
                }

                let isEncouraged = false;
                if (!isPass && data && data.attemptCount >= 3) {
                    const last3 = data.attemptsHistory.slice(-3);
                    if (last3.length >= 3 && last3.every(s => s < pScore)) {
                        const minScore = Math.min(...last3);
                        const maxScore = Math.max(...last3);
                        if ((maxScore - minScore) <= 15) {
                            isEncouraged = true;
                        }
                    }
                }

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');

                const badgeClass = isPass ? "score-perfect" : "score-bad";
                const badgeText = isPass ? `PASS: ${accuracy}%` : (isEncouraged ? `Hãy về luyện tập thêm nhé! (${accuracy}%)` : `FAIL: ${accuracy}%`);

                feedbackBox.innerHTML = `
                    <div class="speech-score-badge ${badgeClass}">${badgeText}</div>
                    <div class="speech-detail">${htmlResult}</div>
                `;

                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const bottomArea = document.querySelector('.card-bottom-area');
                if (bottomArea) {
                    bottomArea.appendChild(feedbackBox);
                } else {
                    const flashcard = document.querySelector('.flashcard');
                    if (flashcard) flashcard.appendChild(feedbackBox);
                }

                if (isGameMode && isPass) {
                    const data = GAME_SESSION[currentIndex];
                    if (data && !data.isFinished) {
                        data.isFinished = true;
                        renderProgressBar();
                        updateMicStatus();
                    }

                    // Thưởng tim cho câu PASS ngay lần đầu 
                    if (data && data.attemptCount === 1 && !data.hasEarnedHeart) {
                        globalHearts++;
                        data.hasEarnedHeart = true;
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        confetti({ particleCount: 100, spread: 70, origin: { y: 0.7 } });
                    }
                }

            } catch (err) {
                reportRuntimeIssue('Pronunciation scoring error', err);
                const existingBox = document.querySelector('.speech-feedback-box');
                if (existingBox) existingBox.remove();

                const feedbackBox = document.createElement('div');
                feedbackBox.className = "speech-feedback-box";
                feedbackBox.classList.add('is-visible');
                feedbackBox.innerHTML = `
                    <div class="speech-score-badge score-bad">CÓ LỖI KHI CHẤM</div>
                    <div class="speech-detail compact">
                        Thầy/cô hãy bấm F5 để tải lại trang. Nếu vẫn lỗi, gửi file này cho tôi để sửa tiếp.
                    </div>
                `;

                const bottomArea = document.querySelector('.card-bottom-area');
                if (bottomArea) {
                    bottomArea.appendChild(feedbackBox);
                } else {
                    const flashcard = document.querySelector('.flashcard');
                    if (flashcard) flashcard.appendChild(feedbackBox);
                }
            }
        }

        function showHealEffect() {
            const livesArea = document.querySelector('.lives-area');
            if (livesArea) {
                const badge = document.createElement('div');
                badge.className = 'damage-badge';
                badge.classList.add('w-correct');
                badge.innerText = "+1 ❤️";
                livesArea.appendChild(badge);
                setTimeout(() => badge.remove(), 1000);
            }
        }

        document.addEventListener('keydown', function (event) {
            // Skip shortcuts if user is typing in an input field
            const target = event.target;
            if (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable) return;

            const isIPA = document.body.getAttribute('data-mode') === 'ipa';
            const supportsFocus = isFocusModeSupported();
            const isFocus = document.body.classList.contains('focus-mode');

            if (supportsFocus) {
                // Focus Toggle (F)
                if (event.key.toLowerCase() === 'f') {
                    event.preventDefault();
                    toggleFocusMode();
                    return;
                }

                // Focus-specific Zoom/Esc
                if (isFocus) {
                    // Escape to exit focus
                    if (event.key === 'Escape') {
                        event.preventDefault();
                        applyFocusMode(false);
                        return;
                    }
                    // Zoom controls
                    if (event.key === '=') {
                        event.preventDefault();
                        focusAutoFitEnabled = true;
                        ensureFocusZoomFitsCurrentSlide();
                        return;
                    }
                    if (event.key === '-') {
                        event.preventDefault();
                        focusAutoFitEnabled = false;
                        applyFocusZoomScale(1.0);
                        return;
                    }
                }
            }

            if (isIPA) {
                // IPA Visibility (1-4) - Both inside and outside focus
                if (event.key === '1') { setIPAVisibility(1); return; }
                if (event.key === '2') { setIPAVisibility(2); return; }
                if (event.key === '3') { setIPAVisibility(3); return; }
                if (event.key === '4') { setIPAVisibility(4); return; }
            }

            if (event.code === 'Space') { event.preventDefault(); handlePlayClick(); }
            else if (event.code === 'ArrowRight') goNext();
            else if (event.code === 'ArrowLeft') goPrev();
            else if (event.code === 'Enter') { event.preventDefault(); toggleMic(); }

            // [DUKE UPDATE] Logic phím tắt trong Game Mode
            if (isGameMode && !isGameFinished) {
                const key = event.key.toLowerCase();

                // Trừ Tim (Trọng tài)
                if (event.key === '`') {
                    if (globalHearts > 0) {
                        globalHearts--;
                        showDamageEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                        if (globalHearts <= 0) finishGameGlobal(false);
                    }
                }
                // Cộng Tim (Trọng tài)
                else if (event.key === '1') {
                    if (globalHearts < maxGlobalHearts) { // Giới hạn max tim, hoặc bỏ check này nếu muốn cộng thoải mái
                        globalHearts++;
                        showHealEffect();
                        const livesArea = document.querySelector('.lives-area');
                        if (livesArea) livesArea.innerHTML = `<span>${globalHearts}</span> <span class="heart-icon">❤️</span>`;
                    }
                }

                else if (key === 'r') refereeReplay();
                else if (key === 'p') { isTimerPaused = !isTimerPaused; updateTimerDisplay(); }
                else if (event.key === '+' || event.key === '=') { timeLeft += 10; updateTimerDisplay(); }
                else if (event.key === '-' || event.key === '_') { timeLeft = Math.max(0, timeLeft - 10); updateTimerDisplay(); }
                else if (key === 'g') toggleGameMode();
            } else {
                const key = event.key.toLowerCase();
                if (key === 'g') {
                    toggleGameMode();
                } else if (key === 'a') {
                    const btnAuto = document.getElementById('btn-auto');
                    if (btnAuto && !btnAuto.disabled) {
                        playAuto();
                    }
                }
            }
        });

        renderCard(0);
    </script>
