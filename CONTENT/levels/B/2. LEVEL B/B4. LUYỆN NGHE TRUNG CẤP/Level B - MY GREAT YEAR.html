        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background-color: var(--bg-color);
            background-image: var(--shell-background-image);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: var(--lesson-page-align-y);
            overflow-x: hidden;
        }

        /* BUBBLES */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: var(--ulti-rgba-255-255-255-05);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {

            padding-top: 15px;
            border-top: none;
            position: relative;
            width: 100%;
            min-height: 80px;
        }

        .control-left,
        .control-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .control-left {
            justify-content: flex-start;
        }

        .control-right {
            justify-content: flex-end;
        }

        .control-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 0 0 auto;
        }

        .btn-control {
            border: calc(var(--accent-height) / 6) solid var(--color-transparent);
            box-sizing: border-box;
            cursor: pointer;
            color: var(--color-on-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            box-shadow:var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-clip: border-box;
            background-origin: border-box;
            transition: background 0.2s, background-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s, filter 0.2s, opacity 0.2s;
        }

        .btn-control:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-sm {
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            font-size: 20px;
        }

        .btn-game {
            background-color: var(--game-purple);
        }

        .btn-game:hover {
            filter: brightness(1.1);
        }

        .btn-game.active {
            background-color: var(--ulti-hex-8e24aa);
            border: 2px solid var(--ulti-hex-fff);
            box-shadow: 0 0 10px var(--game-purple);
        }

        .btn-sub {
            background-color: var(--ulti-hex-ec407a);
        }

        .btn-sub:hover {
            filter: brightness(1.1);
        }

        .btn-sub.off {
            background-color: var(--ulti-hex-90a4ae);
        }

        .btn-sub:not(.off) {
            background-color: var(--primary-pink);
        }

        .btn-sub:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-nav {
            background-image: var(--btn-secondary-bg);
            color: var(--color-on-accent);
        }

        .btn-nav:hover {
            filter: brightness(1.04);
        }

        .btn-nav:disabled {
            opacity: 0.46;
            color: var(--ulti-hex-aaa);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-play {
            width: var(--control-play-width);
            height: var(--control-play-width);
            border-radius: 50%;
            background-image: var(--btn-primary-bg);
            font-size: 32px;
            box-shadow:var(--toggle-knob-shadow);
            margin: 0 10px;
            position: relative;
            left: auto;
            top: auto;
            transform: none;
            z-index: 5;
        }

        .btn-play:hover {
            transform: scale(1.05);
        }

        .btn-play:disabled,
        .btn-play.disabled {
            opacity: 0.46;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-auto {
            background-image: var(--btn-primary-bg);
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            font-size: 20px;
        }

        .btn-auto:hover {
            filter: brightness(1.1);
        }

        .btn-auto:disabled,
        .btn-auto.disabled {
            opacity: 0.46;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-mic {
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            background-image: var(--btn-secondary-bg);
            font-size: 20px;
        }

        .btn-mic:hover {
            transform: scale(1.1);
        }

        .btn-mic:disabled {
            opacity: 0.46;
            cursor: not-allowed;
            animation: none;
        }

        .btn-mic.listening {
            background: var(--ulti-hex-ef5350);
            animation: pulse-mic-glow 1.2s infinite ease-in-out;
        }

        .btn-mic.is-shaking {
            animation: shake var(--motion-shake-duration);
        }

        @keyframes pulse-mic-glow {
            0% {
                box-shadow: 0 0 12px #ef5350, 0 0 24px #ff1744, 0 0 36px rgba(239, 83, 80, 0.8), inset 0 0 8px #ffffff;
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 24px #ef5350, 0 0 48px #ff1744, 0 0 72px rgba(239, 83, 80, 0.95), inset 0 0 14px #ffffff;
                transform: scale(1.08);
            }

            100% {
                box-shadow: 0 0 12px #ef5350, 0 0 24px #ff1744, 0 0 36px rgba(239, 83, 80, 0.8), inset 0 0 8px #ffffff;
                transform: scale(1);
            }
        }

        .cost-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger-red);
            color: var(--color-on-accent);
            font-size: 12px;
            font-weight: var(--font-weight-strong);
            padding: 3px 8px;
            border-radius: 10px;
            border: 2px solid var(--surface-solid);
            box-shadow: 0 2px 5px var(--ulti-rgba-0-0-0-02);
            animation: popUpFade 2s forwards;
            z-index: 20;
        }

        .damage-badge {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--danger-red);
            font-weight: var(--font-weight-strong);
            font-size: 18px;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }

        @keyframes popUpFade {
            0% {
                transform: scale(0) translateY(0);
                opacity: 0;
            }

            20% {
                transform: scale(1.2) translateY(-10px);
                opacity: 1;
            }

            80% {
                transform: scale(1) translateY(-20px);
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(-30px);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-30px);
                opacity: 0;
            }
        }

        .speech-feedback-box {
            margin-top: auto;
            margin-bottom: 0;
            padding: 15px;
            background: var(--ulti-hex-fff);
            border-radius: 15px;
            border: 2px solid var(--ulti-hex-ccc);
            width: 100%;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
            box-sizing: border-box;
            max-height: 100%;
            overflow-y: auto;
            align-self: stretch;
            flex-shrink: 1;
        }

        .speech-feedback-box.is-visible {
            display: block;
        }

        .speech-score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .score-perfect {
            background: var(--success-green);
            box-shadow: 0 4px 10px var(--ulti-rgba-46-125-50-03);
        }

        .score-good {
            background: var(--orange-btn);
        }

        .score-bad {
            background: var(--danger-red);
        }

        .speech-detail {
            font-size: 1.5em;
            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        }

        .speech-detail.compact {
            margin-top: 8px;
            color: var(--ulti-hex-555);
            font-size: 1em;
        }

        .w-correct {
            color: var(--success-green);
            font-weight: var(--font-weight-strong);
        }

        .w-close {
            color: var(--orange-btn);
            font-weight: var(--font-weight-strong);
        }

        .w-wrong {
            color: var(--danger-red);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .w-skip {
            color: var(--ulti-rgba-46-125-50-078);
            font-weight: var(--font-weight-strong);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ulti-rgba-0-0-0-06);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .score-title {
            font-size: 2em;
            color: var(--game-purple);
            margin-bottom: 20px;
            font-weight: var(--font-weight-strong);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid var(--ulti-hex-eee);
            padding-bottom: 5px;
        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

        .btn-restart {
            background: var(--btn-primary-bg);
            color: var(--color-on-accent);
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin: var(--lesson-theme-row-margin);
        }

        body[data-mode="ipa"] .theme-row {
            justify-content: flex-end;
            margin: 0;
        }

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .theme-toggle-switch:not(.switch-mode) input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
            color: var(--toggle-text-checked-color);
        }

        .switch-mode.theme-toggle-switch input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
        }

        .theme-toggle-switch input:checked+.slider:before {
            transform: translateX(var(--toggle-shift));
        }

        body[data-theme="elegant"] .theme-toggle-switch .slider {
            background: var(--toggle-slider-bg);
            box-shadow: var(--toggle-slider-shadow);
        }

        body[data-theme="elegant"] .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
        }

        /* ==========================================
           STYLE ĐỀN BÙ CHO NÚT HIỆN/GAME (.switch-mode)
           ========================================== */
        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-24-169-162-008);
            border-color:var(--ulti-rgba-25-167-160-02);
            box-shadow:var(--toggle-slider-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-bg);
            border-color:var(--toggle-slider-border);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-120-144-156-03);
            border-color:var(--ulti-rgba-120-144-156-03);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-checked-bg);
            border-color:var(--toggle-slider-checked-border);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            background-image: var(--btn-secondary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            background-image: var(--btn-primary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider-text {
            color:var(--text-color);
            font-weight:var(--font-weight-extra);
            text-shadow:var(--color-transparent, transparent);
        }

        /* --- 2026 Unified Pro Theme Override (Elegant / E) --- */
        body[data-theme="elegant"] {
            --primary-pink: var(--ulti-hex-e65d6f);
            --bg-blue: var(--ulti-hex-0b0f1a);

        function normalizeWord(word) {

            let w = stripSkipMarkersFromText(word);

            w = w.replace(/[-–—]/g, " ");

        function collapseNumericalTokens(tokens) {
            const canonicalList = [];
            const originalToCanonicalIndex = new Array(tokens.length).fill(-1);

                let currentVal = 0;

                let j = i;

                while (j < n) {

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;

                                currentVal = val;
                            } else {

                                currentVal = val;
                            }

                        j++;

                        // Xử lý "point" cho số thập phân
                        if (j < n && tokens[j].toLowerCase() === "point" && (j + 1 < n) && DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] < 10) {
                            let base = totalVal + currentVal;
                            consumed.push(j); j++;
                            let dec = "";
                            while (j < n && DUKE_NUM_MAP[tokens[j].toLowerCase()] !== undefined && DUKE_NUM_MAP[tokens[j].toLowerCase()] < 10) {
                                dec += DUKE_NUM_MAP[tokens[j].toLowerCase()];
                                consumed.push(j); j++;

                            const cIdx = canonicalList.length;
                            canonicalList.push(base + "." + dec);
                            consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);

        function isMatch(a, b) {
            const na = normalizeWord(a);
            const nb = normalizeWord(b);
            if (na === nb) return true;
            if (convertNumbers(na) === convertNumbers(nb)) return true;
            return false;
        }

        function normalizeApostrophes(text) {
            // Chuẩn hóa dấu nháy cong về nháy thẳng để tránh lỗi so khớp
            return (text || "").replace(/'/g, "'");
        }

        function normalizeTranscriptForPhraseMatch(text) {
            // Chuẩn hóa transcript để kiểm tra "cụm từ" (there is / do not / ...)
            // - lowercase
            // - giữ chữ/số và apostrophe '
            // - gom khoảng trắng
            let t = normalizeApostrophes(text).toLowerCase();
            t = t.replace(/[^a-z0-9'\s]/g, " ");
            t = t.replace(/\s+/g, " ").trim();
            return t;
        }

        function contractionKeyFromRaw(rawWord) {
            // Lấy key contraction từ token gốc (VD: "There's" -> "there's")
            // Chỉ giữ chữ/số và apostrophe, bỏ dấu câu.
            let t = normalizeApostrophes(stripSkipMarkersFromText(rawWord || "")).toLowerCase();
            t = t.replace(/[^a-z0-9']/g, " ");
            t = t.replace(/\s+/g, " ").trim();
            if (!t) return "";

            const parts = t.split(" ");
            const withApos = parts.find(x => x.includes("'"));
            return (withApos || parts[0] || "").trim();
        }

        function phraseHasVariant(spokenPhrase, variant) {
            // Kiểm tra transcript có chứa biến thể (phrase) hay không,
            // nhưng "tha thứ" thêm cho trường hợp SpeechRecognition bỏ dấu nháy:
            // "there's" -> "theres" hoặc "there s"
            const base = normalizeTranscriptForPhraseMatch(variant);
            if (!base) return false;

            const s0 = normalizeTranscriptForPhraseMatch(spokenPhrase || "");
            const s = " " + s0 + " ";

            const candidates = new Set();
            candidates.add(base);

            // Nếu có apostrophe, tạo thêm 2 biến thể:
            // 1) bỏ hẳn apostrophe: "there's" -> "theres"
            // 2) thay apostrophe thành khoảng trắng: "there's" -> "there s"
            if (base.includes("'")) {
                candidates.add(base.replace(/'/g, ""));
                candidates.add(base.replace(/'/g, " "));
            }

            // Nếu không có apostrophe, vẫn thử trường hợp speech engine chèn khoảng trắng bất thường
            // (ít gặp nhưng an toàn): "dont" -> "don t"
            if (!base.includes("'") && base.length >= 4) {
                // chèn 1 khoảng trắng trước ký tự cuối để bắt dạng "there s" tương tự (heuristic nhẹ)
                candidates.add(base.slice(0, -1) + " " + base.slice(-1));
            }

            for (const v of candidates) {
                const vv = (v || "").replace(/\s+/g, " ").trim();
                if (!vv) continue;
                if (s.includes(" " + vv + " ")) return true;
            }
            return false;
        }


        // Tách chuỗi thành mảng các "từ sạch"
        // Lưu ý: normalizeWord có thể trả về chuỗi có khoảng trắng (do hyphen), nên cần tách lại lần nữa.
        function splitToCleanWords(text) {
            const parts = (text || "").trim().split(/\s+/);
            const out = [];
            parts.forEach(p => {
                const n = normalizeWord(p);
                if (!n) return;
                n.split(/\s+/).forEach(x => {
                    if (x && x.length > 0) out.push(x);
                });
            });
            return out;
        }

        function containsNonASCII(text) {
            return /[^\x00-\x7F]/.test(text || "");
        }

        function isNonEnglishWord(rawWord) {
            return containsNonASCII(rawWord);
        }

        function isAlphaWord(word) {
            return /^[a-z]+$/i.test(word);
        }

        function phoneticNormalize(word) {
            if (!word || !isAlphaWord(word)) return word;
            let w = word.toLowerCase().trim();
            w = w.replace(/ph/g, "f");
            w = w.replace(/q/g, "k");
            w = w.replace(/ck/g, "k");
            w = w.replace(/c([aou])/g, "k$1");
            w = w.replace(/x/g, "ks");
            // Removed aggressive "th -> t" rule to preserve pronunciation distinction
            if (w.length > 3 && w.endsWith("e")) w = w.slice(0, -1);
            let collapsed = "";
            for (let i = 0; i < w.length; i++) {
                if (i === 0 || w[i] !== w[i - 1]) collapsed += w[i];
            }
            return collapsed;
        }

        function isConfusionEquivalent(t, s) {
            if (t === s) return true;
            const tSet = DUKE_CONFUSION_EQUIV.get(t);
            if (tSet && tSet.has(s)) return true;
            const aliases = DUKE_LISTEN_ALIAS_MAP[t];
            if (aliases && aliases.includes(s)) return true;
            return false;
        }

        function applySkipPhrases(tokens) {
            // Flatten cleanParts for phrase searching but keep link to original token index
            const flat = [];
            tokens.forEach((t, tIdx) => {
                (t.cleanParts || []).forEach(word => flat.push({ word, tIdx }));
            });

            DUKE_SKIP_PHRASES.forEach(phrase => {
                if (!phrase || phrase.length === 0) return;
                for (let i = 0; i <= flat.length - phrase.length; i++) {
                    let match = true;
                    for (let j = 0; j < phrase.length; j++) {
                        if (flat[i + j].word !== phrase[j]) { match = false; break; }
                    }
                    if (match) {
                        for (let j = 0; j < phrase.length; j++) {
                            tokens[flat[i + j].tIdx].skip = true;
                        }
                    }
                }
            });
        }

        const DUKE_IMPORTANT_WORDS = new Set([
            // Optional manual override for important keywords
        ]);

        function isAutoImportantWord(part) {
            if (!part) return false;
            if (DUKE_ALWAYS_SKIP_WORDS.has(part)) return false;
            if (DUKE_SKIP_WORDS.has(part)) return false;
            if (!/^[a-z]+$/i.test(part)) return false;
            if (part.length <= 4) return false;
            return true;
        }

        function classifyToken(token) {
            // 1. Kiểm tra NON-ASCII (Tiếng Việt có dấu, ký tự lạ...) -> Skip
            if (containsNonASCII(token.raw)) {
                token.skip = true; return;
            }
            // 2. Tra từ điển Skip tuyệt đối (A & B)
            for (const part of token.cleanParts) {
                if (DUKE_ALWAYS_SKIP_WORDS.has(part) || DUKE_SKIP_WORDS.has(part)) {
                    token.skip = true; return;
                }
            }
            // 3. Tra từ điển Forgive (D - Soft bypass)
            for (const part of token.cleanParts) {
                if (DUKE_FORGIVE_WORDS.has(part)) {
                    token.forgive = true; return;
                }
            }
            // 4. Kiểm tra Contraction (đã cấu hình tha thứ)
            if (token.contractionKey && DUKE_FORGIVE_CONTRACTION_KEYS.has(token.contractionKey)) {
                token.skip = true; return;
            }
        }

        function calculateTokenWeight(token) {
            if (token.skip) return 0;
            const totalLen = token.cleanParts.join("").length;
            let weight = 1.0;
            if (totalLen <= 2) weight = 0.3;
            else if (totalLen <= 4) weight = 0.6;

            if (token.forgive) weight *= 0.35;

            // Auto-boost likely content words; manual set still overrides if provided
            let shouldBoost = false;
            if (!token.skip) {
                for (const part of token.cleanParts) {
                    if (DUKE_IMPORTANT_WORDS.has(part) || isAutoImportantWord(part)) {
                        shouldBoost = true;
                        break;
                    }
                }
                if (shouldBoost) {
                    weight *= 1.35;
                }
            }

            return weight;
        }

        function buildTargetTokens(originalText) {
            const rawWords = (originalText || "").trim().split(/\s+/).filter(w => w.length > 0);
            const tokens = [];
            let inBlock = false;

            rawWords.forEach(raw => {
                const hasStart = /[{[]/.test(raw);
                const hasEnd = /[}\]]/.test(raw);
                if (hasStart) inBlock = true;

                const display = stripSkipMarkersFromText(raw);
                const cleanParts = normalizeWord(raw).split(/\s+/).filter(Boolean);
                const cKey = contractionKeyFromRaw(raw);

                const token = {
                    raw,
                    display,
                    cleanParts,
                    contractionKey: cKey,
                    skip: inBlock || hasStart || hasEnd,
                    forgive: false,
                    weight: 0
                };

                classifyToken(token);
                token.weight = calculateTokenWeight(token);
                tokens.push(token);

                if (hasEnd) inBlock = false;
            });

            applySkipPhrases(tokens);
            tokens.forEach(t => {
                if (t.skip) t.weight = 0;
                else t.weight = calculateTokenWeight(t);
            });

            return tokens;
        }

        // Lightweight phoneme-aware normalization for similarity scoring
        function normalizeForSimilarity(word) {
            if (!word) return "";
            let w = String(word).toLowerCase().trim();

            // Handle IPA symbols and long vowels
            w = w.replace(/[ː:]/g, ""); // Remove length markers
            w = w.replace(/[æɑ]/g, "a");
            w = w.replace(/[ɔɒ]/g, "o");
            w = w.replace(/[ʊu]/g, "u");
            w = w.replace(/[ɪi]/g, "i");
            w = w.replace(/[ɛe]/g, "e");
            w = w.replace(/[ʌə]/g, "a");
            w = w.replace(/[ʃ]/g, "sh");
            w = w.replace(/[Ê']/g, "zh");
            w = w.replace(/[θ]/g, "th");
            w = w.replace(/[ð]/g, "th");
            w = w.replace(/[ŋ]/g, "ng");

            w = w.replace(/ph/g, "f");
            w = w.replace(/ck/g, "k");
            w = w.replace(/q/g, "k");
            w = w.replace(/x/g, "ks");
            w = w.replace(/wh/g, "w");
            w = w.replace(/ght/g, "t");
            w = w.replace(/kn/g, "n");
            w = w.replace(/wr/g, "r");
            w = w.replace(/mb$/g, "m");
            w = w.replace(/dg(e|i|y)/g, "j$1");
            w = w.replace(/tion/g, "shun");
            w = w.replace(/sion/g, "zhun");
            w = w.replace(/oo/g, "u");
            w = w.replace(/ee/g, "i");
            w = w.replace(/ea/g, "i");
            w = w.replace(/ou/g, "au");

            // Final consonant softening for stability
            w = w.replace(/z$/g, "s");
            w = w.replace(/d$/g, "t");

            return w;
        }

        // [DUKE] Smart Levenshtein Comparison for IPA/Pronunciation
        function getLevenshteinDistance(s1, s2) {
            const m = s1.length, n = s2.length;
            if (m === 0) return n; if (n === 0) return m;
            const d = Array.from({ length: m + 1 }, () => new Uint8Array(n + 1));
            for (let i = 0; i <= m; i++) d[i][0] = i;
            for (let j = 0; j <= n; j++) d[0][j] = j;
            for (let j = 1; j <= n; j++) {
                for (let i = 1; i <= m; i++) {
                    const cost = (s1[i - 1] === s2[j - 1]) ? 0 : 1;
                    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
                }
            }
            return d[m][n];
        }

        function getCharSimilarity(s1, s2) {
            if (!s1 || !s2) return (s1 === s2) ? 1.0 : 0.0;

            const n1 = normalizeForSimilarity(s1);
            const n2 = normalizeForSimilarity(s2);
            if (n1 === n2) return 1.0;

            const dist = getLevenshteinDistance(n1, n2);
            const maxLen = Math.max(n1.length, n2.length);
            return 1.0 - (dist / maxLen);
        }

        function lcsMatchIndices(a, b) {
            // Fuzzy LCS: returns array of { tIdx, sIdx, similarity }
            const n = a.length;
            const m = b.length;
            const dp = Array.from({ length: n + 1 }, () => Array(m + 1).fill(0));

            for (let i = 1; i <= n; i++) {
                for (let j = 1; j <= m; j++) {
                    const sim = getCharSimilarity(a[i - 1], b[j - 1]);
                    if (sim >= 0.6) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            const matches = [];
            let i = n, j = m;
            while (i > 0 && j > 0) {
                const sim = getCharSimilarity(a[i - 1], b[j - 1]);
                if (sim >= 0.6 && dp[i][j] > Math.max(dp[i - 1][j], dp[i][j - 1])) {
                    matches.push({ tIdx: i - 1, sIdx: j - 1, similarity: sim });
                    i--; j--;
                } else if (dp[i - 1][j] >= dp[i][j - 1]) {
                    i--;
                } else {
                    j--;
                }
            }
            return matches;
        }

        // Các hàm số học cũ đã được thay thế bằng collapseNumericalTokens()
        function hardStopAudio() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            currentUtterance = null;
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio.onended = null;
                currentAudio.src = "";
            }
            isPlaying = false;
        }

        function toggleSubTitle() {
            if (isGameMode) return;
            isSubVisible = !isSubVisible;
            updateSubButtonUI();
            const textElement = document.querySelector('.text-content');
            if (textElement) {

                else textElement.classList.add('text-hidden');

        function updateSubButtonUI() {

            } else {

        function updateGameModeToggleUI() {

                btnGame.checked = isGameMode;

            if (modeToggleText) {
                modeToggleText.textContent = isGameMode ? 'GAME' : 'HIỆN';

        }

        function jumpToSentence(index) {
            hardStopAudio();
            autoPlayMode = false;
            isPlaying = false;

            if (isGameMode) {
                if (!GAME_SESSION[index]) initGameDataForIndex(index);
                // Khi jump thủ công, ta cũng nên dừng timer cho đến khi họ bấm nghe
                isTimerRunning = false;
            }
            currentIndex = index;
            renderCard(currentIndex);
        }

        function renderProgressBar() {
            progressBarContainer.innerHTML = '';
            const total = lessonData.length;

            if (progressBarContainer) {
                if (total > 30) {
                    progressBarContainer.classList.add('wrap-mode');
                } else {
                    progressBarContainer.classList.remove('wrap-mode');
                }
            }

            for (let i = 0; i < total; i++) {
                const segment = document.createElement('div');
                segment.className = 'progress-segment';
                segment.innerText = i + 1;
                segment.onclick = () => jumpToSentence(i);

                if (i === currentIndex) {
                    segment.classList.add('active');
                }

                if (isGameMode) {
                    if (GAME_SESSION[i]) {
                        const data = GAME_SESSION[i];
                        if (data.isFinished || data.isLocked) {
                            segment.classList.add('done');
                        } else if (i < currentIndex) {
                            segment.classList.add('warn');
                        }
                    } else if (i < currentIndex) {
                        segment.classList.add('warn');
                    }
                } else {
                    if (i < currentIndex) {
                        segment.classList.add('done');
                    }
                }

                progressBarContainer.appendChild(segment);
            }
        }

        function renderCard(index) {
            if (!lessonData || lessonData.length === 0) return;

            if (!GAME_SESSION[index]) initGameDataForIndex(index);
            const data = GAME_SESSION[index];
            const item = lessonData[index];

            renderProgressBar();

            if (isGameMode) {
                const isMaxListensReached = data.listenCount >= 5;
                const isOutOfHearts = data.listenCount >= 1 && globalHearts <= 1;
                const shouldDisable = !data.isFinished && !data.isLocked && (isMaxListensReached || isOutOfHearts);

                if (shouldDisable) {
                    btnPlay.classList.add('disabled');
                    btnPlay.disabled = true;
                } else {
                    btnPlay.classList.remove('disabled');
                    btnPlay.disabled = false;
                }
            } else {
                btnPlay.classList.remove('disabled');
                btnPlay.disabled = false;
            }

            if (isGameMode) {
                renderGameInterface(index);
            } else {
                let hiddenClass = isSubVisible ? '' : 'text-hidden';
                const isIPAMode = document.body.getAttribute('data-mode') === 'ipa';
                const isFocusMode = document.body.classList.contains('focus-mode');
                const focusClass = isFocusMode ? 'zoom-pending' : '';
                const colorClass = (index % 2 === 0) ? 'dec-text-primary' : 'dec-text-secondary';

                displayArea.innerHTML = `
                    <div class="flashcard ${isPlaying ? 'active' : ''} ${focusClass}">
                        <!-- Top Spacer for Balance -->
                        <div class="card-top-area">
                            ${item.title ? `<div class="ipa-title">${item.title}</div>` : ''}
                            ${item.subtitle ? `<div class="ipa-subtitle">${item.subtitle}</div>` : ''}
                        </div>
                        
                        <!-- Middle Anchor -->
                        <div class="card-middle-area">
                            <span class="text-content ${colorClass} ${hiddenClass}">${stripSkipMarkersFromText(item.text || (isIPAMode ? '---' : ''))}</span>
                        </div>
                        
                        <!-- Bottom Spacer for Balance -->
                        <div class="card-bottom-area"></div>
                    </div>
                `;
            }

            btnPrev.disabled = (index === 0);
            btnNext.disabled = (index === lessonData.length - 1);

            if (isEnded) iconPlay.className = `fa-solid ${getDmuIconClass('replay')}`;
            else iconPlay.className = `fa-solid ${isPlaying ? getDmuIconClass('pause') : getDmuIconClass('play')}`;

            updateMicStatus();
            updateTimerDisplay(); // Cập nhật UI timer mỗi lần render

            const navStat = document.getElementById('nav-status');
            if (navStat) navStat.textContent = `${index + 1} / ${lessonData.length}`;

            const slideNavText = document.getElementById('slide-nav-text');
            if (slideNavText) slideNavText.textContent = `Slide ${index + 1}/${lessonData.length}`;

            if (isFocusModeSupported() && document.body.classList.contains('focus-mode')) {
                // [DUKE] Double-rAF ensures browser has fully painted the new card
                // before measuring dimensions for zoom calculation
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        ensureFocusZoomFitsCurrentSlide();
                    });
                });
