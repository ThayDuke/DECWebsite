        body {
            font-family: "Be Vietnam Pro", sans-serif;
            background-color: var(--bg-color);
            background-image: var(--shell-background-image);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: var(--lesson-page-align-y);
            overflow-x: hidden;
        }

        /* BUBBLES */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background-color: var(--ulti-rgba-255-255-255-05);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-top: 15px;
            border-top: none;
            position: relative;
            width: 100%;
            min-height: 80px;
        }

        .control-left,
        .control-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .control-left {
            justify-content: flex-start;
        }

        .control-right {
            justify-content: flex-end;
        }

        .control-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 0 0 auto;
        }

        .btn-control {
            border: calc(var(--accent-height) / 6) solid var(--color-transparent);
            box-sizing: border-box;
            cursor: pointer;
            color: var(--color-on-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            box-shadow:var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: 100% 100%;
            background-clip: border-box;
            background-origin: border-box;
            transition: background 0.2s, background-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s, filter 0.2s, opacity 0.2s;
        }

        .btn-control:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .btn-sm {
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            font-size: 20px;
        }

        .btn-game {
            background-color: var(--game-purple);
        }

        .btn-game:hover {
            filter: brightness(1.1);
        }

        .btn-game.active {
            background-color: var(--ulti-hex-8e24aa);
            border: 2px solid var(--ulti-hex-fff);
            box-shadow: 0 0 10px var(--game-purple);
        }

        .btn-sub {
            background-color: var(--ulti-hex-ec407a);
        }

        .btn-sub:hover {
            filter: brightness(1.1);
        }

        .btn-sub.off {
            background-color: var(--ulti-hex-90a4ae);
        }

        .btn-sub:not(.off) {
            background-color: var(--primary-pink);
        }

        .btn-sub:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-nav {
            background-image: var(--btn-secondary-bg);
            color: var(--color-on-accent);
        }

        .btn-nav:hover {
            filter: brightness(1.04);
        }

        .btn-nav:disabled {
            opacity: 0.46;
            color: var(--ulti-hex-aaa);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-play {
            width: var(--control-play-width);
            height: var(--control-play-width);
            border-radius: 50%;
            background-image: var(--btn-primary-bg);
            font-size: 32px;
            box-shadow:var(--toggle-knob-shadow);
            margin: 0 10px;
            position: relative;
            left: auto;
            top: auto;
            transform: none;
            z-index: 5;
        }

        .btn-play:hover {
            transform: scale(1.05);
        }

        .btn-play:disabled,
        .btn-play.disabled {
            opacity: 0.46;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-auto {
            background-image: var(--btn-primary-bg);
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            font-size: 20px;
        }

        .btn-auto:hover {
            filter: brightness(1.1);
        }

        .btn-auto:disabled,
        .btn-auto.disabled {
            opacity: 0.46;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-mic {
            width: 50px;
            height: 50px;
            border-radius: calc(var(--toggle-height) - var(--toggle-knob) + var(--accent-height));
            background-image: var(--btn-secondary-bg);
            font-size: 20px;
        }

        .btn-mic:hover {
            transform: scale(1.1);
        }

        .btn-mic:disabled {
            opacity: 0.46;
            cursor: not-allowed;
            animation: none;
        }

        .btn-mic.listening {
            background: var(--ulti-hex-ef5350);
            animation: pulse-mic-glow 1.2s infinite ease-in-out;
        }

        .btn-mic.is-shaking {
            animation: shake var(--motion-shake-duration);
        }

        @keyframes pulse-mic-glow {
            0% {
                box-shadow: 0 0 12px #ef5350, 0 0 24px #ff1744, 0 0 36px rgba(239, 83, 80, 0.8), inset 0 0 8px #ffffff;
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 24px #ef5350, 0 0 48px #ff1744, 0 0 72px rgba(239, 83, 80, 0.95), inset 0 0 14px #ffffff;
                transform: scale(1.08);
            }

            100% {
                box-shadow: 0 0 12px #ef5350, 0 0 24px #ff1744, 0 0 36px rgba(239, 83, 80, 0.8), inset 0 0 8px #ffffff;
                transform: scale(1);
            }
        }

        .cost-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger-red);
            color: var(--color-on-accent);
            font-size: 12px;
            font-weight: var(--font-weight-strong);
            padding: 3px 8px;
            border-radius: 10px;
            border: 2px solid var(--surface-solid);
            box-shadow: 0 2px 5px var(--ulti-rgba-0-0-0-02);
            animation: popUpFade 2s forwards;
            z-index: 20;
        }

        .damage-badge {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--danger-red);
            font-weight: var(--font-weight-strong);
            font-size: 18px;
            animation: floatUp 1s forwards;
            pointer-events: none;
        }

        @keyframes popUpFade {
            0% {
                transform: scale(0) translateY(0);
                opacity: 0;
            }

            20% {
                transform: scale(1.2) translateY(-10px);
                opacity: 1;
            }

            80% {
                transform: scale(1) translateY(-20px);
                opacity: 1;
            }

            100% {
                transform: scale(1) translateY(-30px);
                opacity: 0;
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-30px);
                opacity: 0;
            }
        }

        .speech-feedback-box {
            margin-top: auto;
            margin-bottom: 0;
            padding: 15px;
            background: var(--ulti-hex-fff);
            border-radius: 15px;
            border: 2px solid var(--ulti-hex-ccc);
            width: 100%;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
            box-sizing: border-box;
            max-height: 100%;
            overflow-y: auto;
            align-self: stretch;
            flex-shrink: 1;
        }

        .speech-feedback-box.is-visible {
            display: block;
        }

        .speech-score-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .score-perfect {
            background: var(--success-green);
            box-shadow: 0 4px 10px var(--ulti-rgba-46-125-50-03);
        }

        .score-good {
            background: var(--orange-btn);
        }

        .score-bad {
            background: var(--danger-red);
        }

        .speech-detail {
            font-size: 1.5em;
            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
        }

        .speech-detail.compact {
            margin-top: 8px;
            color: var(--ulti-hex-555);
            font-size: 1em;
        }

        .w-correct {
            color: var(--success-green);
            font-weight: var(--font-weight-strong);
        }

        .w-close {
            color: var(--orange-btn);
            font-weight: var(--font-weight-strong);
        }

        .w-wrong {
            color: var(--danger-red);
            text-decoration: line-through;
            opacity: 0.7;
        }

        .w-skip {
            color: var(--ulti-rgba-46-125-50-078);
            font-weight: var(--font-weight-strong);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--ulti-rgba-0-0-0-06);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.is-visible {
            display: flex;
        }

        .modal-content {
            background: var(--surface-solid);
            width: 90%;
            max-width: 450px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            border: 5px solid var(--primary-pink);
            box-shadow: 0 20px 50px var(--ulti-rgba-0-0-0-03);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .score-title {
            font-size: 2em;
            color: var(--game-purple);
            margin-bottom: 20px;
            font-weight: var(--font-weight-strong);
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 1.4em;
            border-bottom: 2px solid var(--ulti-hex-eee);
            padding-bottom: 5px;
        }

        .score-val {
            font-weight: var(--font-weight-strong);
            color: var(--primary-pink);
        }

        .score-message {
            margin-top: 20px;
            color: var(--ulti-hex-666);
            font-style: italic;
        }

        .btn-restart {
            background: var(--btn-primary-bg);
            color: var(--color-on-accent);
            border: none;
            padding: 10px 30px;
            font-size: 1.2em;
            border-radius: 50px;
            margin-top: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--accent-height);
            font-family: inherit;
            font-weight: var(--font-weight-strong);
            box-shadow:var(--btn-restart-shadow, 0 0.3125rem 0 var(--ulti-hex-5a4050));
        }

        .btn-restart:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        @keyframes shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }

            75% {
                transform: translateX(-5px);
            }

            100% {
                transform: translateX(0);
            }
        }

        /* --- Theme Switcher --- */
        .theme-row {
            display: flex;
            justify-content: flex-end;
            margin: var(--lesson-theme-row-margin);
        }

        body[data-mode="ipa"] .theme-row {
            justify-content: flex-end;
            margin: 0;
        }

        .sub-header-controls {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            justify-content: stretch;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
            padding: 0 2px;
            position: relative;
            /* Anchor for absolute timer */
        }

        body[data-mode="ipa"] .sub-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        /* Hide focus button by default, show in IPA */
        .focus-toggle-btn {
            display: none;
        }

        body[data-mode="ipa"] .focus-toggle-btn {
            display: inline-flex;
        }

        /* --- New Global Theme Toggle --- */
        .theme-toggle-switch,
        .theme-toggle-switch {
            display: inline-block;
            position: relative;
            width: var(--toggle-width);
            height: var(--toggle-height);
            vertical-align: middle;
            margin: 0;
        }

        .switch-mode.theme-toggle-switch {
            grid-column: 1;
            justify-self: start;
            width: var(--toggle-width);
        }

        .theme-toggle-switch:not(.switch-mode) {
            grid-column: 3;
            justify-self: end;
        }

        .theme-toggle-switch input {
            display: none;
        }

        .theme-toggle-switch .slider {
            position: absolute;
            inset: 0;
            cursor: pointer;
            background: var(--toggle-slider-bg);
            transition: .4s;
            border-radius: var(--toggle-height);
            overflow: hidden;
            display: flex;
            align-items: center;
            box-shadow: var(--toggle-slider-shadow);
            border: 1px solid var(--toggle-slider-border);
        }

        .theme-toggle-switch .slider-text {
            width: 100%;
            position: absolute;
            left: var(--toggle-text-youth-left);
            text-align: center;
            color: var(--color-on-accent);
            font-weight: var(--font-weight-strong);
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: .4s;
            user-select: none;
            font-family: "Be Vietnam Pro", sans-serif;
            pointer-events: none;
        }

        .switch-mode.theme-toggle-switch .slider-text {
            left: var(--toggle-text-youth-left);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: normal;
            text-transform: uppercase;
        }

        .theme-toggle-switch:not(.switch-mode) .slider-text {
            color: var(--toggle-text-color);
        }

        .theme-toggle-switch .slider:before {
            position: absolute;
            content: "";
            height: var(--toggle-knob);
            width: var(--toggle-knob);
            left: 4px;
            bottom: 3px;
            box-sizing: border-box;
            border-radius: 50%;
            z-index: 2;
            box-shadow: var(--toggle-knob-shadow);
            transition: transform 0.4s ease, border-color 0.4s ease, background-color 0.4s ease, box-shadow 0.4s ease;
        }

        .theme-toggle-switch:not(.switch-mode) .slider:before {
            border: 2px solid var(--toggle-knob-border);
            background-color: var(--toggle-knob-bg);
        }

        .switch-mode.theme-toggle-switch .slider:before {
            border: 2px solid transparent;
            background-color: var(--surface-solid);
        }

        .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
            border: 1px solid var(--toggle-slider-checked-border);
        }

        .theme-toggle-switch:not(.switch-mode) input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
            color: var(--toggle-text-checked-color);
        }

        .switch-mode.theme-toggle-switch input:checked+.slider .slider-text {
            left: var(--toggle-text-elegant-left);
        }

        .theme-toggle-switch input:checked+.slider:before {
            transform: translateX(var(--toggle-shift));
        }

        body[data-theme="elegant"] .theme-toggle-switch .slider {
            background: var(--toggle-slider-bg);
            box-shadow: var(--toggle-slider-shadow);
        }

        body[data-theme="elegant"] .theme-toggle-switch input:checked+.slider {
            background: var(--toggle-slider-checked-bg);
            box-shadow:var(--toggle-slider-checked-shadow);
        }

        /* ==========================================
           STYLE ĐỀN BÙ CHO NÚT HIỆN/GAME (.switch-mode)
           ========================================== */
        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-24-169-162-008);
            border-color:var(--ulti-rgba-25-167-160-02);
            box-shadow:var(--toggle-slider-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-bg);
            border-color:var(--toggle-slider-border);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider {
            background:var(--ulti-rgba-120-144-156-03);
            border-color:var(--ulti-rgba-120-144-156-03);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider {
            background:var(--toggle-slider-checked-bg);
            border-color:var(--toggle-slider-checked-border);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            background-image: var(--btn-secondary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            background-image: var(--btn-primary-bg);
            box-shadow: var(--toggle-knob-shadow);
            background-repeat: no-repeat;
            background-size: cover;
            background-clip: border-box;
            background-origin: border-box;
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        body[data-theme="elegant"] .app-container .sub-header-controls .switch-mode.theme-toggle-switch input:checked + .slider::before {
            box-shadow:var(--toggle-knob-shadow);
        }

        .app-container .sub-header-controls .switch-mode.theme-toggle-switch .slider-text {
            color:var(--text-color);
            font-weight:var(--font-weight-extra);
            text-shadow:var(--color-transparent, transparent);
        }

        /* --- 2026 Unified Pro Theme Override (Elegant / E) --- */
        body[data-theme="elegant"] {
            --primary-pink: var(--ulti-hex-e65d6f);
            --bg-blue: var(--ulti-hex-0b0f1a);
            --bg-color: #0b1524;
            --container-bg: rgba(252, 253, 255, 0.93);
            --shell-background-image:
                radial-gradient(circle at 10% 12%, var(--ulti-rgba-132-166-210-046), var(--color-transparent) 33%),
                radial-gradient(circle at 88% 86%, var(--ulti-rgba-106-141-183-042), var(--color-transparent) 31%),
                radial-gradient(circle at 52% 6%, var(--ulti-rgba-70-104-147-028), var(--color-transparent) 44%),
                linear-gradient(150deg, var(--ulti-hex-08111c) 0%, var(--ulti-hex-132036) 43%, var(--ulti-hex-2a4667) 100%);
            --teal-main: var(--ulti-hex-14b8a6);
            --teal-dark: var(--ulti-hex-0d9488);
            --border-pink: var(--ulti-hex-ffd3d8);
            --border-main: var(--ulti-rgba-192-205-220-09);
            --text-color: var(--ulti-hex-0f172a);
            --shadow-color: var(--ulti-rgba-0-0-0-04);
            --orange-btn: var(--ulti-hex-f59e0b);
            --game-purple: var(--ulti-hex-4f46e5);
            --danger-red: var(--ulti-hex-e45757);
            --success-green: var(--ulti-hex-168a53);
            --blind-overlay: var(--ulti-rgba-15-23-42-095);
            --warn-yellow: var(--ulti-hex-fff7d1);
            --btn-primary-bg:linear-gradient(130deg,var(--ulti-hex-7e95ac) 0%,var(--ulti-hex-60758d) 100%);
            --btn-secondary-bg:linear-gradient(130deg,var(--ulti-hex-60758d) 0%,var(--ulti-hex-7e95ac) 100%);
            --accent-gradient:linear-gradient(90deg,var(--ulti-hex-7e95ac),var(--ulti-hex-60758d));
            --btn-danger-bg:linear-gradient(130deg,var(--ulti-hex-5a7089) 0%,var(--ulti-hex-3d536c) 100%);
            --toggle-slider-bg:linear-gradient(90deg,var(--ulti-hex-5b748d) 15%,var(--ulti-hex-4a637d) 85%);
            --toggle-slider-checked-bg:linear-gradient(130deg,var(--ulti-hex-55677b) 0%,var(--ulti-hex-3d536c) 100%);
            --toggle-slider-border:var(--border-main);
            --toggle-slider-checked-border:var(--border-main);
            --toggle-knob-bg:var(--ulti-hex-4a637d);
            --toggle-knob-border:var(--border-main);
            --toggle-text-color:var(--color-on-accent);
            --toggle-text-checked-color:var(--color-on-accent);
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-active-bg: linear-gradient(180deg, rgba(245, 250, 255, 0.98), rgba(255, 255, 255, 0.98));

            --muted-text: var(--ulti-hex-5b6f82);
            --adaptive-progress-empty-bg: var(--ulti-hex-eef4fb);
            --adaptive-progress-empty-text: var(--muted-text);
            --adaptive-progress-active-bg: var(--muted-text);
            --adaptive-progress-active-text: var(--color-on-accent);
            --adaptive-progress-done-bg: var(--border-main);
            --adaptive-progress-done-text: var(--muted-text);
            --adaptive-progress-warn-bg: var(--ulti-hex-ffebee);
            --adaptive-progress-warn-text: var(--muted-text);
            --progress-hover-bg: var(--ulti-rgba-120-144-156-03);

            font-family: "Be Vietnam Pro", "Segoe UI", Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: var(--shell-background-image);
            background-attachment: fixed;
            background-repeat: no-repeat;
            background-size: cover;
            padding: 12px;
            color: var(--ulti-hex-1e293b);
        }

        body[data-theme="elegant"] .bubble {
            background-color: var(--ulti-rgba-255-255-255-005);
        }

        body[data-theme="elegant"] .app-container {
            background: var(--container-bg);
            box-shadow: 0 24px 52px var(--shadow-color);
        }

        body[data-theme="elegant"] .app-container::before {
            background: linear-gradient(90deg, var(--ulti-hex-7e95ac), var(--ulti-hex-60758d));
        }

        body[data-theme="elegant"] h1 {
            font-family: "Be Vietnam Pro", "Be Vietnam Pro", sans-serif;
            color: var(--ulti-hex-1b3a57);
            font-size: var(--lesson-title-font-size);

            text-align: center;
            margin: var(--lesson-title-margin);
            line-height: var(--lesson-title-line-height);
            padding: var(--lesson-title-padding);

        }

        body[data-theme="elegant"] #lesson-title.dec-ui-game-title {
            background: var(--heading-gradient, var(--btn-primary-bg));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: var(--color-transparent, transparent);
            color: var(--color-transparent, transparent);
        }

        body[data-mode="ipa"][data-theme="elegant"] h1 {
            font-size: var(--lesson-title-font-size);

        function applyDashboardTheme(theme) {
            const normalizedTheme = theme === 'elegant' ? 'elegant' : 'youth';
            document.body.setAttribute('data-theme', normalizedTheme);

            const toggleCb = document.getElementById('themeToggleCheckbox');
            const toggleTxt = document.getElementById('themeToggleText');
            if (toggleCb) toggleCb.checked = (normalizedTheme === 'elegant');
            if (toggleTxt) toggleTxt.textContent = (normalizedTheme === 'elegant') ? 'ELEGANT' : 'YOUTH';
        }

        function switchTheme(theme) {
            setDashboardTheme(theme);
        }

        function setDashboardTheme(theme) {
            applyDashboardTheme(theme);
            try {
                localStorage.setItem(DASHBOARD_THEME_KEY, theme);
            } catch (err) {
                // localStorage can be blocked in strict browser settings.
            }
        }

        function initDashboardTheme() {
            let savedTheme = null;
            try {
                savedTheme = localStorage.getItem(DASHBOARD_THEME_KEY);
            } catch (err) {

            applyDashboardTheme(savedTheme || 'youth');

                "wasn't": "was not",
                "weren't": "were not",
                "shouldn't": "should not",
                "wouldn't": "would not",
                "couldn't": "could not"
            };

            if (contractionMap[word]) {
                word = contractionMap[word];
            } else {
                word = word.replace(/'s\b/g, "").replace(/s'\b/g, "s");
            }

            // Làm sạch 1 "mảnh" từ:
            // - Bỏ { } [ ] (đánh dấu skip)
            // - Giữ chữ, số và dấu chấm thập phân
            let w = stripSkipMarkersFromText(word);

            // Chuẩn hóa dấu gạch nối/hyphen: "twenty-one" -> "twenty one"
            w = w.replace(/[-–—]/g, " ");

            // Nếu có số, ưu tiên chuẩn hóa về chuỗi số (bỏ dấu , giữ dấu .)
            if (/\d/.test(w)) {
                w = w.replace(/,/g, "");
                w = w.replace(/[^\d.]/g, "");
                // Nếu chỉ còn dấu chấm hoặc rỗng thì fallback về chữ thường
                if (!w || w === ".") return stripSkipMarkersFromText(word).toLowerCase();
                return w.trim();
            }

            // Với chữ: thay dấu câu bằng khoảng trắng để tránh dính chữ
            w = w.replace(/[.,!?;:"''()]/g, " ");
            return w.trim().toLowerCase();
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        const DUKE_NUM_MAP = {
            "zero": 0, "one": 1, "two": 2, "three": 3, "four": 4, "five": 5, "six": 6, "seven": 7, "eight": 8, "nine": 9,
            "ten": 10, "eleven": 11, "twelve": 12, "thirteen": 13, "fourteen": 14, "fifteen": 15, "sixteen": 16, "seventeen": 17, "eighteen": 18, "nineteen": 19,
            "twenty": 20, "thirty": 30, "forty": 40, "fifty": 50, "sixty": 60, "seventy": 70, "eighty": 80, "ninety": 90,
            "hundred": 100, "thousand": 1000, "million": 1000000, "billion": 1000000000,
            "first": 1, "second": 2, "third": 3, "fourth": 4, "fifth": 5, "sixth": 6, "seventh": 7, "eighth": 8, "ninth": 9, "tenth": 10,
            "eleventh": 11, "twelfth": 12, "thirteenth": 13, "fourteenth": 14, "fifteenth": 15, "sixteenth": 16, "seventeen": 17, "eighteen": 18, "nineteenth": 19,
            "twentieth": 20, "thirtieth": 30, "fortieth": 40, "fiftieth": 50, "sixtieth": 60, "seventieth": 70, "eightieth": 80, "ninetieth": 90
        };

        /**
         * Chuyển đổi một danh sách token chữ/số thành dạng "Canonical Digit"
         * Hỗ trợ: "a hundred" -> 100, "point five" -> 0.5, "first" -> 1, year-style...
         */
        function collapseNumericalTokens(tokens) {
            const canonicalList = [];
            const originalToCanonicalIndex = new Array(tokens.length).fill(-1);

            let i = 0;
            const n = tokens.length;

            while (i < n) {
                let currentVal = 0;
                let totalVal = 0;
                let hasNumber = false;
                let j = i;
                let consumed = [];

                while (j < n) {
                    let w = tokens[j].toLowerCase();

                    // Bỏ qua "and" trong cụm số
                    if (w === "and" && hasNumber && (j + 1 < n) && (DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] !== undefined)) {
                        consumed.push(j);
                        j++;
                        w = tokens[j].toLowerCase();
                    }

                    // Xử lý "a hundred", "a thousand"
                    let val = DUKE_NUM_MAP[w];
                    if (w === "a" && (j + 1 < n)) {
                        const nextW = tokens[j + 1].toLowerCase();
                        if (["hundred", "thousand", "million", "billion"].includes(nextW)) val = 1;
                    }

                    if (val !== undefined || /^\d+(\.\d+)?$/.test(w)) {
                        hasNumber = true;
                        if (val === undefined) val = parseFloat(w);
                        consumed.push(j);

                        if (val >= 100 && val <= 1000000000) {
                            if (currentVal === 0) currentVal = 1;
                            if (val === 100) currentVal *= 100;
                            else { totalVal += currentVal * val; currentVal = 0; }
                        } else {
                            if (currentVal >= 20 && currentVal < 100 && currentVal % 10 === 0 && val < 10) {
                                currentVal += val;
                            } else if (currentVal > 0 && (val >= 10 || (currentVal >= 11 && currentVal <= 99))) {
                                totalVal += currentVal * 100;
                                currentVal = val;
                            } else {
                                totalVal += currentVal;
                                currentVal = val;
                            }
                        }
                        j++;

                        // Xử lý "point" cho số thập phân
                        if (j < n && tokens[j].toLowerCase() === "point" && (j + 1 < n) && DUKE_NUM_MAP[tokens[j + 1].toLowerCase()] < 10) {
                            let base = totalVal + currentVal;
                            consumed.push(j); j++;
                            let dec = "";
                            while (j < n && DUKE_NUM_MAP[tokens[j].toLowerCase()] !== undefined && DUKE_NUM_MAP[tokens[j].toLowerCase()] < 10) {
                                dec += DUKE_NUM_MAP[tokens[j].toLowerCase()];
                                consumed.push(j); j++;
                            }
                            const cIdx = canonicalList.length;
                            canonicalList.push(base + "." + dec);
                            consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                            i = j; hasNumber = false; break;
                        }
                    } else { break; }
                }

                if (hasNumber) {
                    const finalNum = String(totalVal + currentVal);
                    const cIdx = canonicalList.length;
                    canonicalList.push(finalNum);
                    consumed.forEach(idx => originalToCanonicalIndex[idx] = cIdx);
                    i = j;
                } else if (i < j) {
                    // Break từ point
                } else {
                    const cIdx = canonicalList.length;
                    canonicalList.push(tokens[i]);
                    originalToCanonicalIndex[i] = cIdx;
                    i++;
                }
            }
            return { canonicalList, originalToCanonicalIndex };
        }

        function convertNumbers(word) {
            const w = normalizeWord(word);
            if (DUKE_NUM_MAP[w] !== undefined) return String(DUKE_NUM_MAP[w]);
            return w;
        }

        function isMatch(a, b) {
            const na = normalizeWord(a);
            const nb = normalizeWord(b);
            if (na === nb) return true;
            if (convertNumbers(na) === convertNumbers(nb)) return true;
            return false;
        }

        function hardStopAudio() {
            if ('speechSynthesis' in window) {

            currentUtterance = null;

        function toggleSubTitle() {

        function updateSubButtonUI() {
